                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- COMPONENT: STEP 3 SCENE PROMPTS ---
    const Step3ScenePrompts = ({ projectData, onUpdateProjectData, onResetProject, onGenerateScenePrompts, onGoToStep1, isScriptModifiedAfterGenerate, isLoading }) => {
      const [copiedAll, setCopiedAll] = useState(false);
      const [copiedItemKey, setCopiedItemKey] = useState(null);
      const [toast, setToast] = useState(null);
      const [advConfig, setAdvConfig] = useState(loadAdvancedPromptConfig);
      const toastTimerRef = useRef(null);

      useEffect(() => {
        return () => { if (toastTimerRef.current) clearTimeout(toastTimerRef.current); };
      }, []);

      const showToast = (type, message) => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        setToast({ id: Date.now(), type, message });
        toastTimerRef.current = setTimeout(() => setToast(null), 3500);
      };

      const triggerCopyFeedback = (key) => {
        setCopiedItemKey(key);
        setTimeout(() => setCopiedItemKey(null), 1500);
      };

      const copyTextToClipboard = async (text) => {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.left = '-9999px';
          textarea.style.top = '-9999px';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          const successful = document.execCommand('copy');
          document.body.removeChild(textarea);
          return successful;
        } catch (e) {
          console.error('Copy fallback error:', e);
          return false;
        }
      };

      const handleCopyLocationPrompt = async (locationName, itemKey) => {
        if (!locationName || locationName === 'N/A') return;
        const cleanLoc = locationName.trim().toLowerCase();
        const envPrompts = projectData.environmentPrompts || [];
        const matched = envPrompts.find((e) => e.location && e.location.trim().toLowerCase() === cleanLoc) ||
                        envPrompts.find((e) => e.location && (e.location.trim().toLowerCase().includes(cleanLoc) || cleanLoc.includes(e.location.trim().toLowerCase())));

        if (matched) {
          const globalLang = projectData.globalLang || 'vi';
          const textToCopy = globalLang === 'vi' ? (matched.promptVi || matched.prompt) : matched.prompt;

          if (textToCopy) {
            const ok = await copyTextToClipboard(textToCopy);
            if (ok) {
              triggerCopyFeedback(itemKey);
            }
          }
        }
      };

      const handleCopyCharacterPrompt = async (charName, itemKey) => {
        if (!charName) return;
        const cleanName = charName.trim().toLowerCase();
        const indivPrompts = projectData.individualCharacterPrompts || [];
        const matched = indivPrompts.find((c) => c.characterName && c.characterName.trim().toLowerCase() === cleanName) ||
                        indivPrompts.find((c) => c.characterName && (c.characterName.trim().toLowerCase().includes(cleanName) || cleanName.includes(c.characterName.trim().toLowerCase())));

        if (matched) {
          const globalLang = projectData.globalLang || 'vi';
          const textToCopy = globalLang === 'vi' ? (matched.promptVi || matched.prompt) : matched.prompt;

          if (textToCopy) {
            const ok = await copyTextToClipboard(textToCopy);
            if (ok) {
              triggerCopyFeedback(itemKey);
            }
          }
        }
      };

      const handleCopyGroupRefPrompt = async (itemKey) => {
        const globalLang = projectData.globalLang || 'vi';
        const textToCopy = globalLang === 'vi'
          ? (projectData.characterReferencePromptVi || projectData.characterReferencePrompt)
          : projectData.characterReferencePrompt;

        if (!textToCopy) return;

        const ok = await copyTextToClipboard(textToCopy);
        if (ok) {
          triggerCopyFeedback(itemKey);
        }
      };

      const getScenePromptA = (sp) => {
        if (!sp) return { promptText: '', displayText: '' };
        return {
          promptText: processAdvancedPrompt(sp.initialFramePrompt || '', advConfig.configTextA, advConfig.isActiveA),
          displayText: processAdvancedPrompt(sp.initialFramePromptVi || sp.initialFramePrompt || '', advConfig.configTextA, advConfig.isActiveA),
        };
      };

      const getScenePromptB = (sp) => {
        if (!sp) return { promptText: '', displayText: '' };
        return {
          promptText: processAdvancedPrompt(sp.videoPrompt || '', advConfig.configTextB, advConfig.isActiveB),
          displayText: processAdvancedPrompt(sp.videoPromptVi || sp.videoPrompt || '', advConfig.configTextB, advConfig.isActiveB),
        };
      };

      const allVideoPromptsMergedVi = (projectData.scenePrompts || [])
        .map((sp, idx) => {
          const label = idx === 0 ? `[Ảnh tham chiếu 1 — mở đầu | ${sp.sceneTitle}]` : `[Ảnh tham chiếu ${sp.sceneNumber} — tiếp nối cảnh trước | ${sp.sceneTitle}]`;
          const promptB = getScenePromptB(sp);
          return `${label}\n${promptB.displayText || promptB.promptText}`;
        })
        .join('\n\n');

      const allVideoPromptsMergedEn = (projectData.scenePrompts || [])
        .map((sp, idx) => {
          const label = idx === 0 ? `[Ảnh tham chiếu 1 — mở đầu | ${sp.sceneTitle}]` : `[Ảnh tham chiếu ${sp.sceneNumber} — tiếp nối cảnh trước | ${sp.sceneTitle}]`;
          const promptB = getScenePromptB(sp);
          return `${label}\n${promptB.promptText}`;
        })
        .join('\n\n');

      const handleCopyAllVideoPrompts = async () => {
        try {
          const ok = await copyTextToClipboard(allVideoPromptsMergedEn);
          if (ok) {
            setCopiedAll(true);
            setTimeout(() => setCopiedAll(false), 2000);
          }
        } catch (err) {
          console.error('Failed to copy all video prompts: ', err);
        }
      };

      return (
        <div className="max-w-5xl mx-auto py-4 sm:py-6 px-3 sm:px-6 pb-28 space-y-4 sm:space-y-6 relative">
          {isScriptModifiedAfterGenerate && (
            <div className="p-3.5 sm:p-4 bg-amber-500/10 border border-amber-500/30 rounded-2xl text-amber-300 text-xs flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-lg">
              <div className="flex items-center gap-2">
                <Icons.AlertCircle className="w-4 h-4 text-amber-400 shrink-0" />
                <span>⚠️ Kịch bản ở Tab 1 đã thay đổi — nội dung dưới đây có thể chưa cập nhật theo, nhấn 'Tạo lại theo kịch bản mới' nếu cần đồng bộ.</span>
              </div>
              <button onClick={onGenerateScenePrompts} disabled={isLoading} className="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl text-xs shrink-0 disabled:opacity-50">
                {isLoading ? 'Đang tạo lại...' : 'Tạo lại theo kịch bản mới'}
              </button>
            </div>
          )}

          <AdvancedPromptConfig config={advConfig} onChange={setAdvConfig} />

          {projectData.scenePrompts && projectData.scenePrompts.length > 0 ? (
            <div className="space-y-5 sm:space-y-6">
              {projectData.scenePrompts.map((sp, idx) => {
                const formattedA = getScenePromptA(sp);
                const formattedB = getScenePromptB(sp);

                return (
                <div key={idx} className="bg-slate-800 border border-slate-700 rounded-2xl p-3.5 sm:p-5 shadow-lg space-y-4 hover:border-slate-600 transition-colors">
                  {/* Scene Header with Title (Row 1), Location (Row 2), and Characters/All List (Row 3) */}
                  <div className="border-b border-slate-700/80 pb-3 space-y-2.5">
                    {/* Row 1: Title & Badge */}
                    <div className="flex items-center gap-2.5 sm:gap-3">
                      <span className="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center font-bold text-xs sm:text-sm shrink-0">
                        {sp.sceneNumber < 10 ? `0${sp.sceneNumber}` : sp.sceneNumber}
                      </span>
                      <h3 className="font-bold text-slate-100 text-sm sm:text-lg tracking-tight leading-snug">{sp.sceneTitle}</h3>
                    </div>

                    {/* Row 2: Khối Địa điểm độc lập */}
                    <div className="flex items-center gap-1.5 bg-slate-900/60 p-2 sm:px-3 rounded-xl border border-slate-700/60 text-xs sm:text-sm text-slate-300">
                      <Icons.MapPin className="w-3.5 h-3.5 sm:w-4 sm:h-4 text-emerald-400 shrink-0" />
                      <span className="font-semibold text-slate-100 min-w-0">{sp.location || 'N/A'}</span>
                      {sp.location && sp.location !== 'N/A' && (
                        <button
                          onClick={() => handleCopyLocationPrompt(sp.location, `loc_${idx}`)}
                          title={`Sao chép prompt môi trường: ${sp.location}`}
                          className={`p-1 rounded-md transition-all flex items-center justify-center shrink-0 cursor-pointer ${
                            copiedItemKey === `loc_${idx}`
                              ? 'bg-emerald-600/30 text-emerald-400 border border-emerald-500/50'
                              : 'text-slate-400 hover:text-emerald-400 hover:bg-slate-800'
                          }`}
                        >
                          {copiedItemKey === `loc_${idx}` ? (
                            <Icons.Check className="w-3.5 h-3.5 text-emerald-400 shrink-0" />
                          ) : (
                            <Icons.Copy className="w-3.5 h-3.5 shrink-0" />
                          )}
                        </button>
                      )}
                    </div>

                    {/* Row 3: Khối Nhân vật & Ảnh gộp (Dạng danh sách Badge co giãn flex-wrap) */}
                    {(projectData.characterReferencePrompt || (sp.charactersPresent && sp.charactersPresent.length > 0)) && (
                      <div className="flex items-center gap-1.5 bg-slate-900/60 p-2 sm:px-3 rounded-xl border border-slate-700/60 text-xs sm:text-sm text-slate-300">
                        <Icons.Users className="w-3.5 h-3.5 sm:w-4 sm:h-4 text-indigo-400 shrink-0" />
                        <div className="inline-flex flex-wrap items-center gap-1 min-w-0 flex-1">
                          {/* Mục Ảnh gộp "All" */}
                          {projectData.characterReferencePrompt && (
                            <span className="inline-flex items-center gap-0.5 shrink-0">
                              <span className="font-semibold text-indigo-300">All</span>
                              <button
                                onClick={() => handleCopyGroupRefPrompt(`group_${idx}`)}
                                title="Sao chép prompt ảnh gộp tất cả nhân vật (16:9)"
                                className={`p-1 rounded-md transition-all flex items-center justify-center shrink-0 cursor-pointer ${
                                  copiedItemKey === `group_${idx}`
                                    ? 'bg-emerald-600/30 text-emerald-400 border border-emerald-500/50'
                                    : 'text-indigo-400 hover:text-indigo-200 hover:bg-slate-800'
                                }`}
                              >
                                {copiedItemKey === `group_${idx}` ? (
                                  <Icons.Check className="w-3.5 h-3.5 text-emerald-400 shrink-0" />
                                ) : (
                                  <Icons.Copy className="w-3.5 h-3.5 shrink-0" />
                                )}
                              </button>
                              {sp.charactersPresent && sp.charactersPresent.length > 0 && (
                                <span className="text-slate-500 mr-0.5 font-normal select-none">,</span>
                              )}
                            </span>
                          )}

                          {/* Danh sách Nhân vật riêng lẻ */}
                          {sp.charactersPresent && sp.charactersPresent.map((charName, charIdx) => {
                            const charKey = `char_${idx}__${charIdx}`;
                            const isLast = charIdx === sp.charactersPresent.length - 1;
                            return (
                              <span key={charIdx} className="inline-flex items-center gap-0.5 shrink-0 min-w-0">
                                <span className="font-semibold text-purple-300 truncate max-w-[100px] sm:max-w-[140px]" title={charName}>
                                  {charName}
                                </span>
                                <button
                                  onClick={() => handleCopyCharacterPrompt(charName, charKey)}
                                  title={`Sao chép prompt nhân vật: ${charName}`}

                        lang={projectData.globalLang || 'vi'}

                    <div className="flex flex-col space-y-2 h-full">

                        <Icons.Video className="w-4 h-4" />
                        <span>KHỐI B — PROMPT VIDEO CỦA CẢNH</span>
                      </div>
                      <PromptCard
                        title="Prompt video"
                        promptText={formattedB.promptText}
                        displayText={formattedB.displayText}
                        copyLabel="Sao chép prompt video"
                        className="flex-1"
                        lang={projectData.globalLang || 'vi'}
                        onLangChange={(newLang) => onUpdateProjectData({ ...projectData, globalLang: newLang })}
                      />
                    </div>
                  </div>
                </div>
              );
              })}
            </div>
          ) : (
            <div className="p-8 text-center text-slate-400 bg-slate-800 border border-slate-700 rounded-2xl shadow-lg">
              Đang tạo bộ prompt cảnh...
            </div>
          )}

          {/* Demo Card Guide Block (Mô phỏng 2 cột giống hệt Card Cảnh) */}
          <div className="bg-slate-800 border border-slate-700 rounded-2xl p-3.5 sm:p-5 shadow-lg space-y-4 hover:border-slate-600 transition-colors">
            {/* Header */}
            <div className="border-b border-slate-700/80 pb-3">
              <div className="flex items-center gap-2.5 sm:gap-3">
                <h3 className="font-bold text-slate-100 text-sm sm:text-lg tracking-tight leading-snug">
                  Hướng dẫn quy trình sử dụng Prompt Cảnh
                </h3>
              </div>
            </div>

            {/* 2 Columns Container */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 items-stretch">
              {/* CỘT TRÁI (KHỐI A — PROMPT ẢNH KHỞI ĐẦU CẢNH) */}
              <div className="flex flex-col space-y-2 h-full">
                <div className="flex items-center gap-1.5 text-[10px] sm:text-xs font-bold text-indigo-400 uppercase tracking-widest shrink-0">
                  <Icons.ImageIcon className="w-4 h-4" />
                  <span>Khối A: Hướng dẫn Prompt Tạo Ảnh</span>
                </div>
                <div className="bg-slate-900/90 border border-slate-700/80 rounded-xl p-3.5 sm:p-4 text-xs sm:text-sm text-slate-300 space-y-2 flex-1 flex flex-col justify-center leading-relaxed">
                  <p>1. Copy prompt này dán vào Midjourney / Flux / Ideogram để tạo 1 tấm ảnh tĩnh chuẩn cho cảnh này.</p>
                  <p>2. Lưu tấm ảnh tạo được về máy để làm ảnh tham chiếu đầu vào (Image Input) cho AI Video.</p>
                </div>
              </div>

              {/* CỘT PHẢI (KHỐI B — PROMPT VIDEO CỦA CẢNH) */}
              <div className="flex flex-col space-y-2 h-full">
                <div className="flex items-center gap-1.5 text-[10px] sm:text-xs font-bold text-amber-400 uppercase tracking-widest shrink-0">
                  <Icons.Video className="w-4 h-4" />
                  <span>Khối B: Hướng dẫn Prompt Tạo Video</span>
                </div>
                <div className="bg-slate-900/90 border border-slate-700/80 rounded-xl p-3.5 sm:p-4 text-xs sm:text-sm text-slate-300 space-y-2 flex-1 flex flex-col justify-center leading-relaxed">
                  <p>1. Mở AI Tạo Video (Kling AI, Runway Gen-3, Luma Dream Machine, Vidu...).</p>
                  <p>2. Tải tấm ảnh ở Khối A lên làm Ảnh gốc (First Frame / Image-to-Video).</p>
                  <p>3. Copy prompt Khối B này dán vào ô mô tả chuyển động/lời thoại để render ra video hoàn chỉnh.</p>
                </div>
              </div>
            </div>
          </div>

          <div className="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg space-y-3">
            <div className="flex items-center gap-2 mb-1">
              <Icons.Layers className="w-5 h-5 text-amber-400" />
              <h3 className="font-bold text-slate-100 text-base">
                Video đa ảnh tham chiếu (xem liền mạch toàn bộ cảnh)
              </h3>
            </div>

            <PromptCard
              title="Toàn bộ prompt Khối B nối tiếp theo thứ tự"
              subtitle="Dùng để rà soát tính liên tục giữa các cảnh, hoặc dán cho công cụ AI video hỗ trợ nạp nhiều ảnh tham chiếu theo thứ tự"
              promptText={allVideoPromptsMergedEn}
              displayText={allVideoPromptsMergedVi}
              badge="Nối tiếp"
              badgeColor="amber"
              copyLabel="Sao chép toàn bộ"
              lang={projectData.globalLang || 'vi'}
              onLangChange={(newLang) => onUpdateProjectData({ ...projectData, globalLang: newLang })}
            />
          </div>

          <div className="pt-4 flex justify-center">
            <button
              onClick={onResetProject}
              className="px-8 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 hover:text-white font-semibold text-sm border border-slate-700 shadow-md flex items-center gap-2 transition-all cursor-pointer"
            >
              <Icons.RotateCcw className="w-4 h-4 text-slate-400" />
              <span>Tạo dự án mới</span>
            </button>
          </div>

          {/* Fixed Bottom Action Bar */}
          <BottomBar
            onLeftClick={onGoToStep1}
            isRightDisabled={true}
          />
        </div>
      );
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const PROJECT_STORAGE_KEY = 'video_script_studio_project';

      const loadSavedProject = () => {
        try {
          const saved = localStorage.getItem(PROJECT_STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && typeof parsed === 'object') {
              return parsed;
            }
          }
        } catch (e) {
          console.warn('Failed to load saved project state:', e);
        }
        return null;
      };

      const initialSavedRef = useRef(loadSavedProject());
      const initialSaved = initialSavedRef.current;

      const [currentStep, setCurrentStep] = useState(() => initialSaved?.currentStep ?? 0);
      const [maxStepReached, setMaxStepReached] = useState(() => initialSaved?.maxStepReached ?? 1);
      const [isLoading, setIsLoading] = useState(false);
      const [loadingProgress, setLoadingProgress] = useState(0);
      const [loadingStatus, setLoadingStatus] = useState('');
      const [errorMsg, setErrorMsg] = useState(null);
      const [customApiKey, setCustomApiKey] = useState(() => getStoredApiKey());

      const handleApiKeyChange = (key) => {
        const trimmed = (key || '').trim();
        setCustomApiKey(trimmed);
        saveApiKey(trimmed);
        if (trimmed) setErrorMsg(null);
      };

      const ensureApiKeyOrShowError = () => {
        const key = getStoredApiKey();
        if (!key) {
          setErrorMsg('Chưa có Gemini API Key. Vui lòng bấm vào biểu tượng 🔑 ở góc trên bên phải để nhập API Key trước khi sử dụng.');
          return false;
        }
        return true;
      };

      const progressIntervalRef = useRef(null);

      useEffect(() => {
        if (!getStoredApiKey()) {
          setErrorMsg('Chưa có Gemini API Key. Vui lòng bấm vào biểu tượng 🔑 ở góc trên bên phải để nhập API Key trước khi sử dụng.');
        }
        return () => { if (progressIntervalRef.current) clearInterval(progressIntervalRef.current); };
      }, []);

      const startLoading = (initialStatus) => {
        setIsLoading(true);
        setLoadingProgress(10);
        setLoadingStatus(initialStatus);
        if (progressIntervalRef.current) clearInterval(progressIntervalRef.current);

        progressIntervalRef.current = setInterval(() => {
          setLoadingProgress((prev) => {
            if (prev >= 92) return prev;
            return prev + Math.max(1, Math.floor((95 - prev) / 6));
          });
        }, 350);
      };

      const updateLoadingStatus = (status) => setLoadingStatus(status);

      const stopLoading = () => {
        if (progressIntervalRef.current) {
          clearInterval(progressIntervalRef.current);
          progressIntervalRef.current = null;
        }
        setLoadingProgress(100);
        setTimeout(() => {
          setIsLoading(false);
          setLoadingProgress(0);
          setLoadingStatus('');
        }, 350);
      };

      const [rawIdea, setRawIdea] = useState(() => initialSaved?.rawIdea ?? '');
      const [projectData, setProjectData] = useState(() => initialSaved?.projectData ?? {
        title: '',
        characters: [],
        scriptNarrative: '',
        scenes: [],
        style: 'Hiện thực',
        aspectRatio: '9:16',
        includeNameTags: false,
        characterReferencePrompt: '',
        characterReferencePromptVi: '',
        individualCharacterPrompts: [],
        environmentPrompts: [],
        scenePrompts: [],
      });
      const [productInfo, setProductInfo] = useState(() => initialSaved?.productInfo ?? null);
      const [hasProductFlag, setHasProductFlag] = useState(() => initialSaved?.hasProductFlag ?? false);
      const [isScriptModifiedAfterGenerate, setIsScriptModifiedAfterGenerate] = useState(
        () => initialSaved?.isScriptModifiedAfterGenerate ?? false
      );

      // Auto-save state to localStorage whenever project data or step changes
      useEffect(() => {
        const hasContent = rawIdea || projectData.title || (projectData.scenes && projectData.scenes.length > 0) || currentStep > 0;
        if (hasContent) {
          const dataToSave = {
            currentStep,
            maxStepReached,
            rawIdea,
            projectData,
            productInfo,
            hasProductFlag,
            isScriptModifiedAfterGenerate,
            updatedAt: Date.now(),
          };
          try {
            localStorage.setItem(PROJECT_STORAGE_KEY, JSON.stringify(dataToSave));
          } catch (e) {
            console.warn('Failed to save project state to localStorage:', e);
          }
        }
      }, [
        currentStep,
        maxStepReached,
        rawIdea,
        projectData,
        productInfo,
        hasProductFlag,
        isScriptModifiedAfterGenerate,
      ]);

      const markScriptAsModified = () => {
        if (maxStepReached >= 2) setIsScriptModifiedAfterGenerate(true);
      };

      const handleResetProject = () => {
        try {
          localStorage.removeItem(PROJECT_STORAGE_KEY);
        } catch (e) {
          console.warn('Failed to remove saved project from localStorage:', e);
        }
        setCurrentStep(0);
        setMaxStepReached(1);
        setRawIdea('');
        setProjectData({
          title: '',
          characters: [],
          scriptNarrative: '',
          scenes: [],
          style: 'Hiện thực',
          aspectRatio: '9:16',
          includeNameTags: false,
          characterReferencePrompt: '',
          characterReferencePromptVi: '',
          individualCharacterPrompts: [],
          environmentPrompts: [],
          scenePrompts: [],
        });
        setProductInfo(null);
        setHasProductFlag(false);
        setErrorMsg(null);
        setIsScriptModifiedAfterGenerate(false);
      };

      const handleGenerateScript = async (idea, hasProduct, productImage) => {
        if (!ensureApiKeyOrShowError()) return;
        startLoading('Đang gửi ý tưởng tới Gemini AI để khởi tạo kịch bản...');
        setErrorMsg(null);
        setRawIdea(idea);
        setHasProductFlag(hasProduct);
        setProductInfo(productImage);

        const timer = setTimeout(() => {
          updateLoadingStatus('Đang cấu trúc tuyến nhân vật & phân cảnh chi tiết...');
        }, 2500);

        try {
          const data = await generateScriptClient({
            idea,
            hasProduct,
            productImage: productImage?.dataUrl || null,
          });

          setProjectData((prev) => ({
            ...prev,
            title: data.title || 'Dự án Video Script',
            characters: data.characters || [],
            scriptNarrative: data.scriptNarrative || '',
            scenes: data.scenes || [],
            characterReferencePrompt: '',
            individualCharacterPrompts: [],
            environmentPrompts: [],
            scenePrompts: [],
          }));

          setCurrentStep(1);
          setMaxStepReached((prev) => Math.max(prev, 1));
          setIsScriptModifiedAfterGenerate(false);
        } catch (err) {
          console.error('Error in handleGenerateScript:', err);
          setErrorMsg(err.message || 'Có lỗi xảy ra khi sinh kịch bản. Vui lòng thử lại.');
        } finally {
          clearTimeout(timer);
          stopLoading();
        }
      };

      const handleRegenerateFullScript = async () => {
        if (!ensureApiKeyOrShowError()) return;
        startLoading('Đang gọi AI viết lại toàn bộ kịch bản mới...');
        setErrorMsg(null);

        const timer = setTimeout(() => {
          updateLoadingStatus('Đang làm mới cốt truyện & danh sách phân cảnh...');
        }, 2500);

        try {
          const data = await generateScriptClient({
            idea: rawIdea,
            hasProduct: hasProductFlag,
            productImage: productInfo?.dataUrl || null,
            isRegenerate: true,
          });

          setProjectData((prev) => ({
            ...prev,
            title: data.title || prev.title,
            characters: data.characters || [],
            scriptNarrative: data.scriptNarrative || '',
            scenes: data.scenes || [],
            characterReferencePrompt: '',
            individualCharacterPrompts: [],
            environmentPrompts: [],
            scenePrompts: [],
          }));

          markScriptAsModified();
        } catch (err) {
          setErrorMsg(err.message || 'Không thể viết lại toàn bộ kịch bản. Vui lòng thử lại.');
        } finally {
          clearTimeout(timer);
          stopLoading();
        }
      };

      const handleRefineScriptWithAi = async (userRequest) => {
        if (!ensureApiKeyOrShowError()) return;
        startLoading('Đang gửi yêu cầu điều chỉnh kịch bản tới AI...');
        setErrorMsg(null);

        const timer = setTimeout(() => {
          updateLoadingStatus('Đang tinh chỉnh kịch bản theo phản hồi...');
        }, 2000);

        try {
          const data = await refineScriptClient({
            currentData: projectData,
            userRequest,
          });

          setProjectData((prev) => ({
            ...prev,
            title: data.title || prev.title,
            characters: data.characters || prev.characters,
            scriptNarrative: data.scriptNarrative || prev.scriptNarrative,
            scenes: data.scenes || prev.scenes,
          }));

          markScriptAsModified();
        } catch (err) {
          setErrorMsg(err.message || 'Không thể điều chỉnh kịch bản.');
        } finally {
          clearTimeout(timer);
          stopLoading();
        }
      };

      const handleGenerateReferencePrompts = async (overrideStyle, overrideRatio) => {
        if (!ensureApiKeyOrShowError()) return;
        startLoading('Đang khởi tạo prompt tham chiếu nhân vật & môi trường...');
        setErrorMsg(null);

        const targetStyle = overrideStyle || projectData.style;
        const targetRatio = overrideRatio || projectData.aspectRatio;

        const timer = setTimeout(() => {
          updateLoadingStatus('Đang chuẩn hóa dạng A-pose, nền trắng & sinh bản dịch song ngữ...');
        }, 2500);

        try {
          const data = await generateReferencePromptsClient({
            characters: projectData.characters,
            scenes: projectData.scenes,
            style: targetStyle,
            aspectRatio: targetRatio,
            includeNameTags: projectData.includeNameTags ?? false,
          });

          setProjectData((prev) => ({
            ...prev,
            style: targetStyle,
            aspectRatio: targetRatio,
            includeNameTags: prev.includeNameTags ?? false,
            characterReferencePrompt: data.characterReferencePrompt || '',
            characterReferencePromptVi: data.characterReferencePromptVi || '',
            individualCharacterPrompts: data.individualCharacterPrompts || [],
            environmentPrompts: data.environmentPrompts || [],
          }));

          setIsScriptModifiedAfterGenerate(false);

          if (currentStep === 1) {
            setCurrentStep(2);
            setMaxStepReached((prev) => Math.max(prev, 2));
          }
        } catch (err) {
          setErrorMsg(err.message || 'Lỗi khi sinh prompt tham chiếu.');
        } finally {
          clearTimeout(timer);
          stopLoading();
        }
      };

      const handleGenerateScenePrompts = async () => {
        if (!ensureApiKeyOrShowError()) return;
        startLoading('Đang tổng hợp kịch bản & khởi tạo prompt từng cảnh phim...');
        setErrorMsg(null);

        const timer = setTimeout(() => {
          updateLoadingStatus('Đang phân chia Khối A (Ảnh tĩnh) & Khối B (Video chuyển động)...');
        }, 2500);

        try {
          const data = await generateScenePromptsClient({
            scenes: projectData.scenes,
            characters: projectData.characters,
            style: projectData.style,
            aspectRatio: projectData.aspectRatio,
            characterReferencePrompt: projectData.characterReferencePrompt,
            environmentPrompts: projectData.environmentPrompts,
          });

          setProjectData((prev) => ({
            ...prev,
            scenePrompts: data.scenePrompts || [],
          }));

          setIsScriptModifiedAfterGenerate(false);
          setCurrentStep(3);
          setMaxStepReached(3);
        } catch (err) {
          setErrorMsg(err.message || 'Lỗi khi sinh prompt từng cảnh.');
        } finally {
          clearTimeout(timer);
          stopLoading();
        }
      };

      const hasSavedProject = Boolean(
        rawIdea || projectData.title || (projectData.scenes && projectData.scenes.length > 0) || currentStep > 0
      );

      return (
        <div className="min-h-screen flex flex-col bg-slate-900 text-slate-100 font-sans antialiased">
          <Header
            currentStep={currentStep}
            onStepClick={(step) => setCurrentStep(step)}
            maxStepReached={maxStepReached}
            customApiKey={customApiKey}
            onApiKeyChange={handleApiKeyChange}
            onResetProject={handleResetProject}
            hasSavedProject={hasSavedProject}
            globalLang={projectData.globalLang || 'vi'}
            onGlobalLangChange={(lang) => setProjectData((prev) => ({ ...prev, globalLang: lang }))}
          />

          <ProgressBar
            isLoading={isLoading}
            progress={loadingProgress}
            statusText={loadingStatus}
          />

          <main className="flex-1 transition-all duration-300">
            {errorMsg && (
              <div className="max-w-5xl mx-auto mt-4 px-4 sm:px-6">
                <div className="p-4 bg-rose-500/10 border border-rose-500/30 rounded-2xl text-rose-300 text-xs font-semibold flex items-center justify-between gap-3 shadow-lg">
                  <span>{errorMsg}</span>
                  <button onClick={() => setErrorMsg(null)} className="px-2.5 py-1 bg-rose-500/20 text-rose-200 rounded-lg text-xs">
                    Đóng
                  </button>
                </div>
              </div>
            )}

            {currentStep === 0 && (
              <Step0InputIdea
                onGenerateScript={handleGenerateScript}
                isLoading={isLoading}
              />
            )}

            {currentStep === 1 && (
              <Step1Script
                projectData={projectData}
                onUpdateProjectData={(newData) => {
                  setProjectData(newData);
                  markScriptAsModified();
                }}
                onRefineWithAi={handleRefineScriptWithAi}
                onRegenerateFullScript={handleRegenerateFullScript}
                onNextStep={() => handleGenerateReferencePrompts()}
                isLoading={isLoading}
              />
            )}

            {currentStep === 2 && (
              <Step2ReferencePrompts
                projectData={projectData}
                onUpdateProjectData={(newData) => setProjectData(newData)}
                onGenerateReferencePrompts={handleGenerateReferencePrompts}
                onNextStep={handleGenerateScenePrompts}
                onGoToStep1={() => setCurrentStep(1)}
                isScriptModifiedAfterGenerate={isScriptModifiedAfterGenerate}
                isLoading={isLoading}
              />
            )}

            {currentStep === 3 && (
              <Step3ScenePrompts
                projectData={projectData}
                onUpdateProjectData={(newData) => setProjectData(newData)}
                onResetProject={handleResetProject}
                onGenerateScenePrompts={handleGenerateScenePrompts}
                onGoToStep1={() => setCurrentStep(1)}
                isScriptModifiedAfterGenerate={isScriptModifiedAfterGenerate}
                isLoading={isLoading}
              />
            )}
          </main>

          <footer className="px-3 sm:px-6 py-2 sm:py-3 bg-slate-900 border-t border-slate-800/80 flex flex-col sm:flex-row justify-between items-center gap-2 text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider mt-auto w-full pb-20 sm:pb-3">
            <div className="flex flex-row items-center justify-center gap-3 sm:gap-4 w-full sm:w-auto">
              <div className="flex items-center gap-1.5 shrink-0">
                <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                <span className="font-semibold text-slate-300">Gemini API Sẵn sàng</span>
              </div>
              <span className="text-slate-700 hidden sm:inline">•</span>
              <div className="flex items-center gap-1.5 shrink-0">
                <div className="w-2 h-2 rounded-full bg-indigo-500"></div>
                <span className="font-semibold text-slate-300">Client-side Standalone</span>
              </div>
            </div>
            <p className="text-[9px] sm:text-[10px] text-slate-500 uppercase tracking-widest text-center sm:text-right">
              © 2024 Video Script Studio
            </p>
          </footer>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      try {
        var sourceEl = document.getElementById('app-source');
        if (!sourceEl) return;
        var sourceCode = sourceEl.textContent;
        var compiled = Babel.transform(sourceCode, {
          presets: [
            ['react', { runtime: 'classic' }]
          ]
        }).code;
        var scriptEl = document.createElement('script');
        scriptEl.text = compiled;
        document.body.appendChild(scriptEl);
      } catch (err) {
        console.error('Lỗi biên dịch Babel trong standalone.html:', err);
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="color:red;padding:2rem;font-family:sans-serif;background:#0f172a;min-height:100vh;"><h3>Lỗi khởi chạy ứng dụng:</h3><pre>' + (err.stack || err.message || err) + '</pre></div>';
        }
      }
    });
  </script>
</body>
</html>
