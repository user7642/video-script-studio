    // STEP 1 SCRIPT






interface Step1ScriptProps {
  projectData: ProjectData;
  onUpdateProjectData: (newData: ProjectData) => void;
  onRefineWithAi: (userRequest: string) => Promise<void>;
  onRegenerateFullScript: () => Promise<void>;
  onNextStep: () => Promise<void>;
  isLoading: boolean;
}

const Step1Script: React.FC<Step1ScriptProps> = ({
  projectData,
  onUpdateProjectData,
  onRefineWithAi,
  onRegenerateFullScript,
  onNextStep,
  isLoading,
}) => {
  const [editingTitle, setEditingTitle] = useState(false);
  const [titleInput, setTitleInput] = useState(projectData.title);
  const [refineInput, setRefineInput] = useState('');
  const [editingCharId, setEditingCharId] = useState<string | null>(null);
  const [editingSceneId, setEditingSceneId] = useState<string | null>(null);
  const [sceneEditContent, setSceneEditContent] = useState('');
  const [sceneEditTitle, setSceneEditTitle] = useState('');
  const [sceneEditLocation, setSceneEditLocation] = useState('');
  const [showRegenerateModal, setShowRegenerateModal] = useState(false);
  const [localRefineLoadingSceneId, setLocalRefineLoadingSceneId] = useState<string | null>(null);
  const [localSceneInputs, setLocalSceneInputs] = useState<Record<string, string>>({});

  const refineInputRef = useRef<HTMLInputElement>(null);

  // Title handlers
  const handleSaveTitle = () => {
    if (titleInput.trim()) {
      onUpdateProjectData({ ...projectData, title: titleInput.trim() });
    }
    setEditingTitle(false);
  };

  const handleConfirmRegenerate = async () => {
    setShowRegenerateModal(false);
    await onRegenerateFullScript();
  };

  // Character handlers
  const handleUpdateChar = (id: string, field: keyof Character, value: string) => {
    const updatedChars = projectData.characters.map((c) =>
      c.id === id ? { ...c, [field]: value } : c
    );
    onUpdateProjectData({ ...projectData, characters: updatedChars });
  };

  const handleAddChar = () => {
    const newChar: Character = {
      id: `char_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`,
      name: 'Nhân vật mới',
      age: '25 tuổi',
      role: 'Phụ',
      appearance: 'Người Việt Nam, gương mặt thanh tú, tóc đen tự nhiên, phong cách năng động.',
    };
    onUpdateProjectData({ ...projectData, characters: [...projectData.characters, newChar] });
    setEditingCharId(newChar.id);
  };

  const handleDeleteChar = (id: string) => {
    const updatedChars = projectData.characters.filter((c) => c.id !== id);
    onUpdateProjectData({ ...projectData, characters: updatedChars });
  };

  // Scene Card Handlers
  const handleStartEditScene = (scene: Scene) => {
    setEditingSceneId(scene.id);
    setSceneEditContent(scene.content || scene.dialogueAndAction || '');
    setSceneEditTitle(scene.title);
    setSceneEditLocation(scene.location || '');
  };

  const handleSaveSceneEdit = (sceneId: string) => {
    const updatedScenes = projectData.scenes.map((s) => {
      if (s.id === sceneId) {
        return {
          ...s,
          title: sceneEditTitle.trim() || s.title,
          location: sceneEditLocation.trim() || s.location,
          content: sceneEditContent.trim(),
          dialogueAndAction: sceneEditContent.trim(),
          summary: sceneEditContent.trim().slice(0, 100),
        };
      }
      return s;
    });

    // Rebuild narrative
    const updatedNarrative = updatedScenes
      .map((s) => `Cảnh ${s.sceneNumber.toString().padStart(2, '0')} - ${s.title}\n${s.content || ''}`)
      .join('\n\n');

    onUpdateProjectData({
      ...projectData,
      scenes: updatedScenes,
      scriptNarrative: updatedNarrative,
    });
    setEditingSceneId(null);
  };

  // Local AI scene refinement handler
  const handleLocalSceneRefine = async (scene: Scene) => {
    const inputVal = (localSceneInputs[scene.id] || '').trim();
    if (!inputVal || localRefineLoadingSceneId) return;

    setLocalRefineLoadingSceneId(scene.id);
    try {
      const res = await refineSingleSceneApi({
        sceneNumber: scene.sceneNumber,
        sceneTitle: scene.title,
        sceneContent: scene.content || scene.dialogueAndAction || '',
        userFeedback: inputVal,
        projectContext: { title: projectData.title },
      });

      const updatedScenes = projectData.scenes.map((s) => {
        if (s.id === scene.id) {
          return {
            ...s,
            title: res.updatedTitle || s.title,
            location: res.updatedLocation || s.location,
            content: res.updatedContent || s.content,
            dialogueAndAction: res.updatedContent || s.content,
          };
        }
        return s;
      });

      const updatedNarrative = updatedScenes
        .map((s) => `Cảnh ${s.sceneNumber.toString().padStart(2, '0')} - ${s.title}\n${s.content || ''}`)
        .join('\n\n');

      onUpdateProjectData({
        ...projectData,
        scenes: updatedScenes,
        scriptNarrative: updatedNarrative,
      });

      setLocalSceneInputs((prev) => ({ ...prev, [scene.id]: '' }));
    } catch (err: any) {
      console.error('Error refining scene:', err);
      alert(err.message || 'Không thể chỉnh sửa cảnh này bằng AI.');
    } finally {
      setLocalRefineLoadingSceneId(null);
    }
  };

  const handleGlobalRefineSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    if (!refineInput.trim()) return;
    await onRefineWithAi(refineInput.trim());
    setRefineInput('');
  };

  return (
    <div className="max-w-5xl mx-auto py-6 px-4 sm:px-6 pb-28 space-y-6">
      {/* Block 1: Unified Title & AI Suggestion Card */}
      <div className="backdrop-blur-xl bg-white/[0.03] border border-white/10 rounded-2xl p-4 sm:p-5 shadow-xl space-y-3">
        <div className="flex flex-row items-center justify-between gap-3">
          <div className="flex-1 min-w-0">
            {editingTitle ? (
              <div className="flex items-center gap-2">
                <input
                  type="text"
                  value={titleInput}
                  onChange={(e) => setTitleInput(e.target.value)}
                  className="flex-1 px-3 py-1.5 bg-black/40 border border-indigo-400 rounded-xl text-base sm:text-lg font-bold text-white focus:outline-none backdrop-blur-md"
                  autoFocus
                />
                <button
                  onClick={handleSaveTitle}
                  className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold text-xs shrink-0 cursor-pointer border border-indigo-400/30 shadow-md"
                >
                  Lưu
                </button>
                <button
                  onClick={() => setEditingTitle(false)}
                  className="px-2.5 py-1.5 bg-white/10 text-slate-300 hover:text-white rounded-xl text-xs shrink-0 cursor-pointer border border-white/10"
                >
                  Hủy
                </button>
              </div>
            ) : (
              <div className="flex items-center flex-wrap gap-x-2 gap-y-1">
                <span className="text-[10px] font-bold uppercase tracking-widest text-indigo-400 shrink-0">
                  Khối 1 — Tên dự án:
                </span>
                <h2 className="text-base sm:text-2xl font-extrabold text-white tracking-tight truncate min-w-0">
                  {projectData.title}
                </h2>
              </div>
            )}
          </div>

          {!editingTitle && (
            <div className="flex items-center gap-2 shrink-0">
              <button
                onClick={() => {
                  setTitleInput(projectData.title);
                  setEditingTitle(true);
                }}
                title="Đổi tên dự án"
                className="px-2 sm:px-3 py-1.5 rounded-xl bg-white/[0.05] hover:bg-white/[0.1] text-slate-200 text-xs font-semibold border border-white/10 flex items-center justify-center gap-1.5 transition-colors cursor-pointer shrink-0 backdrop-blur-md"
              >
                <Pencil className="w-3.5 h-3.5 shrink-0" />
                <span className="hidden sm:inline">Đổi tên</span>
              </button>

              <button
                onClick={() => setShowRegenerateModal(true)}
                disabled={isLoading}
                title="Viết lại kịch bản"
                className="px-2 sm:px-3.5 py-1.5 bg-indigo-600/80 hover:bg-indigo-600 text-white font-semibold text-xs rounded-xl shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-1.5 transition-all disabled:opacity-50 shrink-0 cursor-pointer border border-indigo-400/30 backdrop-blur-md"
              >
                <RotateCcw className={`w-3.5 h-3.5 shrink-0 ${isLoading ? 'animate-spin' : ''}`} />
                <span className="hidden sm:inline">Viết lại kịch bản</span>
              </button>
            </div>
          )}
        </div>

        <div className="flex items-center gap-2 text-xs text-slate-400 bg-black/20 p-2.5 rounded-xl border border-white/[0.08] backdrop-blur-sm">
          <RotateCcw className="w-3.5 h-3.5 text-indigo-400 shrink-0" />
          <p className="min-w-0 flex-1 leading-snug">
            <span className="font-semibold text-slate-200">Chưa ưng ý với kịch bản này?</span>{' '}
            <span className="text-slate-400">
              Sinh phiên bản kịch bản & nhân vật hoàn toàn mới từ ý tưởng ban đầu.
            </span>
          </p>
        </div>
      </div>

      {/* Regenerate Confirmation Modal */}
      {showRegenerateModal && (
        <div className="fixed inset-0 z-50 bg-[#020205]/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="backdrop-blur-2xl bg-[#0a0c16]/95 border border-white/15 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-amber-500/15 text-amber-400 border border-amber-500/30 flex items-center justify-center shrink-0 backdrop-blur-sm">
                <RotateCcw className="w-5 h-5" />
              </div>
              <h3 className="font-bold text-slate-100 text-base">Xác nhận viết lại toàn bộ kịch bản</h3>
            </div>
            <p className="text-sm text-slate-300 bg-black/40 p-3.5 rounded-xl border border-white/10">
              Toàn bộ nhân vật và kịch bản hiện tại sẽ bị thay thế bằng cốt truyện mới, bạn có chắc chắn?
            </p>
            <div className="flex justify-end gap-3">
              <button
                onClick={() => setShowRegenerateModal(false)}
                className="px-4 py-2 bg-white/10 hover:bg-white/15 text-slate-300 rounded-xl text-xs font-medium cursor-pointer border border-white/10"
              >
                Hủy
              </button>
              <button
                onClick={handleConfirmRegenerate}
                disabled={isLoading}
                className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs shadow-lg shadow-indigo-600/30 border border-indigo-400/40 cursor-pointer"
              >
                Đồng ý viết lại
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Block 2: Characters List */}
      <div className="backdrop-blur-xl bg-white/[0.03] border border-white/10 rounded-2xl p-4 sm:p-5 shadow-xl space-y-4">
        <div className="flex items-center justify-between gap-3">
          <div>
            <span className="text-[10px] font-bold uppercase tracking-widest text-indigo-400 block">
              Khối 2 — Danh sách nhân vật
            </span>
            <p className="text-xs text-slate-400">
              Mô tả ngoại hình này là gốc để sinh Prompt ảnh mẫu nhân vật (A-pose) ở Bước 2.
            </p>
          </div>
          <button
            onClick={handleAddChar}
            title="Thêm nhân vật"
            className="px-2.5 sm:px-3 py-1.5 rounded-xl bg-white/[0.05] hover:bg-white/[0.1] text-slate-200 text-xs font-semibold border border-white/10 flex items-center justify-center gap-1.5 transition-colors shrink-0 cursor-pointer backdrop-blur-md"
          >
            <Plus className="w-3.5 h-3.5 shrink-0" />
            <span className="hidden sm:inline">Thêm nhân vật</span>
          </button>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          {projectData.characters.map((char) => {
            const isEditingThis = editingCharId === char.id;
            return (
              <div
                key={char.id}
                className="backdrop-blur-md bg-white/[0.02] border border-white/10 rounded-xl p-4 flex flex-col justify-between hover:border-white/20 transition-all"
              >
                <div>
                  <div className="flex items-center justify-between gap-2 mb-2">
                    <div className="flex items-center gap-2">
                      <div className="w-8 h-8 rounded-full bg-indigo-500/15 text-indigo-300 border border-indigo-400/30 flex items-center justify-center font-bold text-sm shrink-0 backdrop-blur-sm">
                        <User className="w-4 h-4" />

    // STEP 2 REFERENCE PROMPTS








interface Step2ReferencePromptsProps {
  projectData: ProjectData;
  onUpdateProjectData: (newData: ProjectData) => void;
  onGenerateReferencePrompts: (style?: string, ratio?: string) => Promise<void>;
  onNextStep: () => Promise<void>;
  onGoToStep1: () => void;
  isScriptModifiedAfterGenerate: boolean;
  isLoading: boolean;
}

const Step2ReferencePrompts: React.FC<Step2ReferencePromptsProps> = ({
  projectData,
  onUpdateProjectData,
  onGenerateReferencePrompts,
  onNextStep,
  onGoToStep1,
  isScriptModifiedAfterGenerate,
  isLoading,
}) => {
  const [showStyleModal, setShowStyleModal] = useState(false);
  const [showRatioModal, setShowRatioModal] = useState(false);
  const [includeNameTags, setIncludeNameTags] = useState(projectData.includeNameTags ?? false);
  const [isGroupPromptOutdated, setIsGroupPromptOutdated] = useState(false);
  const [editingCharKey, setEditingCharKey] = useState<string | null>(null);
  const [editPromptEn, setEditPromptEn] = useState('');
  const [editPromptVi, setEditPromptVi] = useState('');

  const isIndividualComplete =
    projectData.individualCharacterPrompts &&
    projectData.individualCharacterPrompts.length > 0 &&
    projectData.individualCharacterPrompts.length === (projectData.characters || []).length &&
    projectData.individualCharacterPrompts.every((item) => item.prompt && item.prompt.trim().length > 0);

  useEffect(() => {
    if (projectData.includeNameTags !== undefined && projectData.includeNameTags !== includeNameTags) {
      setIncludeNameTags(projectData.includeNameTags);
    }
  }, [projectData.includeNameTags]);

  const handleSelectStyle = async (newStyle: string) => {
    setShowStyleModal(false);
    onUpdateProjectData({ ...projectData, style: newStyle });
    await onGenerateReferencePrompts(newStyle, projectData.aspectRatio);
  };

  const handleSelectRatio = async (newRatio: string) => {
    setShowRatioModal(false);
    onUpdateProjectData({ ...projectData, aspectRatio: newRatio });
    await onGenerateReferencePrompts(projectData.style, newRatio);
  };

  const reformatGroupPrompt = (currentIndPrompts: IndividualCharacterPrompt[], nameTagsState: boolean) => {
    return buildGroupCharacterPrompt({
      characters: projectData.characters,
      individualCharacterPrompts: currentIndPrompts,
      style: projectData.style,
      includeNameTags: nameTagsState,
    });
  };

  const handleToggleNameTags = () => {
    const nextVal = !includeNameTags;
    setIncludeNameTags(nextVal);

    const updatedIndividual = (projectData.individualCharacterPrompts || []).map((ind, idx) =>
      formatIndividualPrompt(ind, nextVal, idx)
    );

    const rebuilt = reformatGroupPrompt(updatedIndividual, nextVal);

    onUpdateProjectData({
      ...projectData,
      includeNameTags: nextVal,
      individualCharacterPrompts: updatedIndividual,
      characterReferencePrompt: rebuilt.prompt,
      characterReferencePromptVi: rebuilt.promptVi,
    });
    setIsGroupPromptOutdated(false);
  };

  const handleRebuildGroupPrompt = () => {
    if (!isIndividualComplete) return;

    const rebuilt = reformatGroupPrompt(projectData.individualCharacterPrompts || [], includeNameTags);

    onUpdateProjectData({
      ...projectData,
      includeNameTags,
      characterReferencePrompt: rebuilt.prompt,
      characterReferencePromptVi: rebuilt.promptVi,
    });
    setIsGroupPromptOutdated(false);
  };

  const handleStartEditIndividual = (item: IndividualCharacterPrompt, key: string) => {
    setEditingCharKey(key);
    setEditPromptEn(item.prompt || '');
    setEditPromptVi(item.promptVi || '');
  };

  const handleSaveIndividualEdit = (key: string) => {
    const updatedList = (projectData.individualCharacterPrompts || []).map((item, idx) => {
      const itemKey = item.characterId || item.characterName || `char_${idx}`;
      if (itemKey === key) {
        return {
          ...item,
          prompt: editPromptEn,
          promptVi: editPromptVi,
        };
      }
      return item;
    });

    onUpdateProjectData({
      ...projectData,
      individualCharacterPrompts: updatedList,
    });

    setIsGroupPromptOutdated(true);
    setEditingCharKey(null);
  };

  return (
    <div className="max-w-5xl mx-auto py-6 px-4 sm:px-6 pb-28 space-y-6">
      {/* Script Modified Warning Banner */}
      {isScriptModifiedAfterGenerate && (
        <div className="p-4 bg-amber-500/10 backdrop-blur-md border border-amber-500/30 rounded-2xl text-amber-300 text-xs flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-lg">
          <div className="flex items-center gap-2">
            <AlertCircle className="w-4 h-4 text-amber-400 shrink-0" />
            <span>⚠️ Kịch bản ở Tab 1 đã thay đổi — nhấn 'Tạo lại theo kịch bản mới' để đồng bộ.</span>
          </div>
          <button
            onClick={() => onGenerateReferencePrompts(projectData.style, projectData.aspectRatio)}
            disabled={isLoading}
            className="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl text-xs shrink-0 disabled:opacity-50 cursor-pointer shadow-md shadow-amber-600/20 border border-amber-400/30"
          >
            {isLoading ? 'Đang tạo lại...' : 'Tạo lại theo kịch bản mới'}
          </button>
        </div>
      )}

      {/* Settings Row: Aspect Ratio & Visual Style */}
      <div className="backdrop-blur-xl bg-white/[0.03] border border-white/10 rounded-2xl p-3 sm:p-4 shadow-xl flex flex-row items-center divide-x divide-white/10">
        <div className="flex-1 flex items-center gap-2 sm:gap-3 px-1 sm:px-2 min-w-0">
          <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-indigo-500/15 border border-indigo-400/30 text-indigo-300 flex items-center justify-center shrink-0 backdrop-blur-sm">
            <Maximize className="w-4 h-4 sm:w-5 sm:h-5" />
          </div>
          <div className="min-w-0 flex-1">
            <span className="text-[9px] sm:text-[10px] text-slate-400 block font-bold uppercase tracking-wider truncate">
              TỈ LỆ KHUNG HÌNH
            </span>
            <span className="text-xs sm:text-sm font-bold text-slate-100 truncate block">
              {projectData.aspectRatio || '9:16'}
            </span>
          </div>
          <button
            onClick={() => setShowRatioModal(true)}
            className="ml-auto px-2 sm:px-3 py-1.5 rounded-lg bg-white/[0.05] hover:bg-white/[0.1] text-slate-200 text-[10px] sm:text-xs font-semibold border border-white/10 transition-colors cursor-pointer shrink-0 backdrop-blur-md"
          >
            Đổi
          </button>
        </div>

        <div className="flex-1 flex items-center gap-2 sm:gap-3 px-1 sm:px-2 pl-2.5 sm:pl-4 min-w-0">
          <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-indigo-500/15 border border-indigo-400/30 text-indigo-300 flex items-center justify-center shrink-0 backdrop-blur-sm">
            <Palette className="w-4 h-4 sm:w-5 sm:h-5" />
          </div>
          <div className="min-w-0 flex-1">
            <span className="text-[9px] sm:text-[10px] text-slate-400 block font-bold uppercase tracking-wider truncate">
              PHONG CÁCH
            </span>
            <span className="text-xs sm:text-sm font-bold text-slate-100 truncate block">
              {projectData.style || 'Hiện thực'}
            </span>
          </div>
          <button
            onClick={() => setShowStyleModal(true)}
            className="ml-auto px-2 sm:px-3 py-1.5 rounded-lg bg-white/[0.05] hover:bg-white/[0.1] text-slate-200 text-[10px] sm:text-xs font-semibold border border-white/10 transition-colors cursor-pointer shrink-0 backdrop-blur-md"
          >
            Đổi
          </button>
        </div>
      </div>

      {/* SECTION 1: ENVIRONMENT REFERENCE PROMPTS */}
      <div className="backdrop-blur-xl bg-white/[0.03] border border-white/10 rounded-2xl p-4 sm:p-5 shadow-xl space-y-4">
        <div className="flex items-center gap-2 border-b border-white/10 pb-3">
          <MapPin className="w-5 h-5 text-emerald-400" />
          <div>
            <h3 className="font-bold text-slate-100 text-base">
              Prompt ảnh môi trường (Environment Reference Prompts)
            </h3>
            <p className="text-xs text-slate-400">
              Mỗi địa điểm duy nhất có 1 prompt bối cảnh: Không người • Không động vật • Tỉ lệ {projectData.aspectRatio || '9:16'}.
            </p>
          </div>
        </div>

        {projectData.environmentPrompts && projectData.environmentPrompts.length > 0 ? (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {projectData.environmentPrompts.map((envItem, idx) => (
              <div
                key={envItem.id || idx}
                className="backdrop-blur-md bg-white/[0.02] border border-white/10 hover:border-white/20 rounded-xl p-4 flex flex-col justify-between h-full transition-all"
              >
                <PromptCard
                  title={`Địa điểm: ${String(envItem?.location || '')}`}
                  promptText={String(envItem?.prompt || '')}
                  displayText={String(envItem?.promptVi || envItem?.prompt || '')}
                  lang={projectData.globalLang || 'vi'}
                  className="h-full"
                />
              </div>
            ))}

            {/* Product Card placed cleanly alongside environment prompts */}
            {(projectData.productDescription || projectData.productDescriptionVi) && (
              <div className="backdrop-blur-md bg-white/[0.02] border border-indigo-500/30 hover:border-indigo-400/50 rounded-xl p-4 flex flex-col justify-between h-full transition-all">
                <PromptCard
                  title="Sản phẩm tham chiếu (Product Reference)"
                  badge="Sản phẩm"
                  badgeColor="indigo"
                  promptText={String(projectData.productDescription || '')}
                  displayText={String(projectData.productDescriptionVi || projectData.productDescription || '')}
                  lang={projectData.globalLang || 'vi'}
                  className="h-full"
                />
              </div>
            )}
          </div>
        ) : (
          <div className="p-4 text-center text-slate-400 text-xs bg-black/30 backdrop-blur-md rounded-xl border border-white/[0.08]">
            Đang khởi tạo prompt môi trường...
          </div>
        )}
      </div>

      {/* SECTION 2: INDIVIDUAL CHARACTER PROMPTS */}
      <div className="backdrop-blur-xl bg-white/[0.03] border border-white/10 rounded-2xl p-4 sm:p-5 shadow-xl space-y-4">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-white/10 pb-3">
          <div className="flex items-center gap-2">

interface Step3ScenePromptsProps {
  projectData: ProjectData;
  onUpdateProjectData: (newData: ProjectData) => void;
  onResetProject: () => void;
  onGenerateScenePrompts: () => Promise<void>;
  onGoToStep1: () => void;
  isScriptModifiedAfterGenerate: boolean;
  isLoading: boolean;
}

const loadAdvancedPromptConfig = (): AdvancedPromptConfigState => {
  try {
    const saved = localStorage.getItem(ADVANCED_CONFIG_STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && typeof parsed === 'object') {
        return {
          isActiveA: typeof parsed.isActiveA === 'boolean' ? parsed.isActiveA : false,
          configTextA: typeof parsed.configTextA === 'string' ? parsed.configTextA : '',
          isActiveB: typeof parsed.isActiveB === 'boolean' ? parsed.isActiveB : false,
          configTextB: typeof parsed.configTextB === 'string' ? parsed.configTextB : '',
          enableCamera: typeof parsed.enableCamera === 'boolean' ? parsed.enableCamera : false,
          enableAmbient: typeof parsed.enableAmbient === 'boolean' ? parsed.enableAmbient : false,
          enableSmartAudioLang:
            typeof parsed.enableSmartAudioLang === 'boolean' ? parsed.enableSmartAudioLang : false,
        };
      }
    }
  } catch (e) {
    console.warn('Failed to load advanced prompt config:', e);
  }
  return {
    isActiveA: false,
    configTextA: '',
    isActiveB: false,
    configTextB: '',
    enableCamera: false,
    enableAmbient: false,
    enableSmartAudioLang: false,
  };
};

const Step3ScenePrompts: React.FC<Step3ScenePromptsProps> = ({
  projectData,
  onUpdateProjectData,
  onResetProject,
  onGenerateScenePrompts,
  onGoToStep1,
  isScriptModifiedAfterGenerate,
  isLoading,
}) => {
  const [advConfig, setAdvConfig] = useState<AdvancedPromptConfigState>(loadAdvancedPromptConfig);
  const [isAdvOpen, setIsAdvOpen] = useState(false);
  const [copiedItemKey, setCopiedItemKey] = useState<string | null>(null);
  const [multiRefFilterMode, setMultiRefFilterMode] = useState<MultiRefFilterMode>(() => {
    try {
      const saved = localStorage.getItem(MULTI_REF_FILTER_STORAGE_KEY);
      if (saved === 'no_audio' || saved === 'dialogue_only') return saved;
    } catch (e) {
      console.warn('Failed to load multiRefFilterMode:', e);
    }
    return 'full';
  });

  const updateAdvConfig = (newConfig: AdvancedPromptConfigState) => {
    setAdvConfig(newConfig);
    try {
      localStorage.setItem(ADVANCED_CONFIG_STORAGE_KEY, JSON.stringify(newConfig));
    } catch (e) {
      console.warn('Failed to save advanced config:', e);
    }
  };

  const handleToggleAdv = (key: keyof AdvancedPromptConfigState) => {
    updateAdvConfig({
      ...advConfig,
      [key]: !advConfig[key],
    });
  };

  const handleMultiRefFilterChange = (mode: MultiRefFilterMode) => {
    setMultiRefFilterMode(mode);
    try {
      localStorage.setItem(MULTI_REF_FILTER_STORAGE_KEY, mode);
    } catch (e) {
      console.warn('Failed to save multiRefFilterMode:', e);
    }
  };

  const triggerCopyFeedback = (key: string) => {
    setCopiedItemKey(key);
    setTimeout(() => setCopiedItemKey(null), 1500);
  };

  const copyTextToClipboard = async (text: string): Promise<boolean> => {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.top = '-9999px';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      const successful = document.execCommand('copy');
      document.body.removeChild(textarea);
      return successful;
    } catch (e) {
      console.error('Copy fallback error:', e);
      return false;
    }
  };

  const handleCopyLocationPrompt = async (locationName: string, itemKey: string) => {
    if (!locationName || locationName === 'N/A') return;
    const cleanLoc = locationName.trim().toLowerCase();
    const envPrompts = projectData.environmentPrompts || [];
    const matched =
      envPrompts.find((e) => e.location && e.location.trim().toLowerCase() === cleanLoc) ||
      envPrompts.find(
        (e) =>
          e.location &&
          (e.location.trim().toLowerCase().includes(cleanLoc) ||
            cleanLoc.includes(e.location.trim().toLowerCase()))
      );

    if (matched) {
      const globalLang = projectData.globalLang || 'vi';
      const textToCopy = globalLang === 'vi' ? matched.promptVi || matched.prompt : matched.prompt;
      if (textToCopy) {
        const ok = await copyTextToClipboard(textToCopy);
        if (ok) triggerCopyFeedback(itemKey);
      }
    }
  };

  const handleCopyCharacterPrompt = async (charName: string, itemKey: string) => {
    if (!charName) return;
    const cleanName = charName.trim().toLowerCase();
    const indivPrompts = projectData.individualCharacterPrompts || [];
    const matched =
      indivPrompts.find((c) => c.characterName && c.characterName.trim().toLowerCase() === cleanName) ||
      indivPrompts.find(
        (c) =>
          c.characterName &&
          (c.characterName.trim().toLowerCase().includes(cleanName) ||
            cleanName.includes(c.characterName.trim().toLowerCase()))
      );

    if (matched) {
      const globalLang = projectData.globalLang || 'vi';
      const textToCopy = globalLang === 'vi' ? matched.promptVi || matched.prompt : matched.prompt;
      if (textToCopy) {
        const ok = await copyTextToClipboard(textToCopy);
        if (ok) triggerCopyFeedback(itemKey);
      }
    }
  };

  const handleCopyGroupRefPrompt = async (itemKey: string) => {
    const globalLang = projectData.globalLang || 'vi';
    const textToCopy =
      globalLang === 'vi'
        ? projectData.characterReferencePromptVi || projectData.characterReferencePrompt
        : projectData.characterReferencePrompt;

    if (!textToCopy) return;
    const ok = await copyTextToClipboard(textToCopy);
    if (ok) triggerCopyFeedback(itemKey);
  };

  const handleCopyProductPrompt = async (itemKey: string) => {
    const globalLang = projectData.globalLang || 'vi';
    const textToCopy =
      globalLang === 'vi'
        ? projectData.productDescriptionVi || projectData.productDescription
        : projectData.productDescription;

    if (!textToCopy) return;
    const ok = await copyTextToClipboard(textToCopy);
    if (ok) triggerCopyFeedback(itemKey);
  };

  const getScenePromptA = (sp: ScenePrompt) => {
    return {
      promptText: processAdvancedPrompt(sp.initialFramePrompt || '', advConfig.configTextA, advConfig.isActiveA),
      displayText: processAdvancedPrompt(
        sp.initialFramePromptVi || sp.initialFramePrompt || '',
        advConfig.configTextA,
        advConfig.isActiveA
      ),
    };
  };

  const getScenePromptB = (sp: ScenePrompt) => {
    return {
      promptText: formatVideoPromptWithAttributes({
        rawPrompt: sp.videoPrompt || '',
        sceneContext: sp,
        advConfig,
        lang: 'en',
      }),
      displayText: formatVideoPromptWithAttributes({
        rawPrompt: sp.videoPromptVi || sp.videoPrompt || '',
        sceneContext: sp,
        advConfig,
        lang: 'vi',
      }),
    };
  };

  const allVideoPromptsMergedVi = formatMultiRefVideoPrompts({
    scenePrompts: projectData.scenePrompts || [],
    allScenes: projectData.scenes || [],
    advConfig,
    filterMode: multiRefFilterMode,
    characters: projectData.characters || [],
    lang: 'vi',
  });

  const allVideoPromptsMergedEn = formatMultiRefVideoPrompts({
    scenePrompts: projectData.scenePrompts || [],
    allScenes: projectData.scenes || [],
    advConfig,
    filterMode: multiRefFilterMode,
    characters: projectData.characters || [],
    lang: 'en',
  });

  return (
    <div className="max-w-5xl mx-auto py-4 sm:py-6 px-3 sm:px-6 pb-28 space-y-4 sm:space-y-6 relative">
      {/* Script Modified Warning */}
      {isScriptModifiedAfterGenerate && (
        <div className="p-3.5 sm:p-4 bg-amber-500/10 backdrop-blur-md border border-amber-500/30 rounded-2xl text-amber-300 text-xs flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-lg">
          <div className="flex items-center gap-2">
            <AlertCircle className="w-4 h-4 text-amber-400 shrink-0" />
            <span>⚠️ Kịch bản ở Tab 1 đã thay đổi — nhấn 'Tạo lại theo kịch bản mới' để đồng bộ.</span>
          </div>
          <button
            onClick={onGenerateScenePrompts}
            disabled={isLoading}
            className="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl text-xs shrink-0 disabled:opacity-50 cursor-pointer shadow-md shadow-amber-600/20 border border-amber-400/30"
          >
            {isLoading ? 'Đang tạo lại...' : 'Tạo lại theo kịch bản mới'}
          </button>
        </div>
      )}

      {/* Advanced Prompt Config Accordion */}
      <div className="backdrop-blur-xl bg-white/[0.03] border border-white/10 rounded-2xl overflow-hidden shadow-xl transition-all">
        <div
          onClick={() => setIsAdvOpen(!isAdvOpen)}
          className="p-3.5 sm:p-5 flex items-center justify-between cursor-pointer hover:bg-white/[0.04] transition-colors select-none"
        >
          <div className="flex items-center gap-2.5 sm:gap-3 min-w-0">
            <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-indigo-500/15 border border-indigo-400/30 text-indigo-300 flex items-center justify-center shrink-0 backdrop-blur-sm">
              <Sliders className="w-4 h-4 sm:w-5 sm:h-5" />
            </div>
            <div className="min-w-0">
              <h3 className="text-sm sm:text-base font-bold text-white truncate">
                Cấu hình Prompt Nâng cao
              </h3>
              <p className="text-[11px] sm:text-xs text-slate-400 truncate">
                Tự động chèn Tiền tố & Hậu tố/Điều cấm vào mọi cảnh ở Tab 3
              </p>
            </div>
          </div>

          <div className="text-slate-400 p-1 shrink-0 ml-auto">
            {isAdvOpen ? (
              <ChevronUp className="w-4 h-4 sm:w-5 sm:h-5" />
            ) : (
              <ChevronDown className="w-4 h-4 sm:w-5 sm:h-5" />
            )}
          </div>
        </div>

        {isAdvOpen && (
          <div className="p-4 sm:p-5 border-t border-white/10 bg-black/40 backdrop-blur-md space-y-4">
            {/* Dual Column Configuration */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 items-stretch">
              {/* KHỐI A — CẤU HÌNH PROMPT ẢNH */}
              <div className="space-y-2 flex flex-col">
                <div className="flex items-center gap-1.5 text-xs font-bold text-indigo-400 tracking-wider uppercase">
                  <ImageIcon className="w-4 h-4 text-indigo-400" />
                  <span>KHỐI A — CẤU HÌNH PROMPT ẢNH</span>
                </div>

                <div className="backdrop-blur-md bg-white/[0.02] border border-white/10 rounded-2xl p-4 flex-1 flex flex-col justify-between space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-semibold text-slate-200">Nội dung cấu hình</span>
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-wider">
                        KÍCH HOẠT
                      </span>
                      <button
                        type="button"
                        onClick={() => updateAdvConfig({ ...advConfig, isActiveA: !advConfig.isActiveA })}
                        className={`w-9 h-5 rounded-full p-0.5 transition-colors relative flex items-center cursor-pointer border ${
                          advConfig.isActiveA
                            ? 'bg-indigo-600 border-indigo-400'
                            : 'bg-white/10 border-white/20'
                        }`}
                      >

    // MAIN APP













function App() {
  const loadSavedProject = () => {
    try {
      const saved = localStorage.getItem(PROJECT_STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === 'object') {
          return parsed;
        }
      }
    } catch (e) {
      console.warn('Failed to load saved project state:', e);
    }
    return null;
  };

  const initialSavedRef = useRef(loadSavedProject());
  const initialSaved = initialSavedRef.current;

  const [currentStep, setCurrentStep] = useState<number>(() => initialSaved?.currentStep ?? 0);
  const [maxStepReached, setMaxStepReached] = useState<number>(() => initialSaved?.maxStepReached ?? 1);
  const [lastActiveStep, setLastActiveStep] = useState<number>(() => {
    if (initialSaved?.currentStep && initialSaved.currentStep > 0) return initialSaved.currentStep;
    if (initialSaved?.maxStepReached && initialSaved.maxStepReached > 0) return initialSaved.maxStepReached;
    return 1;
  });
  const [isLoading, setIsLoading] = useState<boolean>(false);
  const [loadingProgress, setLoadingProgress] = useState<number>(0);
  const [loadingStatus, setLoadingStatus] = useState<string>('');
  const [errorMsg, setErrorMsg] = useState<string | null>(null);
  const [customApiKey, setCustomApiKey] = useState<string>(() => getStoredApiKey());

  // Controlled states for Tab 0 inputs (Root level prevents unmount reset bug!)
  const [rawIdea, setRawIdea] = useState<string>(() => initialSaved?.rawIdea ?? '');
  const [hasProductFlag, setHasProductFlag] = useState<boolean>(() => initialSaved?.hasProductFlag ?? false);
  const [productInfo, setProductInfo] = useState<ProductInfo | null>(() => initialSaved?.productInfo ?? null);

  const [isScriptModifiedAfterGenerate, setIsScriptModifiedAfterGenerate] = useState<boolean>(
    () => initialSaved?.isScriptModifiedAfterGenerate ?? false
  );

  const [projectData, setProjectData] = useState<ProjectData>(
    () =>
      initialSaved?.projectData ?? {
        title: 'Dự án Video Script',
        characters: [],
        scriptNarrative: '',
        scenes: [],
        style: 'Hiện thực',
        aspectRatio: '9:16',
        includeNameTags: false,
        characterReferencePrompt: '',
        characterReferencePromptVi: '',
        individualCharacterPrompts: [],
        environmentPrompts: [],
        scenePrompts: [],
        globalLang: 'vi',
      }
  );

  const progressIntervalRef = useRef<any>(null);

  const handleApiKeyChange = (key: string) => {
    const trimmed = (key || '').trim();
    setCustomApiKey(trimmed);
    saveApiKey(trimmed);
    if (trimmed) setErrorMsg(null);
  };

  const startLoading = (initialStatus: string) => {
    setIsLoading(true);
    setLoadingProgress(10);
    setLoadingStatus(initialStatus);
    if (progressIntervalRef.current) clearInterval(progressIntervalRef.current);

    progressIntervalRef.current = setInterval(() => {
      setLoadingProgress((prev) => {
        if (prev >= 92) return prev;
        return prev + Math.max(1, Math.floor((95 - prev) / 6));
      });
    }, 350);
  };

  const updateLoadingStatus = (status: string) => setLoadingStatus(status);

  const stopLoading = () => {
    if (progressIntervalRef.current) {
      clearInterval(progressIntervalRef.current);
      progressIntervalRef.current = null;
    }
    setLoadingProgress(100);
    setTimeout(() => {
      setIsLoading(false);
      setLoadingProgress(0);
      setLoadingStatus('');
    }, 350);
  };

  // Auto-save state to localStorage
  useEffect(() => {
    const hasContent =
      rawIdea || projectData.title || (projectData.scenes && projectData.scenes.length > 0) || currentStep > 0;
    if (hasContent) {
      const dataToSave = {
        currentStep,
        maxStepReached,
        rawIdea,
        projectData,
        productInfo,
        hasProductFlag,
        isScriptModifiedAfterGenerate,
        updatedAt: Date.now(),
      };
      try {
        localStorage.setItem(PROJECT_STORAGE_KEY, JSON.stringify(dataToSave));
      } catch (e) {
        console.warn('Failed to save project state to localStorage:', e);
      }
    }
  }, [
    currentStep,
    maxStepReached,
    rawIdea,
    projectData,
    productInfo,
    hasProductFlag,
    isScriptModifiedAfterGenerate,
  ]);

  const markScriptAsModified = () => {
    if (maxStepReached >= 2) setIsScriptModifiedAfterGenerate(true);
  };

  const handleResetProject = () => {
    try {
      localStorage.removeItem(PROJECT_STORAGE_KEY);
    } catch (e) {
      console.warn('Failed to remove saved project from localStorage:', e);
    }
    setCurrentStep(0);
    setMaxStepReached(1);
    setRawIdea('');
    setProductInfo(null);
    setHasProductFlag(false);
    setErrorMsg(null);
    setIsScriptModifiedAfterGenerate(false);
    setProjectData({
      title: 'Dự án Video Script',
      characters: [],
      scriptNarrative: '',
      scenes: [],
      style: 'Hiện thực',
      aspectRatio: '9:16',
      includeNameTags: false,
      characterReferencePrompt: '',
      characterReferencePromptVi: '',
      individualCharacterPrompts: [],
      environmentPrompts: [],
      scenePrompts: [],
      globalLang: 'vi',
    });
  };

  // 1. Pre-written SSOT script parser transition
  const handleApplyPrewrittenScript = (parseResult: ParseResult) => {
    setProjectData((prev) => ({
      ...prev,
      title: parseResult.title || 'Dự án Kịch bản Video AI',
      characters: parseResult.characters || [],
      scriptNarrative: parseResult.scriptNarrative || '',
      scenes: parseResult.scenes || [],
      characterReferencePrompt: '',
      individualCharacterPrompts: [],
      environmentPrompts: [],
      scenePrompts: [],
    }));

    setCurrentStep(1);
    setMaxStepReached((prev) => Math.max(prev, 1));
    setIsScriptModifiedAfterGenerate(false);
  };

  // 2. Generate Script from Raw Idea (AI call)
  const handleGenerateScript = async (
    idea: string,
    hasProduct: boolean,
    productImage: ProductInfo | null
  ) => {
    startLoading('Đang phân tích ý tưởng & biên tập tuyến nhân vật...');
    setErrorMsg(null);

    const timer = setTimeout(() => {
      updateLoadingStatus('Đang cấu trúc các Scene Cards chi tiết theo chuẩn v4...');
    }, 2200);

    try {
      const data = await generateScriptApi({
        idea,
        hasProduct,
        productImage: productImage?.dataUrl || null,
      });

      setProjectData((prev) => ({
        ...prev,
        title: data.title || 'Dự án Video Script',
        characters: data.characters || [],
        scriptNarrative: data.scriptNarrative || '',
        scenes: data.scenes || [],
        characterReferencePrompt: '',
        individualCharacterPrompts: [],
        environmentPrompts: [],
        scenePrompts: [],
      }));

      setCurrentStep(1);
      setMaxStepReached((prev) => Math.max(prev, 1));
      setIsScriptModifiedAfterGenerate(false);
    } catch (err: any) {
      console.error('Error in handleGenerateScript:', err);
      setErrorMsg(err.message || 'Có lỗi xảy ra khi sinh kịch bản. Vui lòng thử lại.');
    } finally {
      clearTimeout(timer);
      stopLoading();
    }
  };

  // 3. Regenerate Full Script
  const handleRegenerateFullScript = async () => {
    startLoading('Đang gọi AI viết lại toàn bộ kịch bản mới...');
    setErrorMsg(null);

    const timer = setTimeout(() => {
      updateLoadingStatus('Đang làm mới cốt truyện & danh sách Scene Cards...');
    }, 2200);

    try {
      const data = await generateScriptApi({
        idea: rawIdea,
        hasProduct: hasProductFlag,
        productImage: productInfo?.dataUrl || null,
        isRegenerate: true,
      });

      setProjectData((prev) => ({
        ...prev,
        title: data.title || prev.title,
        characters: data.characters || [],
        scriptNarrative: data.scriptNarrative || '',
        scenes: data.scenes || [],
        characterReferencePrompt: '',
        individualCharacterPrompts: [],
        environmentPrompts: [],
        scenePrompts: [],
      }));

      markScriptAsModified();
    } catch (err: any) {
      setErrorMsg(err.message || 'Không thể viết lại kịch bản. Vui lòng thử lại.');
    } finally {
      clearTimeout(timer);
      stopLoading();
    }
  };

  // 4. Refine Full Script via AI
  const handleRefineScriptWithAi = async (userRequest: string) => {
    startLoading('Đang gửi yêu cầu điều chỉnh kịch bản tới AI...');
    setErrorMsg(null);

    const timer = setTimeout(() => {
      updateLoadingStatus('Đang tinh chỉnh kịch bản theo phản hồi...');
    }, 2000);

    try {
      const data = await refineScriptApi({
        currentData: projectData,
        userRequest,
      });

      setProjectData((prev) => ({
        ...prev,
        title: data.title || prev.title,
        characters: data.characters || prev.characters,
        scriptNarrative: data.scriptNarrative || prev.scriptNarrative,
        scenes: data.scenes || prev.scenes,
      }));

      markScriptAsModified();
    } catch (err: any) {
      setErrorMsg(err.message || 'Không thể điều chỉnh kịch bản.');
    } finally {
      clearTimeout(timer);
      stopLoading();
    }
  };

  // 5. Generate Reference Prompts (Nhóm 2) + Auto-transition Tab 1 -> Tab 2
  const handleGenerateReferencePrompts = async (overrideStyle?: any, overrideRatio?: any) => {
    startLoading('Đang tạo prompt tham chiếu nhân vật & môi trường (Nhóm 2)...');
    setErrorMsg(null);

    const targetStyle = typeof overrideStyle === 'string' && overrideStyle.trim() ? overrideStyle : (projectData.style || 'Hiện thực');
    const targetRatio = typeof overrideRatio === 'string' && overrideRatio.trim() ? overrideRatio : (projectData.aspectRatio || '9:16');

    const timer = setTimeout(() => {
      updateLoadingStatus('Đang chuẩn hóa A-pose, phông nền trắng trơn & sinh bản dịch song ngữ...');
    }, 2200);

    try {
      const data = await generateReferencesApi({
        characters: projectData.characters || [],
        scenes: projectData.scenes || [],
        style: targetStyle,
        aspectRatio: targetRatio,
        hasProduct: hasProductFlag,
        productImage: productInfo?.dataUrl || null,
      });

      const groupRes = buildGroupCharacterPrompt({
        characters: projectData.characters || [],
        individualCharacterPrompts: data.individualCharacterPrompts || [],
        style: targetStyle,
        includeNameTags: projectData.includeNameTags ?? false,
      });

      setProjectData((prev) => ({
        ...prev,
        style: targetStyle,
        aspectRatio: targetRatio,
        characterReferencePrompt: groupRes.prompt || '',
        characterReferencePromptVi: groupRes.promptVi || '',
        individualCharacterPrompts: data.individualCharacterPrompts || [],
        environmentPrompts: data.environmentPrompts || [],
        productDescription: data.productDescription || prev.productDescription || '',
        productDescriptionVi: data.productDescriptionVi || prev.productDescriptionVi || '',
      }));

      setIsScriptModifiedAfterGenerate(false);

      // Auto-transition Tab 1 -> Tab 2 as mandated by v4 and mapping doc
      setCurrentStep(2);
      setMaxStepReached((prev) => Math.max(prev, 2));
    } catch (err: any) {
      console.error('Error in handleGenerateReferencePrompts:', err);
      const msg = err?.message || (typeof err === 'string' ? err : 'Lỗi khi sinh prompt tham chiếu.');
      setErrorMsg(msg);
    } finally {
      clearTimeout(timer);
      stopLoading();
    }
  };

  // 6. Generate Scene Production Prompts (Nhóm 3) - Triggered when user confirms Tab 2
  const handleGenerateScenePrompts = async () => {
    startLoading('Đang tạo prompt sản xuất từng cảnh (Nhóm 3)...');
    setErrorMsg(null);

    const timer = setTimeout(() => {
      updateLoadingStatus('Đang phân chia Khối 1 (Ảnh khởi đầu) & Khối 2 (Prompt video chi tiết)...');
    }, 2200);

    try {
      const data = await generateScenePromptsApi({
        scenes: projectData.scenes,
        characters: projectData.characters,
        style: projectData.style,
        aspectRatio: projectData.aspectRatio,
        characterReferencePrompt: projectData.characterReferencePrompt,
        environmentPrompts: projectData.environmentPrompts,
        productDescription: projectData.productDescription,
        productDescriptionVi: projectData.productDescriptionVi,
      });

      setProjectData((prev) => ({
        ...prev,
        scenePrompts: data.scenePrompts || [],
      }));

      setIsScriptModifiedAfterGenerate(false);
      setCurrentStep(3);
      setMaxStepReached(3);
    } catch (err: any) {
      setErrorMsg(err.message || 'Lỗi khi sinh bộ prompt từng cảnh.');
    } finally {
      clearTimeout(timer);
      stopLoading();
    }
  };

  const handleStepChange = (step: number) => {
    if (step > 0) {
      setLastActiveStep(step);
    }
    setCurrentStep(step);
  };

  const hasExistingProject =
    Boolean(projectData.scenes && projectData.scenes.length > 0) || maxStepReached > 1 || Boolean(projectData.scriptNarrative);

  return (
    <div className="min-h-screen flex flex-col bg-[#030308] text-slate-100 font-sans antialiased relative selection:bg-indigo-500 selection:text-white">
      {/* Frosted Glass Ambient Lighting Effects */}
      <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div className="absolute -top-40 left-1/4 w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-[120px] mix-blend-screen" />
        <div className="absolute top-1/3 -right-40 w-[600px] h-[600px] bg-purple-600/8 rounded-full blur-[140px] mix-blend-screen" />
        <div className="absolute -bottom-20 left-1/3 w-[500px] h-[500px] bg-amber-600/5 rounded-full blur-[120px] mix-blend-screen" />
      </div>

      <Header
        currentStep={currentStep}
        onStepClick={handleStepChange}
        maxStepReached={maxStepReached}
        customApiKey={customApiKey}
        onApiKeyChange={handleApiKeyChange}
        globalLang={projectData.globalLang || 'vi'}
        onGlobalLangChange={(lang) => setProjectData((prev) => ({ ...prev, globalLang: lang }))}
        lastActiveStep={lastActiveStep}
        hasExistingProject={hasExistingProject}
        onResetProject={handleResetProject}
      />

      <ProgressBar
        isLoading={isLoading}
        progress={loadingProgress}
        statusText={loadingStatus}
      />

      <main className="flex-1 transition-all duration-300 relative z-10">
        {errorMsg && (
          <div className="max-w-5xl mx-auto mt-4 px-4 sm:px-6">
            <div className="p-4 backdrop-blur-xl bg-rose-500/10 border border-rose-500/30 rounded-2xl text-rose-300 text-xs font-semibold flex items-center justify-between gap-3 shadow-xl">
              <span>{errorMsg}</span>
              <button
                onClick={() => setErrorMsg(null)}
                className="px-2.5 py-1 bg-rose-500/20 hover:bg-rose-500/30 text-rose-200 rounded-lg text-xs cursor-pointer"
              >
                Đóng
              </button>
            </div>
          </div>
        )}

        {currentStep === 0 && (
          <Step0InputIdea
            idea={rawIdea}
            setIdea={setRawIdea}
            hasProduct={hasProductFlag}
            setHasProduct={setHasProductFlag}
            productImage={productInfo}
            setProductImage={setProductInfo}
            onGenerateScript={handleGenerateScript}
            onApplyPrewrittenScript={handleApplyPrewrittenScript}
            isLoading={isLoading}
            hasExistingProject={hasExistingProject}
            lastActiveStep={lastActiveStep}
            projectName={projectData.title}
            onResumeProject={() => handleStepChange(lastActiveStep || 1)}
          />
        )}

        {currentStep === 1 && (
          <Step1Script
            projectData={projectData}
            onUpdateProjectData={(newData) => {
              setProjectData(newData);
              markScriptAsModified();
            }}
            onRefineWithAi={handleRefineScriptWithAi}
            onRegenerateFullScript={handleRegenerateFullScript}
            onNextStep={handleGenerateReferencePrompts}
            isLoading={isLoading}
          />
        )}

        {currentStep === 2 && (
          <Step2ReferencePrompts
            projectData={projectData}
            onUpdateProjectData={(newData) => setProjectData(newData)}
            onGenerateReferencePrompts={handleGenerateReferencePrompts}
            onNextStep={handleGenerateScenePrompts}
            onGoToStep1={() => setCurrentStep(1)}
            isScriptModifiedAfterGenerate={isScriptModifiedAfterGenerate}
            isLoading={isLoading}
          />
        )}

        {currentStep === 3 && (
          <Step3ScenePrompts
            projectData={projectData}
            onUpdateProjectData={(newData) => setProjectData(newData)}
            onResetProject={handleResetProject}
            onGenerateScenePrompts={handleGenerateScenePrompts}
            onGoToStep1={() => setCurrentStep(1)}
            isScriptModifiedAfterGenerate={isScriptModifiedAfterGenerate}
            isLoading={isLoading}
          />
        )}
      </main>

      <footer className="px-3 sm:px-6 py-2.5 sm:py-3.5 backdrop-blur-xl bg-[#030308]/75 border-t border-white/10 flex flex-col sm:flex-row justify-between items-center gap-2 text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider mt-auto w-full pb-20 sm:pb-3.5 relative z-10">
        <div className="flex flex-row items-center justify-center gap-3 sm:gap-4 w-full sm:w-auto">
          <div className="flex items-center gap-1.5 shrink-0">
            <div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shadow-sm shadow-emerald-400/50"></div>
            <span className="font-semibold text-slate-300">Gemini 3.7 Flash Sẵn sàng</span>
          </div>
          <span className="text-white/20 hidden sm:inline">•</span>
          <div className="flex items-center gap-1.5 shrink-0">
            <div className="w-2 h-2 rounded-full bg-indigo-400 shadow-sm shadow-indigo-400/50"></div>
            <span className="font-semibold text-slate-300">Chuẩn Logic SSOT v4</span>
          </div>
        </div>
        <p className="text-[9px] sm:text-[10px] text-slate-500 uppercase tracking-widest text-center sm:text-right">
          © 2024-2026 Video Script Studio
        </p>
      </footer>
    </div>
  );
}

    const rootElement = document.getElementById("root");
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(React.createElement(ErrorBoundary, null, React.createElement(App, null)));
    }
  </script>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      var root = document.getElementById("root");
      try {
        if (!window.React || !window.ReactDOM || !window.Babel) {
          throw new Error("Không thể tải thư viện React/Babel từ CDN. Vui lòng kiểm tra kết nối mạng.");
        }
        var sourceEl = document.getElementById("app-source");
        if (!sourceEl) return;
        var sourceCode = sourceEl.textContent;
        var compiled = Babel.transform(sourceCode, {
          presets: [
            ["react", { runtime: "classic" }],
            ["typescript", { isTSX: true, allExtensions: true }]
          ],
          filename: "app.tsx"
        }).code;
        var scriptEl = document.createElement("script");
        scriptEl.text = "try {\n" + compiled + "\n} catch (runtimeErr) {\n" +
          "  console.error('Lỗi Runtime:', runtimeErr);\n" +
          "  var r = document.getElementById('root');\n" +
          "  if (r) {\n" +
          "    r.innerHTML = '<div style=\"background:#020205;color:#fca5a5;padding:2rem;font-family:sans-serif;min-height:100vh;\"><h3>❌ Lỗi Runtime ứng dụng:</h3><pre style=\"white-space:pre-wrap;font-size:12px;background:#18181b;padding:1rem;border-radius:8px;border:1px solid #3f3f46;color:#f87171;\">' + (runtimeErr.stack || runtimeErr.message || runtimeErr) + '</pre></div>';\n" +
          "  }\n" +
          "}";
        document.body.appendChild(scriptEl);
      } catch (err) {
        console.error("Lỗi khởi chạy ứng dụng:", err);
        if (root) {
          root.innerHTML = '<div style="background:#020205;color:#fca5a5;padding:2rem;font-family:sans-serif;min-height:100vh;"><h3>❌ Lỗi khởi chạy ứng dụng:</h3><pre style="white-space:pre-wrap;font-size:12px;background:#18181b;padding:1rem;border-radius:8px;border:1px solid #3f3f46;color:#f87171;">'
            + (err.stack || err.message || err) + '</pre></div>';
        }
      }
    });
  </script>
</body>
</html>
