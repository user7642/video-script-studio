    // --- GEMINI CLIENT LOGIC ---
    function getStoredApiKey(): string {
  return (localStorage.getItem('gemini_api_key') || '').trim();
}

function saveApiKey(key: string): void {
  const trimmed = key.trim();
  if (trimmed) {
    localStorage.setItem('gemini_api_key', trimmed);
  } else {
    localStorage.removeItem('gemini_api_key');
  }
}

function clearApiKey(): void {
  localStorage.removeItem('gemini_api_key');
}

function setSessionApiKey(key: string): void {
  saveApiKey(key);
}

function getSessionApiKey(): string {
  return getStoredApiKey();
}

function getEffectiveApiKey(): string {
  return getStoredApiKey();
}

async function callGeminiJson<T = any>(
  promptText: string,
  imageBase64?: string | null,
  systemInstructionText?: string
): Promise<T> {
  const apiKey = getEffectiveApiKey();
  if (!apiKey) {
    throw new Error('Chưa có Gemini API Key. Vui lòng bấm vào biểu tượng 🔑 ở góc trên bên phải để nhập API Key.');
  }

  const models = ['gemini-3.5-flash', 'gemini-3.6-flash', 'gemini-flash-latest'];
  let lastError: Error | null = null;

  for (const model of models) {
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey.trim()}`;

      const parts: any[] = [];
      if (imageBase64) {
        const match = imageBase64.match(/^data:(image\/[a-zA-Z0-9\+\-\.]+);base64,(.+)$/);
        if (match) {
          parts.push({
            inlineData: {
              mimeType: match[1],
              data: match[2],
            },
          });
        }
      }
      parts.push({ text: promptText });

      const requestBody: any = {
        contents: [{ parts }],
        generationConfig: {
          temperature: 0.7,
          responseMimeType: 'application/json',
        },
      };

      if (systemInstructionText) {
        requestBody.systemInstruction = {
          parts: [{ text: systemInstructionText }],
        };
      }

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody),
      });

      if (!res.ok) {
        const errorJson = await res.json().catch(() => ({}));
        const errMsg = errorJson.error?.message || `Lỗi HTTP ${res.status}`;
        throw new Error(`[${model}] ${errMsg}`);
      }

      const data = await res.json();
      const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!rawText) {
        throw new Error(`[${model}] Phản hồi từ Gemini không có nội dung văn bản.`);
      }

      let cleaned = rawText.trim();
      if (cleaned.startsWith('```json')) {
        cleaned = cleaned.replace(/^```json\s*/i, '').replace(/\s*```$/, '');
      } else if (cleaned.startsWith('```')) {
        cleaned = cleaned.replace(/^```\s*/, '').replace(/\s*```$/, '');
      }

      return JSON.parse(cleaned) as T;
    } catch (err: any) {
      lastError = err;
      console.warn(`Attempt with ${model} failed:`, err);
    }
  }

  throw lastError || new Error('Không thể kết nối đến Gemini API. Vui lòng thử lại.');
}

// 1. Sinh Kịch Bản (Generate Script)
async function generateScriptClient(params: {
  idea: string;
  hasProduct: boolean;
  productImage?: string | null;
  isRegenerate?: boolean;
}) {
  try {
    const res = await fetch('/api/generate-script', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        idea: params.idea,
        hasProduct: params.hasProduct,
        productImage: params.productImage ? { dataUrl: params.productImage } : null,
        isRegenerate: params.isRegenerate,
        customApiKey: getEffectiveApiKey(),
      }),
    });
    if (res.ok) {
      return await res.json();
    }
  } catch (e) {
    console.warn('/api/generate-script fallback to client direct call:', e);
  }

  const { idea, hasProduct, productImage, isRegenerate } = params;

  const promptText = `
### DỮ LIỆU ĐẦU VÀO
- Ý tưởng gốc: "${idea}"
- Sản phẩm đính kèm: ${hasProduct ? "Có sản phẩm xuất hiện trong video." : "Không có."} ${hasProduct && productImage ? "(Có ảnh sản phẩm)." : ""}
${isRegenerate ? "- YÊU CẦU LÀM MỚI: Viết cốt truyện & tuyến nhân vật MỚI HOÀN TOÀN so với kịch bản cũ, bám sát ý tưởng gốc." : ""}

### NHIỆM VỤ
1. Tiêu đề (title): Tên dự án hấp dẫn, ngắn gọn.
2. Nhân vật (characters): Khai báo danh sách nhân vật (id, name, age, role, appearance [mô tả chi tiết khuôn mặt, dáng người, kiểu tóc, trang phục], personality).
3. Kịch bản văn xuôi (scriptNarrative): Viết văn bản tường thuật liền mạch bối cảnh, hành động, tâm lý, biểu cảm và lời thoại.
4. Cảnh phim (scenes): Phân chia kịch bản thành danh sách cảnh (sceneNumber, title, location, charactersPresent, summary, dialogueAndAction).

### CẤU TRÚC JSON ĐẦU RA
{
  "title": "Tên dự án",
  "characters": [
    {
      "id": "char_1",
      "name": "Tên nhân vật",
      "age": "25",
      "role": "Vai chính",
      "appearance": "Mô tả ngoại hình...",
      "personality": "Tính cách..."
    }
  ],
  "scriptNarrative": "Kịch bản văn xuôi liền mạch...",
  "scenes": [
    {
      "id": "scene_1",
      "sceneNumber": 1,
      "title": "Tiêu đề cảnh",
      "location": "Địa điểm",
      "charactersPresent": ["Tên nhân vật"],
      "summary": "Tóm tắt cảnh",
      "dialogueAndAction": "Lời thoại và hành động"
    }
  ]
}
`;

  return callGeminiJson(promptText, productImage);
}

// 3. Sinh Prompt Tham Chiếu (Generate Reference Prompts)
async function generateReferencePromptsClient(params: {
  characters: any[];
  scenes: any[];
  style: string;
  aspectRatio: string;
}) {
  try {
    const res = await fetch('/api/generate-reference-prompts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ...params,
        customApiKey: getEffectiveApiKey(),
      }),
    });
    if (res.ok) {
      return await res.json();
    }
  } catch (e) {
    console.warn('/api/generate-reference-prompts fallback to client direct call:', e);
  }

  const { characters, scenes, style, aspectRatio } = params;

  const promptText = `
### DỮ LIỆU ĐẦU VÀO
- Danh sách nhân vật: ${JSON.stringify(characters, null, 2)}
- Danh sách cảnh: ${JSON.stringify(scenes, null, 2)}
- Phong cách hình ảnh: "${style}"
- Tỉ lệ khung hình: "${aspectRatio}"

### QUY TẮC BẮT BUỘC
1. ĐỊNH DẠNG SONG NGỮ ANH - VIỆT:
   - Bản tiếng Anh (characterReferencePrompt, prompt): Tiếng Anh chuẩn, chi tiết, tối ưu cho AI Image Generator (Midjourney, Flux, Ideogram...).
   - Bản tiếng Việt (characterReferencePromptVi, promptVi): Dịch sát nghĩa, tự nhiên để hiển thị UI.

2. QUỐC TỊCH / DÂN TỘC NHÂN VẬT:
   - Nêu rõ quốc tịch/dân tộc trong mô tả ngoại hình (mặc định "Vietnamese / người Việt Nam", trừ khi có chỉ định khác).

3. KHÓA NGOẠI HÌNH TRUNG LẬP (MẪU GỘP & CÁ NHÂN):
   - ĐÂY LÀ ẢNH MẪU KHÓA NGOẠI HÌNH, KHÔNG PHẢI BỐI CẢNH KỊCH BẢN.
   - Tư thế: Chuẩn "A-pose" toàn thân từ đầu đến chân (standing in A-pose with arms slightly angled down forming an A-shape, full front view, facing camera, full body character reference sheet from head to toe). Nhân vật đứng cạnh nhau hàng ngang.
   - Biểu cảm: Trung tính, thư giãn tự nhiên (neutral, relaxed expression). KHÔNG tả nụ cười hay cảm xúc.
   - Phông nền: Nền trắng trơn studio (plain seamless solid white background, uniform studio lighting, soft shadows). KHÔNG bối cảnh hay nội thất.
   - Cấm: Không cầm đạo cụ, không tương tác, KHÔNG chữ, watermark, logo.
   - Cú pháp kết thúc chuỗi tiếng Anh: "A-pose, full body character reference sheet, neutral relaxed expression, no text, no watermark, no logo, no props, plain white background. Style: ${style}, --ar ${aspectRatio}".

4. PROMPT MÔI TRƯỜNG (ENVIRONMENT PROMPTS):
   - Bối cảnh góc rộng cho từng địa điểm duy nhất. TUYỆT ĐỐI KHÔNG có người hoặc động vật.
   - Kết thúc chuỗi tiếng Anh bằng: "Style: ${style}, --ar ${aspectRatio}".

### CẤU TRÚC JSON ĐẦU RA
{
  "characterReferencePrompt": "Full body character sheet in English ending with A-pose, full body character reference sheet, neutral relaxed expression, no text, no watermark, no logo, no props, plain white background. Style: ${style}, --ar ${aspectRatio}",
  "characterReferencePromptVi": "Bản dịch tiếng Việt mô tả tất cả nhân vật...",
  "individualCharacterPrompts": [
    {
      "characterId": "char_1",
      "characterName": "Tên nhân vật",
      "prompt": "English prompt ending with A-pose, full body, neutral relaxed expression, no text, no watermark, no logo, no props, plain white background. Style: ${style}, --ar ${aspectRatio}",
      "promptVi": "Bản dịch tiếng Việt..."
    }
  ],
  "environmentPrompts": [
    {
      "id": "env_1",
      "location": "Địa điểm",
      "prompt": "English environment prompt ending with Style: ${style}, --ar ${aspectRatio}",
      "promptVi": "Bản dịch tiếng Việt..."
    }
  ]
}
`;

  return callGeminiJson(promptText);
}

// 4. Sinh Prompt Từng Cảnh (Generate Scene Prompts)
async function generateScenePromptsClient(params: {
  scenes: any[];
  characters: any[];
  style: string;
  aspectRatio: string;
  characterReferencePrompt: string;
  environmentPrompts: any[];
}) {
  try {
    const res = await fetch('/api/generate-scene-prompts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ...params,
        customApiKey: getEffectiveApiKey(),
      }),
    });
    if (res.ok) {
      return await res.json();
    }
  } catch (e) {
    console.warn('/api/generate-scene-prompts fallback to client direct call:', e);
  }

  const { scenes, characters, style, aspectRatio, characterReferencePrompt, environmentPrompts } = params;

  const promptText = `
### DỮ LIỆU ĐẦU VÀO
- Danh sách cảnh: ${JSON.stringify(scenes, null, 2)}
- Danh sách nhân vật: ${JSON.stringify(characters, null, 2)}
- Phong cách hình ảnh: "${style}"
- Tỉ lệ khung hình: "${aspectRatio}"
- Prompt mẫu nhân vật gộp: "${characterReferencePrompt}"
- Prompt môi trường: ${JSON.stringify(environmentPrompts, null, 2)}

### QUY TẮC BẮT BUỘC
1. KHỐI A — PROMPT ẢNH TĨNH KHỞI ĐẦU CẢNH (INITIAL FRAME):
   - 'initialFramePrompt' (tiếng Anh): Tiếng Anh chuẩn + mô tả ngắn ngoại hình (có quốc tịch, mặc định Vietnamese) + bối cảnh địa điểm + tư thế/biểu cảm mở đầu + phong cách "${style}" + tỉ lệ "--ar ${aspectRatio}". Kết thúc bằng: "no text, no watermark, no logo".
   - 'initialFramePromptVi' (tiếng Việt): Bản dịch tiếng Việt sát nghĩa tương ứng để hiển thị UI.

2. KHỐI B — PROMPT VIDEO (IMAGE-TO-VIDEO MOTION PROMPT):
   - 'videoPrompt' (tiếng Anh): Đoạn văn xuôi tiếng Anh liền mạch mô tả chuyển động và diễn biến hành động từ đầu đến cuối cảnh. KHÔNG lặp lại mô tả ngoại hình hay bối cảnh. Kết thúc bằng: "Do not add any text, icons, or symbols (including shopping cart icons) into the video."
   - 'videoPromptVi' (tiếng Việt): Bản dịch tiếng Việt sát nghĩa tương ứng của 'videoPrompt' để hiển thị UI. Kết thúc bằng: "Không chèn thêm bất kỳ chữ, icon, hay biểu tượng nào (kể cả icon giỏ hàng) vào video."

3. TRƯỜNG "LOCATION" CỦA MỖI CẢNH:
   - Trường "location" của mỗi cảnh PHẢI lấy nguyên văn (copy chính xác, không diễn giải lại) một trong các giá trị "location" đã có sẵn trong danh sách environmentPrompts được truyền vào — không được tự đặt tên khác cho cùng một địa điểm.

### CẤU TRÚC JSON ĐẦU RA
{
  "scenePrompts": [
    {
      "sceneNumber": 1,
      "sceneTitle": "Tiêu đề cảnh",
      "location": "Địa điểm",
      "charactersPresent": ["Tên NV"],
      "initialFramePrompt": "English image prompt for Block A ending with no text, no watermark, no logo",
      "initialFramePromptVi": "Bản dịch tiếng Việt của Khối A...",
      "videoPrompt": "English video motion prompt for Block B...",
      "videoPromptVi": "Bản dịch tiếng Việt sát nghĩa của Khối B..."
    }
  ]
}
`;

  const res = await callGeminiJson<{ scenePrompts: any[] }>(promptText);

  // Safeguard: Ensure location in scenePrompts matches exact string from environmentPrompts
  if (res && Array.isArray(res.scenePrompts) && Array.isArray(environmentPrompts)) {
    const validLocations = environmentPrompts.map((e: any) => e.location).filter(Boolean);
    if (validLocations.length > 0) {
      res.scenePrompts = res.scenePrompts.map((sp: any) => {
        if (sp.location) {
          const exactMatch = validLocations.find((loc: string) => loc === sp.location);
          if (exactMatch) {
            sp.location = exactMatch;
          } else {
            const lowerSpLoc = String(sp.location).trim().toLowerCase();
            const fuzzyMatch = validLocations.find((loc: string) => {
              const lowerLoc = String(loc).trim().toLowerCase();
              if (lowerLoc === lowerSpLoc) return true;
              if (lowerSpLoc.length >= 3 && lowerLoc.includes(lowerSpLoc)) return true;
              if (lowerLoc.length >= 3 && lowerSpLoc.includes(lowerLoc)) return true;
              return false;
            });
            if (fuzzyMatch) {
              sp.location = fuzzyMatch;
            }
          }
        }
        return sp;
      });
    }
  }

  return res;
}

// 5. Refine Prompt (Chỉnh Sửa Prompt Đơn)
async function refinePromptClient(params: {
  currentPromptText: string;
  instruction: string;
  context?: any;
}) {
  try {
    const res = await fetch('/api/refine-prompt', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ...params,
        customApiKey: getEffectiveApiKey(),
      }),
    });
    if (res.ok) {
      return await res.json();
    }
  } catch (e) {
    console.warn('/api/refine-prompt fallback to client direct call:', e);
  }

  const { currentPromptText, instruction, context } = params;
  const promptText = `Prompt hiện tại (bản tiếng Anh gốc): "${currentPromptText || ""}"\nNgữ cảnh: ${JSON.stringify(context || {})}\nYêu cầu sửa đổi từ người dùng: "${instruction || "Hãy viết lại prompt linh hoạt và tối ưu hơn."}"\nLƯU Ý:\n1. Áp dụng yêu cầu sửa vào bản tiếng Anh trước ('newPrompt'). Nếu prompt mô tả nhân vật hoặc ảnh tĩnh mở đầu (Khối A), nêu rõ quốc tịch/dân tộc nhân vật (mặc định người Việt Nam / Vietnamese).\n2. Dịch lại 'newPrompt' sang tiếng Việt sát nghĩa, dễ hiểu ('newPromptVi') để hiển thị trên UI.\n\nTrả về JSON: { "newPrompt": "...", "newPromptVi": "..." }`;
  return callGeminiJson(promptText);
}

              >
                Không
              </button>
              <button
                type="button"
                onClick={() => setHasProduct(true)}
                className={`px-3 py-1.5 rounded-md text-xs font-semibold transition-all cursor-pointer ${
                  hasProduct
                    ? 'bg-indigo-600 text-white shadow shadow-indigo-600/30'
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                Có sản phẩm
              </button>
            </div>
          </div>

          {/* Image Upload Area if hasProduct is true */}
          {hasProduct && (
            <div className="pt-2 border-t border-slate-800">
              <span className="block text-xs font-semibold text-slate-300 mb-2">
                Tải ảnh sản phẩm thực tế <span className="text-rose-400">(Bắt buộc)</span>
              </span>

              {productImage ? (
                <div className="flex items-center gap-4 p-3 bg-slate-900 rounded-xl border border-indigo-500/30">
                  <img
                    src={productImage.dataUrl}
                    alt="Sản phẩm"
                    className="w-20 h-20 object-cover rounded-lg border border-slate-700 bg-slate-950"
                  />
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-1.5 text-xs font-semibold text-emerald-400 mb-1">
                      <CheckCircle className="w-4 h-4" />
                      <span>Đã tải ảnh sản phẩm thành công</span>
                    </div>
                    <p className="text-[11px] text-slate-400">
                      Ảnh này sẽ được Gemini phân tích đặc điểm và đưa vào prompt mô tả sản phẩm ở Bước 3.
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setProductImage(null)}
                    className="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition-colors cursor-pointer"
                    title="Xóa ảnh này"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>
              ) : (
                <label className="flex flex-col items-center justify-center p-6 bg-slate-900 border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-xl cursor-pointer transition-all group">
                  <Upload className="w-8 h-8 text-indigo-400 group-hover:scale-110 transition-transform mb-2" />
                  <span className="text-xs font-semibold text-slate-200 mb-1">
                    Bấm để tải ảnh sản phẩm thực tế
                  </span>
                  <span className="text-[11px] text-slate-400">
                    Chấp nhận PNG, JPG, WEBP (Tối đa 10MB)
                  </span>
                  <input
                    type="file"
                    accept="image/*"
                    onChange={handleImageUpload}
                    className="hidden"
                  />
                </label>
              )}
            </div>
          )}
        </div>

        {/* 3. Sample Ideas Quick Select (Collapsible Accordion on Mobile) */}
        <div>
          {/* Mobile Accordion Toggle Header */}
          <button
            type="button"
            onClick={() => setIsSampleOpen(!isSampleOpen)}
            className="sm:hidden w-full flex items-center justify-between p-3 rounded-xl bg-slate-900/80 border border-slate-700 text-xs font-semibold text-slate-300 hover:text-white transition-all cursor-pointer"
          >
            <div className="flex items-center gap-2">
              <Lightbulb className="w-4 h-4 text-amber-400" />
              <span>💡 Xem gợi ý mẫu</span>
            </div>
            <span className="text-indigo-400 text-[11px] font-semibold flex items-center gap-1">
              {isSampleOpen ? 'Thu gọn ▴' : 'Bấm để chọn mẫu ▾'}
            </span>
          </button>

          {/* Desktop Header */}
          <div className="hidden sm:flex items-center gap-2 mb-2.5 text-xs font-semibold text-slate-300">
            <Lightbulb className="w-4 h-4 text-amber-400" />
            <span>Gợi ý mẫu bấm chọn nhanh:</span>
          </div>

          {/* Sample Cards Container */}
          <div className={`mt-2.5 sm:mt-0 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 ${isSampleOpen ? 'block' : 'hidden sm:grid'}`}>
            {SAMPLE_IDEAS.map((sample, idx) => (
              <button
                key={idx}
                type="button"
                onClick={() => handleApplySample(sample)}
                className="text-left p-3 rounded-xl bg-slate-900/50 border border-slate-700 hover:border-indigo-500/50 hover:bg-slate-900 transition-all text-xs group cursor-pointer"
              >
                <div className="font-semibold text-slate-200 group-hover:text-indigo-400 mb-1 flex items-center justify-between">
                  <span>{sample.title}</span>
                  <span className="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">
                    {sample.category}
                  </span>
                </div>
                <p className="text-slate-400 text-[11px] line-clamp-2">{sample.description}</p>
              </button>
            ))}
          </div>
        </div>

        {/* Error message */}
        {errorMsg && (
          <div className="p-3 bg-rose-500/10 border border-rose-500/20 rounded-xl text-xs text-rose-300 font-medium">
            {errorMsg}
          </div>
        )}

        {/* Submit Button */}
        <div className="pt-2">
          <button
            type="submit"
            disabled={isLoading}
            className="w-full py-4 px-6 rounded-xl bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold text-sm tracking-wide shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 transition-all transform hover:-translate-y-0.5 disabled:opacity-50 disabled:transform-none cursor-pointer"
          >
            {isLoading ? (
              <>
                <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin" />
                <span>Đang phân tích ý tưởng & biên tập kịch bản...</span>
              </>
            ) : (
              <>
                <Sparkles className="w-5 h-5 text-amber-300" />
                <span>Tạo kịch bản (Sang bước 1)</span>
                <ArrowRight className="w-5 h-5 ml-1" />
              </>
            )}
          </button>
        </div>
      </form>
    </div>
  );
};

    interface Step1Props {
  projectData: ProjectData;
  onUpdateProjectData: (newData: ProjectData) => void;
  onRefineWithAi: (userRequest: string) => Promise<void>;
  onRegenerateFullScript: () => Promise<void>;
  onNextStep: () => void;
  isLoading: boolean;
}

const Step1Script: React.FC<Step1Props> = ({
  projectData,
  onUpdateProjectData,
  onRefineWithAi,
  onRegenerateFullScript,
  onNextStep,
  isLoading,
}) => {
  const [editingTitle, setEditingTitle] = useState(false);
  const [titleInput, setTitleInput] = useState(projectData.title);
  const [refineInput, setRefineInput] = useState('');
  const [editingCharId, setEditingCharId] = useState<string | null>(null);
  const [editingNarrative, setEditingNarrative] = useState(false);
  const [narrativeInput, setNarrativeInput] = useState(projectData.scriptNarrative);
  const [showRegenerateModal, setShowRegenerateModal] = useState(false);

  // Focus ref for refinement input
  const refineInputRef = React.useRef<HTMLInputElement>(null);

  // Title Save
  const handleSaveTitle = () => {
    if (titleInput.trim()) {
      onUpdateProjectData({ ...projectData, title: titleInput.trim() });
    }
    setEditingTitle(false);
  };

  const handleConfirmRegenerate = async () => {
    setShowRegenerateModal(false);
    await onRegenerateFullScript();
  };

  // Character inline update
  const handleUpdateChar = (id: string, field: keyof Character, value: string) => {
    const updatedChars = projectData.characters.map((c) =>
      c.id === id ? { ...c, [field]: value } : c
    );
    onUpdateProjectData({ ...projectData, characters: updatedChars });
  };

  const handleAddChar = () => {
    const newChar: Character = {
      id: `char_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`,
      name: 'Nhân vật mới',
      age: '25 tuổi',
      role: 'Phụ',
      appearance: 'Gương mặt thanh tú, tóc đen tự nhiên, phong cách năng động.',
    };
    onUpdateProjectData({
      ...projectData,
      characters: [...projectData.characters, newChar],
    });
    setEditingCharId(newChar.id);
  };

  const handleDeleteChar = (id: string) => {
    const updatedChars = projectData.characters.filter((c) => c.id !== id);
    onUpdateProjectData({ ...projectData, characters: updatedChars });
  };

  // Narrative Save
  const handleSaveNarrative = () => {
    onUpdateProjectData({ ...projectData, scriptNarrative: narrativeInput });
    setEditingNarrative(false);
  };

  // Submit AI refinement
  const handleRefineSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    if (!refineInput.trim()) return;
    await onRefineWithAi(refineInput.trim());
    setRefineInput('');
  };

  const handleFocusRefine = () => {
    refineInputRef.current?.focus();
    refineInputRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  return (
    <div className="max-w-5xl mx-auto py-6 px-4 pb-28">
      {/* Top Global Action Bar for Full Script Regeneration */}
      <div className="mb-6 bg-slate-800/80 border border-indigo-500/30 rounded-2xl p-4 shadow-lg flex flex-col sm:flex-row items-center justify-between gap-3 bg-gradient-to-r from-slate-800 via-slate-800 to-indigo-950/40">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center shrink-0">
            <RotateCcw className="w-5 h-5" />
          </div>
          <div>
            <h3 className="font-bold text-slate-100 text-sm">Chưa ưng ý với kịch bản này?</h3>
            <p className="text-xs text-slate-400">
              Sinh phiên bản kịch bản & nhân vật hoàn toàn mới từ ý tưởng ban đầu của bạn.
            </p>
          </div>
        </div>

        <button
          onClick={() => setShowRegenerateModal(true)}
          disabled={isLoading}
          className="w-full sm:w-auto px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-xl shadow-md flex items-center justify-center gap-2 transition-all disabled:opacity-50 shrink-0"
        >
          <RotateCcw className={`w-4 h-4 ${isLoading ? 'animate-spin' : ''}`} />
          <span>🔄 Viết lại toàn bộ kịch bản</span>
        </button>
      </div>

      {/* Confirmation Modal */}
      {showRegenerateModal && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-400 flex items-center justify-center shrink-0">
                <RotateCcw className="w-5 h-5" />
              </div>
              <h3 className="font-bold text-slate-100 text-base">Xác nhận viết lại toàn bộ kịch bản</h3>
            </div>

            <p className="text-sm text-slate-300 leading-relaxed bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
              Toàn bộ nhân vật và kịch bản hiện tại sẽ bị thay thế, bạn có chắc chắn?
            </p>

            <div className="flex justify-end gap-3 pt-2">
              <button
                onClick={() => setShowRegenerateModal(false)}
                className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-xl text-xs font-medium"
              >
                Hủy
              </button>
              <button
                onClick={handleConfirmRegenerate}
                disabled={isLoading}
                className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs shadow-lg flex items-center gap-1.5"
              >
                {isLoading ? (
                  <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" />
                ) : (
                  <RotateCcw className="w-3.5 h-3.5" />
                )}
                <span>Đồng ý viết lại</span>
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Title Section */}
      <div className="mb-6 bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg">
        <div className="flex items-center justify-between gap-3 mb-2">
          <span className="text-[10px] font-bold uppercase tracking-widest text-indigo-400">
            Khối 1 — Tên dự án
          </span>
          {!editingTitle && (
            <button
              onClick={() => {
                setTitleInput(projectData.title);
                setEditingTitle(true);
              }}
              className="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium text-slate-300 bg-slate-700 hover:bg-slate-600 rounded-lg transition-colors"
            >
              <Pencil className="w-3.5 h-3.5" />
              <span>Đổi tên dự án</span>
            </button>
          )}
        </div>

        {editingTitle ? (
          <div className="flex items-center gap-2">
            <input
              type="text"
              value={titleInput}
              onChange={(e) => setTitleInput(e.target.value)}
              className="flex-1 px-3 py-2 bg-slate-900/50 border border-indigo-500 rounded-xl text-lg font-bold text-white focus:outline-none"
              autoFocus
            />
            <button
              onClick={handleSaveTitle}
              className="px-4 py-2 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl font-semibold text-xs transition-colors"
            >
              Lưu
            </button>
            <button
              onClick={() => setEditingTitle(false)}
              className="px-3 py-2 bg-slate-700 text-slate-300 hover:text-white rounded-xl text-xs"
            >
              Hủy
            </button>
          </div>
        ) : (
          <h2 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
            {projectData.title}
          </h2>
        )}
      </div>

      {/* Characters List Section */}
      <div className="mb-6 bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg">
        <div className="flex items-center justify-between gap-3 mb-4">
          <div>
            <span className="text-[10px] font-bold uppercase tracking-widest text-indigo-400 block">
              Khối 2 — Danh sách nhân vật
            </span>
            <p className="text-xs text-slate-400">
              Mô tả ngoại hình này sẽ làm gốc cho prompt ảnh nhân vật ở Bước 2.
            </p>
          </div>
          <button
            onClick={handleAddChar}
            className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold transition-colors"
          >
            <Plus className="w-3.5 h-3.5" />
            <span>Thêm nhân vật</span>
          </button>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          {projectData.characters.map((char) => {
            const isEditingThis = editingCharId === char.id;

            return (
              <div
                key={char.id}
                className="bg-slate-900/50 border border-slate-700 rounded-xl p-4 flex flex-col justify-between hover:border-slate-600 transition-colors"
              >
                <div>
                  <div className="flex items-center justify-between gap-2 mb-2">
                    <div className="flex items-center gap-2">
                      <div className="w-8 h-8 rounded-full bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center font-bold text-sm shrink-0">
                        <User className="w-4 h-4" />
                      </div>
                      <div>
                        <h4 className="font-bold text-slate-100 text-sm">{char.name}</h4>
                        <div className="flex items-center gap-2 text-[11px] text-slate-400">
                          <span>{char.age}</span>
                          <span>•</span>
                          <span className="text-amber-400">{char.role}</span>
                        </div>
                      </div>
                    </div>

                    <div className="flex items-center gap-1">
                      <button
                        onClick={() => setEditingCharId(isEditingThis ? null : char.id)}
                        className="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors"
                        title="Sửa nhân vật"
                      >
                        <Pencil className="w-3.5 h-3.5" />
                      </button>
                      {projectData.characters.length > 1 && (
                        <button
                          onClick={() => handleDeleteChar(char.id)}
                          className="p-1.5 text-slate-400 hover:text-rose-400 rounded-lg hover:bg-slate-800 transition-colors"
                          title="Xóa nhân vật"
                        >
                          <Trash2 className="w-3.5 h-3.5" />
                        </button>
                      )}
                    </div>
                  </div>

                  {isEditingThis ? (
                    <div className="space-y-2 mt-3 pt-3 border-t border-slate-800 text-xs">
                      <div>
                        <label className="text-slate-400 block mb-1">Tên nhân vật:</label>
                        <input
                          type="text"
                          value={char.name}
                          onChange={(e) => handleUpdateChar(char.id, 'name', e.target.value)}
                          className="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-slate-400 block mb-1">Tuổi:</label>
                          <input
                            type="text"
                            value={char.age}
                            onChange={(e) => handleUpdateChar(char.id, 'age', e.target.value)}
                            className="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white"
                          />
                        </div>
                        <div>
                          <label className="text-slate-400 block mb-1">Vai trò/Mối quan hệ:</label>
                          <input
                            type="text"
                            value={char.role}
                            onChange={(e) => handleUpdateChar(char.id, 'role', e.target.value)}
                            className="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white"
                          />
                        </div>
                      </div>
                      <div>
                        <label className="text-slate-400 block mb-1">
                          Mô tả ngoại hình (khuôn mặt, dáng người, trang phục, phong cách):
                        </label>
                        <textarea
                          rows={3}
                          value={char.appearance}
                          onChange={(e) => handleUpdateChar(char.id, 'appearance', e.target.value)}
                          className="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white"
                        />
                      </div>
                      <button
                        onClick={() => setEditingCharId(null)}
                        className="w-full py-1.5 bg-indigo-600 text-white rounded-lg font-semibold text-xs"
                      >
                        Xong
                      </button>
                    </div>
                  ) : (
                    <div className="p-2.5 bg-slate-900/60 rounded-lg border border-slate-800/60 text-xs text-slate-300 leading-relaxed mt-2">
                      <span className="font-semibold text-slate-400 block mb-0.5">Ngoại hình:</span>
                      {char.appearance}
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Detailed Narrative Script Section */}
      <div className="mb-6 bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg">
        <div className="flex items-center justify-between gap-3 mb-3">
          <div>
            <span className="text-[10px] font-bold uppercase tracking-widest text-indigo-400 block">
              Khối 3 — Kịch bản chi tiết (Văn xuôi liền mạch)
            </span>
            <p className="text-xs text-slate-400">
              Kịch bản đọc như một câu chuyện, lời thoại lồng ghép tự nhiên theo thứ tự diễn biến.
            </p>
          </div>
          {!editingNarrative && (
            <button
              onClick={() => {
                setNarrativeInput(projectData.scriptNarrative);
                setEditingNarrative(true);
              }}
              className="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium text-slate-300 bg-slate-700 hover:bg-slate-600 rounded-lg transition-colors"
            >
              <Pencil className="w-3.5 h-3.5" />
              <span>Chỉnh sửa văn bản</span>
            </button>
          )}
        </div>

        {editingNarrative ? (
          <div className="space-y-3">
            <textarea
              rows={12}
              value={narrativeInput}
              onChange={(e) => setNarrativeInput(e.target.value)}
              className="w-full p-4 bg-slate-900/50 border border-indigo-500 rounded-xl text-slate-100 text-sm leading-relaxed focus:outline-none"
            />
            <div className="flex items-center justify-end gap-2">
              <button
                onClick={() => setEditingNarrative(false)}
                className="px-4 py-2 bg-slate-700 text-slate-300 rounded-xl text-xs"
              >
                Hủy
              </button>
              <button
                onClick={handleSaveNarrative}
                className="px-5 py-2 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl font-semibold text-xs"
              >
                Lưu kịch bản
              </button>
            </div>
          </div>
        ) : (
          <div className="p-4 sm:p-5 bg-slate-900/50 border border-slate-700 rounded-xl text-slate-200 text-sm leading-relaxed whitespace-pre-wrap font-sans">
            {projectData.scriptNarrative}
          </div>
        )}
      </div>

      {/* AI Refinement Request Input Box */}
      <div className="mb-6 bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-5 shadow-lg">
        <label className="block text-[10px] font-bold uppercase tracking-widest text-amber-400 mb-1.5">
          Muốn sửa gì không? (Gửi yêu cầu cho Gemini AI)
        </label>
        <p className="text-xs text-slate-400 mb-3">
          Nhập yêu cầu (ví dụ: "Đổi tên nhân vật nam thành Tuấn", "Thêm 1 cảnh ở quán cà phê", "Cho kịch bản hài hước hơn"). Gemini sẽ chỉ cập nhật đúng phần liên quan và giữ nguyên các phần còn lại.
        </p>
        <form onSubmit={handleRefineSubmit} className="flex gap-2">
          <input
            ref={refineInputRef}
            type="text"
            value={refineInput}
            onChange={(e) => setRefineInput(e.target.value)}
            placeholder="Nhập yêu cầu sửa kịch bản..."
            disabled={isLoading}
            className="flex-1 px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 transition-colors"
          />
          <button
            type="submit"
            disabled={isLoading || !refineInput.trim()}

    interface Step3Props {
  projectData: ProjectData;
  onUpdateProjectData: (newData: ProjectData) => void;
  onResetProject: () => void;
  onGenerateScenePrompts: () => Promise<void>;
  isScriptModifiedAfterGenerate?: boolean;
  isLoading: boolean;
}

interface ToastInfo {
  id: number;
  type: 'success' | 'error';
  message: string;
}

const Step3ScenePrompts: React.FC<Step3Props> = ({
  projectData,
  onUpdateProjectData,
  onResetProject,
  onGenerateScenePrompts,
  isScriptModifiedAfterGenerate = false,
  isLoading,
}) => {
  const [copiedAll, setCopiedAll] = useState(false);
  const [copiedItemKey, setCopiedItemKey] = useState<string | null>(null);
  const [toast, setToast] = useState<ToastInfo | null>(null);
  const toastTimerRef = useRef<any>(null);

  useEffect(() => {
    return () => {
      if (toastTimerRef.current) {
        clearTimeout(toastTimerRef.current);
      }
    };
  }, []);

  const showToast = (type: 'success' | 'error', message: string) => {
    if (toastTimerRef.current) {
      clearTimeout(toastTimerRef.current);
    }
    setToast({ id: Date.now(), type, message });
    toastTimerRef.current = setTimeout(() => {
      setToast(null);
    }, 3500);
  };

  const triggerCopyFeedback = (key: string) => {
    setCopiedItemKey(key);
    setTimeout(() => {
      setCopiedItemKey(null);
    }, 1500);
  };

  const handleCopyLocationPrompt = async (locationName: string, itemKey: string) => {
    if (!locationName || locationName === 'N/A') {
      showToast('error', `Không tìm thấy prompt môi trường cho: ${locationName || 'N/A'}`);
      return;
    }

    const cleanLoc = locationName.trim().toLowerCase();
    const envPrompts = projectData.environmentPrompts || [];

    const matched =
      envPrompts.find((e) => e.location && e.location.trim().toLowerCase() === cleanLoc) ||
      envPrompts.find(
        (e) =>
          e.location &&
          (e.location.trim().toLowerCase().includes(cleanLoc) ||
            cleanLoc.includes(e.location.trim().toLowerCase()))
      );

    if (matched && matched.prompt) {
      try {
        await navigator.clipboard.writeText(matched.prompt);
        triggerCopyFeedback(itemKey);
        showToast('success', `Đã sao chép prompt môi trường: ${matched.location || locationName}`);
      } catch (err) {
        console.error('Failed to copy location prompt:', err);
        showToast('error', `Lỗi khi sao chép prompt môi trường: ${locationName}`);
      }
    } else {
      showToast('error', `Không tìm thấy prompt môi trường cho: ${locationName}`);
    }
  };

  const handleCopyCharacterPrompt = async (charName: string, itemKey: string) => {
    if (!charName) {
      showToast('error', 'Không tìm thấy prompt nhân vật.');
      return;
    }

    const cleanName = charName.trim().toLowerCase();
    const indivPrompts = projectData.individualCharacterPrompts || [];

    const matched =
      indivPrompts.find((c) => c.characterName && c.characterName.trim().toLowerCase() === cleanName) ||
      indivPrompts.find(
        (c) =>
          c.characterName &&
          (c.characterName.trim().toLowerCase().includes(cleanName) ||
            cleanName.includes(c.characterName.trim().toLowerCase()))
      );

    if (matched && matched.prompt) {
      try {
        await navigator.clipboard.writeText(matched.prompt);
        triggerCopyFeedback(itemKey);
        showToast('success', `Đã sao chép prompt nhân vật: ${matched.characterName || charName}`);
      } catch (err) {
        console.error('Failed to copy character prompt:', err);
        showToast('error', `Lỗi khi sao chép prompt nhân vật: ${charName}`);
      }
    } else {
      showToast('error', `Không tìm thấy prompt nhân vật cho: ${charName}`);
    }
  };

  // Combine all video prompts sequentially for UI DISPLAY (Vietnamese)
  const allVideoPromptsMergedVi = (projectData.scenePrompts || [])
    .map((sp, idx) => {
      const label =
        idx === 0
          ? `[Ảnh tham chiếu 1 — mở đầu | ${sp.sceneTitle}]`
          : `[Ảnh tham chiếu ${sp.sceneNumber} — tiếp nối cảnh trước | ${sp.sceneTitle}]`;
      return `${label}\n${sp.videoPromptVi || sp.videoPrompt}`;
    })
    .join('\n\n');

  // Combine all video prompts sequentially for COPY BUTTON (English)
  const allVideoPromptsMergedEn = (projectData.scenePrompts || [])
    .map((sp, idx) => {
      const label =
        idx === 0
          ? `[Ảnh tham chiếu 1 — mở đầu | ${sp.sceneTitle}]`
          : `[Ảnh tham chiếu ${sp.sceneNumber} — tiếp nối cảnh trước | ${sp.sceneTitle}]`;
      return `${label}\n${sp.videoPrompt}`;
    })
    .join('\n\n');

  const handleCopyAllVideoPrompts = async () => {
    try {
      await navigator.clipboard.writeText(allVideoPromptsMergedEn);
      setCopiedAll(true);
      setTimeout(() => setCopiedAll(false), 2000);
    } catch (err) {
      console.error('Failed to copy all video prompts: ', err);
    }
  };

  return (
    <div className="max-w-5xl mx-auto py-6 px-4 pb-28 space-y-8 relative">
      {/* Floating Toast Notification */}
      {toast && (
        <div
          className={`fixed top-6 right-6 z-50 flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-2xl border text-xs sm:text-sm font-semibold transition-all transform animate-in fade-in slide-in-from-top-3 ${
            toast.type === 'success'
              ? 'bg-slate-900/95 border-emerald-500/60 text-emerald-300 shadow-emerald-950/40'
              : 'bg-slate-900/95 border-rose-500/60 text-rose-300 shadow-rose-950/40'
          }`}
        >
          {toast.type === 'success' ? (
            <CheckCircle2 className="w-4 h-4 text-emerald-400 shrink-0" />
          ) : (
            <XCircle className="w-4 h-4 text-rose-400 shrink-0" />
          )}
          <span>{toast.message}</span>
        </div>
      )}

      {/* Script Modified Warning Banner */}
      {isScriptModifiedAfterGenerate && (
        <div className="p-4 bg-amber-500/10 border border-amber-500/30 rounded-2xl text-amber-300 text-xs flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-lg">
          <div className="flex items-center gap-2">
            <AlertCircle className="w-4 h-4 text-amber-400 shrink-0" />
            <span>⚠️ Kịch bản ở Tab 1 đã thay đổi — nội dung dưới đây có thể chưa cập nhật theo, nhấn 'Tạo lại theo kịch bản mới' nếu cần đồng bộ.</span>
          </div>
          <button

    // --- APP MAIN COMPONENT ---
    function App() {
  const [currentStep, setCurrentStep] = useState<Step>(0);
  const [maxStepReached, setMaxStepReached] = useState<Step>(1);
  const [isLoading, setIsLoading] = useState(false);
  const [loadingProgress, setLoadingProgress] = useState(0);
  const [loadingStatus, setLoadingStatus] = useState('');
  const [errorMsg, setErrorMsg] = useState<string | null>(null);

  // Custom API key state read from localStorage
  const [customApiKey, setCustomApiKey] = useState<string>(() => getStoredApiKey());

  const handleApiKeyChange = (key: string) => {
    setCustomApiKey(key);
    saveApiKey(key);
    if (key.trim()) {
      setErrorMsg(null);
    }
  };

  const ensureApiKeyOrShowError = (): boolean => {
    const key = getStoredApiKey();
    if (!key) {
      setErrorMsg('Chưa có Gemini API Key. Vui lòng bấm vào biểu tượng 🔑 ở góc trên bên phải để nhập API Key trước khi sử dụng.');
      return false;
    }
    return true;
  };

  const progressIntervalRef = useRef<any>(null);

  useEffect(() => {
    if (!getStoredApiKey()) {
      setErrorMsg('Chưa có Gemini API Key. Vui lòng bấm vào biểu tượng 🔑 ở góc trên bên phải để nhập API Key trước khi sử dụng.');
    }
    return () => {
      if (progressIntervalRef.current) {
        clearInterval(progressIntervalRef.current);
      }
    };
  }, []);

  const startLoading = (initialStatus: string) => {
    setIsLoading(true);
    setLoadingProgress(10);
    setLoadingStatus(initialStatus);

    if (progressIntervalRef.current) {
      clearInterval(progressIntervalRef.current);
    }

    progressIntervalRef.current = setInterval(() => {
      setLoadingProgress((prev) => {
        if (prev >= 92) return prev;
        const diff = Math.max(1, Math.floor((95 - prev) / 6));
        return prev + diff;
      });
    }, 350);
  };

  const updateLoadingStatus = (status: string) => {
    setLoadingStatus(status);
  };

  const stopLoading = () => {
    if (progressIntervalRef.current) {
      clearInterval(progressIntervalRef.current);
      progressIntervalRef.current = null;
    }
    setLoadingProgress(100);
    setTimeout(() => {
      setIsLoading(false);
      setLoadingProgress(0);
      setLoadingStatus('');
    }, 350);
  };

  // Raw user idea from Step 0
  const [rawIdea, setRawIdea] = useState<string>('');

  // Core Project State
  const [projectData, setProjectData] = useState<ProjectData>({
    title: '',
    characters: [],
    scriptNarrative: '',
    scenes: [],
    style: 'Hiện thực',
    aspectRatio: '9:16',
    characterReferencePrompt: '',
    characterReferencePromptVi: '',
    individualCharacterPrompts: [],
    environmentPrompts: [],
    scenePrompts: [],

      scriptNarrative: '',
      scenes: [],
      style: 'Hiện thực',
      aspectRatio: '9:16',
      characterReferencePrompt: '',
      characterReferencePromptVi: '',
      individualCharacterPrompts: [],
      environmentPrompts: [],
      scenePrompts: [],

    setRawIdea(idea);
    setHasProductFlag(hasProduct);
    setProductInfo(productImage);

      updateLoadingStatus('Đang cấu trúc tuyến nhân vật & phân cảnh chi tiết...');
    }, 2500);

    try {
      const data = await generateScriptClient({
        idea,
        hasProduct,
        productImage: productImage?.dataUrl || null,
      });

      setProjectData((prev) => ({
        ...prev,
        title: data.title || 'Dự án Video Script',
        characters: data.characters || [],
        scriptNarrative: data.scriptNarrative || '',
        scenes: data.scenes || [],
        characterReferencePrompt: '',
        individualCharacterPrompts: [],
        environmentPrompts: [],
        scenePrompts: [],
      }));

      setCurrentStep(1);
      setMaxStepReached((prev) => (Math.max(prev, 1) as Step));
      setIsScriptModifiedAfterGenerate(false);
    } catch (err: any) {
      console.error('Error in handleGenerateScript:', err);
      setErrorMsg(err.message || 'Có lỗi xảy ra khi sinh kịch bản. Vui lòng thử lại.');
    } finally {
      clearTimeout(timer);
      stopLoading();
    }
  };

    startLoading('Đang gọi AI viết lại toàn bộ kịch bản mới...');
    setErrorMsg(null);

    const timer = setTimeout(() => {
      updateLoadingStatus('Đang làm mới cốt truyện & danh sách phân cảnh...');
    }, 2500);

    try {
      const data = await generateScriptClient({
        idea: rawIdea,
        hasProduct: hasProductFlag,
        productImage: productInfo?.dataUrl || null,
        isRegenerate: true,
      });

      setProjectData((prev) => ({
        ...prev,
        title: data.title || prev.title,
        characters: data.characters || [],
        scriptNarrative: data.scriptNarrative || '',
        scenes: data.scenes || [],
        characterReferencePrompt: '',
        individualCharacterPrompts: [],
        environmentPrompts: [],
        scenePrompts: [],
      }));

      markScriptAsModified();
    } catch (err: any) {
      console.error('Error in handleRegenerateFullScript:', err);
      setErrorMsg(err.message || 'Không thể viết lại toàn bộ kịch bản. Vui lòng thử lại.');

      clearTimeout(timer);

      const data = await refineScriptClient({
        currentData: projectData,
        userRequest,

        ...prev,
        title: data.title || prev.title,
        characters: data.characters || prev.characters,
        scriptNarrative: data.scriptNarrative || prev.scriptNarrative,
        scenes: data.scenes || prev.scenes,

    <div className="min-h-screen flex flex-col bg-slate-900 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">
      {/* Header */}
      <Header
        currentStep={currentStep}
        onStepClick={(step) => setCurrentStep(step)}

      <main className="flex-1 transition-all duration-300">

        {errorMsg && (
