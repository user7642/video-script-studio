    function getStoredApiKey() {
      try {
        return (localStorage.getItem('gemini_api_key') || '').trim();
      } catch (e) {
        console.warn('LocalStorage not available:', e);
        return '';
      }
    }
    function saveApiKey(key) {
      const trimmed = (key || '').trim();
      try {
        if (trimmed) {
          localStorage.setItem('gemini_api_key', trimmed);
        } else {
          localStorage.removeItem('gemini_api_key');
        }
      } catch (e) {
        console.warn('LocalStorage save failed:', e);
      }
    }
    function getEffectiveApiKey() {
      return getStoredApiKey();
    }
    function setSessionApiKey(key) {
      saveApiKey(key);

    // --- GEMINI DIRECT CLIENT CALL (lib/clientGemini.ts & server.ts logic) ---
    async function callGeminiJson(promptText, imageBase64 = null, systemInstructionText = null) {
      const apiKey = getEffectiveApiKey();
      if (!apiKey) {
        throw new Error('Chưa có Gemini API Key. Vui lòng bấm vào biểu tượng 🔑 ở góc trên bên phải để nhập API Key.');
      }

      const models = ['gemini-3.6-flash', 'gemini-3.1-flash-lite', 'gemini-flash-latest'];
      let lastError = null;

      for (const model of models) {
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey.trim()}`;

          const parts = [];
          if (imageBase64) {
            const match = imageBase64.match(/^data:(image\/[a-zA-Z0-9\+\-\.]+);base64,(.+)$/);
            if (match) {
              parts.push({
                inlineData: {
                  mimeType: match[1],
                  data: match[2],
                },
              });
            }
          }
          parts.push({ text: promptText });

          const requestBody = {
            contents: [{ parts }],
            generationConfig: {
              temperature: 0.7,
              responseMimeType: 'application/json',
            },
          };

          if (systemInstructionText) {
            requestBody.systemInstruction = {
              parts: [{ text: systemInstructionText }],
            };
          }

          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestBody),
          });

          if (!res.ok) {
            const errorJson = await res.json().catch(() => ({}));
            const errMsg = errorJson.error?.message || `Lỗi HTTP ${res.status}`;
            throw new Error(errMsg);
          }

          const data = await res.json();
          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawText) {
            throw new Error(`[${model}] Phản hồi từ Gemini không có nội dung văn bản.`);
          }

          let cleaned = rawText.trim();
          if (cleaned.startsWith('```json')) {
            cleaned = cleaned.replace(/^```json\s*/i, '').replace(/\s*```$/, '');
          } else if (cleaned.startsWith('```')) {
            cleaned = cleaned.replace(/^```\s*/, '').replace(/\s*```$/, '');
          }

          return JSON.parse(cleaned);
        } catch (err) {
          lastError = err;
          console.warn(`Attempt with ${model} failed:`, err);
        }
      }

      const errStr = String(lastError?.message || lastError || '');
      if (errStr.includes('429') || errStr.includes('RESOURCE_EXHAUSTED') || errStr.includes('Quota exceeded') || errStr.includes('limit: 20')) {
        throw new Error('Lượt gọi AI miễn phí tạm thời quá tải (Quota limit 429). Vui lòng thử lại sau 30-60 giây hoặc nhấn biểu tượng 🔑 ở góc trên bên phải để nhập API Key Gemini cá nhân của bạn.');
      }

      throw lastError || new Error('Không thể kết nối đến Gemini API. Vui lòng thử lại.');
    }

    // Generate Random Idea
    async function generateRandomIdeaClient(genre) {
      const customApiKey = getStoredApiKey();
      const currentGenre = genre || "Lãng mạn, ngôn tình, ngọt ngào";
      try {
        const res = await fetch('/api/generate-random-idea', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ genre: currentGenre, customApiKey }),
        });
        if (res.ok) {
          const data = await res.json();
          if (data.idea) return data.idea;
        }
      } catch (err) {
        console.warn('Server endpoint /api/generate-random-idea failed, falling back to client call:', err);
      }

      const promptText = `Hãy đóng vai nhà sáng tạo nội dung, tự tạo 1 ý tưởng kịch bản video ngắn độc đáo thuộc thể loại ${currentGenre} dưới 50 từ. Ý tưởng mới mẻ, tự nhiên, không nhồi từ khóa.

### CẤU TRÚC JSON ĐẦU RA
{
  "idea": "Ý tưởng kịch bản video..."
}`;
      const result = await callGeminiJson(promptText);
      return result.idea || '';
    }

    // 1. Generate Script
    async function generateScriptClient(params) {
      const { idea, hasProduct, productImage, isRegenerate } = params;
      const promptText = `
### DỮ LIỆU ĐẦU VÀO
- Ý tưởng gốc: "${idea}"
- Sản phẩm đính kèm: ${hasProduct ? "Có sản phẩm xuất hiện trong video." : "Không có."} ${hasProduct && productImage ? "(Có ảnh sản phẩm)." : ""}
${isRegenerate ? "- YÊU CẦU LÀM MỚI: Viết cốt truyện & tuyến nhân vật MỚI HOÀN TOÀN so với kịch bản cũ, bám sát ý tưởng gốc." : ""}

### NHIỆM VỤ
1. Tiêu đề (title): Tên dự án hấp dẫn, ngắn gọn.
2. Nhân vật (characters): Khai báo danh sách nhân vật (id, name, age, role, appearance [mô tả chi tiết khuôn mặt, dáng người, kiểu tóc, trang phục], personality).
3. Kịch bản văn xuôi (scriptNarrative): Viết văn bản tường thuật dưới dạng câu chuyện ngắn truyền cảm, phân đoạn nhịp nhàng. BẮT BUỘC tuân thủ:
   - Tự động ngắt đoạn (thêm 2 lần xuống dòng \n\n) khi thay đổi diễn biến, hành động hoặc bối cảnh.
   - Mỗi lời thoại BẮT BUỘC nằm riêng trên một dòng, đặt trong dấu ngoặc kép "...", không viết liền vào đoạn văn chính.
   - Mỗi đoạn văn bản không quá 3-4 câu.
   - Trả về Plain Text thuần túy chứa ký tự \n\n, KHÔNG chèn thẻ HTML (<p>, <br>).
4. Cảnh phim (scenes): Phân chia kịch bản thành danh sách cảnh (sceneNumber, title, location, charactersPresent, summary, dialogueAndAction).

### CẤU TRÚC JSON ĐẦU RA
{
  "title": "Tên dự án",
  "characters": [
    {
      "id": "char_1",
      "name": "Tên nhân vật",
      "age": "25",
      "role": "Vai chính",
      "appearance": "Mô tả ngoại hình...",
      "personality": "Tính cách..."
    }
  ],
  "scriptNarrative": "Kịch bản văn xuôi liền mạch...",
  "scenes": [
    {
      "id": "scene_1",
      "sceneNumber": 1,
      "title": "Tiêu đề cảnh",
      "location": "Địa điểm",
      "charactersPresent": ["Tên nhân vật"],
      "summary": "Tóm tắt cảnh",
      "dialogueAndAction": "Lời thoại và hành động"
    }
  ]
}
`;
      const result = await callGeminiJson(promptText, productImage);
      if (result.characters) {
        result.characters = result.characters.map((c, index) => ({
          id: c.id || `char_${index + 1}`,
          name: c.name || `Nhân vật ${index + 1}`,
          age: c.age || "25 tuổi",
          role: c.role || "Chính",
          appearance: c.appearance || "",
        }));
      }
      if (result.scenes) {
        result.scenes = result.scenes.map((s, index) => ({
          id: s.id || `scene_${index + 1}`,
          sceneNumber: s.sceneNumber || index + 1,
          title: s.title || `Cảnh ${index + 1}`,
          location: s.location || "Địa điểm",
          charactersPresent: Array.isArray(s.charactersPresent) ? s.charactersPresent : [],
          summary: s.summary || "",
          dialogueAndAction: s.dialogueAndAction || "",
        }));
      }
      return result;
    }

    // 2. Refine Script
    async function refineScriptClient(params) {
      const { currentData, userRequest } = params;
      const promptText = `
Kịch bản hiện tại:
${JSON.stringify(currentData, null, 2)}

Yêu cầu chỉnh sửa:
"${userRequest}"

Nhiệm vụ: Cập nhật kịch bản theo yêu cầu người dùng, giữ nguyên định dạng JSON (title, characters, scriptNarrative, scenes).
- Kịch bản văn xuôi (scriptNarrative) BẮT BUỘC lưu dưới dạng Plain Text với khoảng ngắt đoạn \n\n rõ ràng (mỗi đoạn 3-4 câu), mỗi lời thoại nằm riêng trên một dòng trong ngoặc kép "...". KHÔNG chèn thẻ HTML.
`;
      const result = await callGeminiJson(promptText);
      if (result.characters) {
        result.characters = result.characters.map((c, index) => ({
          id: c.id || `char_${index + 1}`,
          name: c.name,
          age: c.age || "",
          role: c.role || "",
          appearance: c.appearance,
        }));
      }
      if (result.scenes) {
        result.scenes = result.scenes.map((s, index) => ({
          id: s.id || `scene_${index + 1}`,
          sceneNumber: s.sceneNumber || index + 1,
          title: s.title || `Cảnh ${index + 1}`,
          location: s.location || "",
          charactersPresent: Array.isArray(s.charactersPresent) ? s.charactersPresent : [],
          summary: s.summary || "",
          dialogueAndAction: s.dialogueAndAction || "",
        }));
      }
      return result;
    }

    // Helper to remove Vietnamese diacritics / tones
    function removeVietnameseTones(str) {
      if (!str) return '';
      return str
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd')
        .replace(/Đ/g, 'D');
    }

    function cleanPromptSpacing(str) {
      if (!str) return '';
      return str
        .replace(/\s+/g, ' ')
        .replace(/,\s*,/g, ',')
        .replace(/\.\s*\./g, '.')
        .replace(/,\s*\./g, '.')
        .replace(/\s+([,\.:])/g, '$1')
        .trim();
    }

    function cleanPromptRedundanciesEn(str) {
      if (!str) return '';
      return str
        .replace(/,?\s*no\s+props?/gi, '')
        .replace(/,?\s*no\s+watermarks?\s*(,?\s*no\s+logos?)?/gi, '')
        .replace(/,?\s*no\s+logos?/gi, '')
        .replace(/,?\s*no\s+text/gi, '');
    }

    function cleanPromptRedundanciesVi(str) {
      if (!str) return '';
      return str
        .replace(/,?\s*không\s+đạo\s+cụ/gi, '')
        .replace(/,?\s*không\s+watermark\s*(,?\s*không\s+logo)?/gi, '')
        .replace(/,?\s*không\s+logo/gi, '')
        .replace(/,?\s*không\s+chữ/gi, '');
    }

    function extractAppearanceOnlyEn(promptText, charObj) {
      if (!promptText) {
        return charObj?.appearance || charObj?.description || '';
      }

      let text = promptText;
      text = text.replace(/Style:.*$/i, '').replace(/--ar.*$/i, '');
      text = text.replace(/with a clear text label under (their )?feet displaying "[^"]*"/gi, '');
      text = text.replace(/with a clear text label under (their )?feet displaying [^\.,]*/gi, '');
      text = text.replace(/with a clear text label under (their )?feet/gi, '');
      text = text.replace(/with (a )?text label under (their )?feet/gi, '');
      text = text.replace(/text label under (their )?feet/gi, '');
      text = text.replace(/Each character has a clear text label under their feet displaying their name: [^\.]*\.?/gi, '');
      text = text.replace(/A-pose,?\s*full body character reference sheet,?\s*neutral relaxed expression/gi, '');
      text = text.replace(/A-pose,?\s*full body character reference sheet/gi, '');
      text = text.replace(/full body character reference sheet/gi, '');
      text = text.replace(/character reference sheet/gi, '');
      text = text.replace(/A-pose/gi, '');
      text = text.replace(/neutral relaxed expression/gi, '');
      text = text.replace(/neutral expression/gi, '');
      text = text.replace(/plain solid white studio background/gi, '');
      text = text.replace(/plain white studio background/gi, '');
      text = text.replace(/plain solid white background/gi, '');
      text = text.replace(/plain white background/gi, '');
      text = text.replace(/studio background/gi, '');
      text = text.replace(/white background/gi, '');
      text = cleanPromptRedundanciesEn(text);
      text = cleanPromptSpacing(text);
      text = text.replace(/^[\s,.\:-]+/, '').replace(/[\s,.\:-]+$/, '');

      if (!text && charObj) {
        text = charObj.appearance || charObj.description || '';
      }

      return text;
    }

    function extractAppearanceOnlyVi(promptTextVi, charObj) {
      if (!promptTextVi) {
        return charObj?.appearance || charObj?.description || '';
      }

      let text = promptTextVi;
      text = text.replace(/Phong cách:.*$/i, '').replace(/--ar.*$/i, '');
      text = text.replace(/dưới chân có in nhãn tên "[^"]*"/gi, '');
      text = text.replace(/dưới chân có in nhãn tên [^\.,]*/gi, '');
      text = text.replace(/dưới chân có in nhãn tên/gi, '');
      text = text.replace(/có in nhãn tên "[^"]*"/gi, '');
      text = text.replace(/có in nhãn tên [^\.,]*/gi, '');
      text = text.replace(/có in nhãn tên/gi, '');
      text = text.replace(/Dưới chân mỗi nhân vật có in nhãn tên rõ ràng: [^\.]*\.?/gi, '');
      text = text.replace(/dưới chân mỗi nhân vật có in nhãn tên rõ ràng: [^\.]*\.?/gi, '');
      text = text.replace(/có in nhãn tên rõ ràng: [^\.]*\.?/gi, '');
      text = text.replace(/có nhãn tên rõ ràng: [^\.]*\.?/gi, '');
      text = text.replace(/Tư thế A-pose,?\s*ảnh tham chiếu (nhân vật )?toàn thân,?\s*biểu cảm trung tính thư giãn/gi, '');
      text = text.replace(/Tư thế A-pose,?\s*ảnh tham chiếu (nhân vật )?toàn thân/gi, '');
      text = text.replace(/ảnh tham chiếu (nhân vật )?toàn thân/gi, '');
      text = text.replace(/Tư thế A-pose/gi, '');
      text = text.replace(/A-pose/gi, '');
      text = text.replace(/biểu cảm trung tính thư giãn/gi, '');
      text = text.replace(/biểu cảm trung tính/gi, '');
      text = text.replace(/phông nền trắng trơn studio/gi, '');
      text = text.replace(/phông nền trắng trơn/gi, '');
      text = text.replace(/phông nền trắng/gi, '');
      text = cleanPromptRedundanciesVi(text);
      text = cleanPromptSpacing(text);
      text = text.replace(/^[\s,.\:-]+/, '').replace(/[\s,.\:-]+$/, '');

      if (!text && charObj) {
        text = charObj.appearance || charObj.description || '';
      }

      return text;
    }

    function formatIndividualPrompt(ind, includeNameTags, idx = 0) {
      const rawName = ind.characterName || `Nhân vật ${idx + 1}`;
      const cleanName = removeVietnameseTones(rawName);

      let promptEn = ind.prompt || '';
      let promptVi = ind.promptVi || '';

      promptEn = cleanPromptRedundanciesEn(promptEn);
      promptVi = cleanPromptRedundanciesVi(promptVi);

      const tagTextEn = `with a clear text label under feet displaying "${cleanName}"`;
      const tagTextVi = `dưới chân có in nhãn tên "${cleanName}"`;

      if (includeNameTags) {
        if (/with a clear text label under feet displaying "[^"]*"/i.test(promptEn)) {
          promptEn = promptEn.replace(/with a clear text label under feet displaying "[^"]*"/gi, tagTextEn);
        } else if (/plain white background/i.test(promptEn)) {
          promptEn = promptEn.replace(/plain white background/i, `plain white background ${tagTextEn}`);
        } else if (/Style:/i.test(promptEn)) {
          promptEn = promptEn.replace(/Style:/i, `${tagTextEn}. Style:`);
        } else if (/--ar/i.test(promptEn)) {
          promptEn = promptEn.replace(/--ar/i, `${tagTextEn}, --ar`);
        } else {
          promptEn = `${promptEn.trim()} ${tagTextEn}.`;
        }

        if (/dưới chân có in nhãn tên "[^"]*"/i.test(promptVi)) {
          promptVi = promptVi.replace(/dưới chân có in nhãn tên "[^"]*"/gi, tagTextVi);
        } else if (/phông nền trắng trơn/i.test(promptVi)) {
          promptVi = promptVi.replace(/phông nền trắng trơn/i, `phông nền trắng trơn ${tagTextVi}`);
        } else if (/Phong cách:/i.test(promptVi)) {
          promptVi = promptVi.replace(/Phong cách:/i, `${tagTextVi}. Phong cách:`);
        } else if (/--ar/i.test(promptVi)) {
          promptVi = promptVi.replace(/--ar/i, `${tagTextVi}, --ar`);
        } else {
          promptVi = `${promptVi.trim()} ${tagTextVi}.`;
        }
      } else {
        promptEn = promptEn
          .replace(/with a clear text label under feet displaying "[^"]*"/gi, '')
          .replace(/with a clear text label under feet displaying [^\.,]*/gi, '')
          .replace(/with a clear text label under feet/gi, '');
        promptVi = promptVi
          .replace(/dưới chân có in nhãn tên "[^"]*"/gi, '')
          .replace(/dưới chân có in nhãn tên [^\.,]*/gi, '')
          .replace(/dưới chân có in nhãn tên/gi, '')
          .replace(/có in nhãn tên "[^"]*"/gi, '')
          .replace(/có in nhãn tên [^\.,]*/gi, '')
          .replace(/có in nhãn tên/gi, '');
      }

      promptEn = cleanPromptSpacing(promptEn);
      promptVi = cleanPromptSpacing(promptVi);

      return {
        ...ind,
        prompt: promptEn,
        promptVi: promptVi,
      };
    }

    function cleanMultilinePromptSpacing(str) {
      if (!str) return '';
      return str
        .split('\n')
        .map((line) =>
          line
            .replace(/[ \t]+/g, ' ')
            .replace(/,\s*,/g, ',')
            .replace(/\.\s*\./g, '.')
            .replace(/,\s*\./g, '.')
            .replace(/\s+([,\.:])/g, '$1')
            .trim()
        )
        .join('\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    // Synthesize Group Character Reference Prompt (GRP-REF) from Individual Character Prompts (IND-REF)
    function buildGroupCharacterPrompt(params) {
      const { characters, individualCharacterPrompts, style, includeNameTags = false } = params;

      if (!individualCharacterPrompts || individualCharacterPrompts.length === 0) {
        return { prompt: '', promptVi: '' };
      }

      const charCount = individualCharacterPrompts.length;

      const indListEn = individualCharacterPrompts
        .map((ind, idx) => {
          const charObj = (characters || []).find((c) => c.id === ind.characterId || c.name === ind.characterName);
          const rawName = ind.characterName || charObj?.name || `Character ${idx + 1}`;
          const appearanceEn = extractAppearanceOnlyEn(ind.prompt || '', charObj);

          return `${idx + 1}. ${rawName}: ${appearanceEn}`;
        })
        .join('\n\n');

      const namesListCleanEn = individualCharacterPrompts
        .map((ind) => `"${removeVietnameseTones(ind.characterName || '')}"`)
        .join(', ');

      const promptEn = `Group character reference sheet featuring all ${charCount} characters standing side by side in a single line:\n\n${indListEn}\n\nAll characters standing in A-pose full body shot from head to toe, facing camera, neutral relaxed expression, plain solid white studio background.${
        includeNameTags
          ? ` Each character has a clear text label under their feet displaying their name: ${namesListCleanEn}.`
          : ``
      }\n\nStyle: ${style}, --ar 16:9`;

      const indListVi = individualCharacterPrompts
        .map((ind, idx) => {
          const charObj = (characters || []).find((c) => c.id === ind.characterId || c.name === ind.characterName);
          const rawName = ind.characterName || charObj?.name || `Nhân vật ${idx + 1}`;
          const appearanceVi = extractAppearanceOnlyVi(ind.promptVi || '', charObj);

          return `${idx + 1}. ${rawName}: ${appearanceVi}`;
        })
        .join('\n\n');

      const namesListCleanVi = individualCharacterPrompts
        .map((ind) => `"${removeVietnameseTones(ind.characterName || '')}"`)
        .join(', ');

      const promptVi = `Ảnh tham chiếu gộp cho tất cả ${charCount} nhân vật đứng hàng ngang:\n\n${indListVi}\n\nTất cả nhân vật đứng ở tư thế A-pose toàn thân từ đầu đến chân, nhìn thẳng máy ảnh, biểu cảm trung tính thư giãn, phông nền trắng trơn studio.${
        includeNameTags
          ? ` Dưới chân mỗi nhân vật có in nhãn tên rõ ràng: ${namesListCleanVi}.`
          : ``
      }\n\nPhong cách: ${style}, --ar 16:9`;

      return {
        prompt: cleanMultilinePromptSpacing(promptEn),
        promptVi: cleanMultilinePromptSpacing(promptVi),
      };
    }

            textarea.style.left = '-9999px';
            textarea.style.top = '-9999px';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            document.execCommand('copy');

              {hasProduct && (
                <div className="pt-2 border-t border-slate-800">

                      </div>
                      <button type="button" onClick={() => setProductImage(null)} className="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white rounded-lg cursor-pointer">

                      <Icons.Upload className="w-8 h-8 text-indigo-400 mb-2" />
                      <span className="text-xs font-semibold text-slate-200 mb-1">Bấm để tải ảnh sản phẩm thực tế</span>

              >
                <div className="flex items-center gap-2">
                  <Icons.Lightbulb className="w-4 h-4 text-amber-400" />
                  <span>💡 Xem gợi ý mẫu</span>
                </div>
                <span className="text-indigo-400 text-[11px] font-semibold flex items-center gap-1">
                  {isSampleOpen ? 'Thu gọn ▴' : 'Bấm để chọn mẫu ▾'}
                </span>
              </button>

              {/* Desktop Header */}
              <div className="hidden md:flex items-center gap-2 mb-2.5 text-xs font-semibold text-slate-300">

                <span>Gợi ý mẫu bấm chọn nhanh:</span>
              </div>

              {/* Sample Cards Container */}
              <div className={`grid grid-cols-1 md:grid-cols-3 gap-3 ${isSampleOpen ? 'grid' : 'hidden md:grid'}`}>
                {SAMPLE_IDEAS.map((sample, idx) => (
                  <button

                    type="button"
                    onClick={() => handleApplySample(sample)}

                  >
                    <div className="font-semibold text-slate-200 group-hover:text-indigo-400 mb-1.5 flex flex-col items-start gap-1 sm:flex-row sm:items-center sm:justify-between w-full">
                      <span className="font-bold text-slate-100 text-xs sm:text-sm leading-snug break-words">{sample.title}</span>

            {errorMsg && (

            <div className="pt-2">
              <button
                type="submit"
                disabled={isLoading}

              >
                {isLoading ? (
                  <>
                    <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin" />

    };

    // --- COMPONENT: STEP 1 SCRIPT ---
    const Step1Script = ({ projectData, onUpdateProjectData, onRefineWithAi, onRegenerateFullScript, onNextStep, isLoading }) => {
      const [editingTitle, setEditingTitle] = useState(false);
      const [titleInput, setTitleInput] = useState(projectData.title);
      const [refineInput, setRefineInput] = useState('');
      const [editingCharId, setEditingCharId] = useState(null);
      const [editingNarrative, setEditingNarrative] = useState(false);
      const [narrativeInput, setNarrativeInput] = useState(projectData.scriptNarrative);
      const [showRegenerateModal, setShowRegenerateModal] = useState(false);
      const refineInputRef = useRef(null);

      const handleSaveTitle = () => {
        if (titleInput.trim()) onUpdateProjectData({ ...projectData, title: titleInput.trim() });
        setEditingTitle(false);
      };

      const handleConfirmRegenerate = async () => {
        setShowRegenerateModal(false);
        await onRegenerateFullScript();
      };

      const handleUpdateChar = (id, field, value) => {
        const updatedChars = projectData.characters.map((c) => c.id === id ? { ...c, [field]: value } : c);
        onUpdateProjectData({ ...projectData, characters: updatedChars });
      };

      const handleAddChar = () => {
        const newChar = {
          id: `char_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`,
          name: 'Nhân vật mới',
          age: '25 tuổi',
          role: 'Phụ',
          appearance: 'Gương mặt thanh tú, tóc đen tự nhiên, phong cách năng động.',
        };
        onUpdateProjectData({ ...projectData, characters: [...projectData.characters, newChar] });
        setEditingCharId(newChar.id);
      };

      const handleDeleteChar = (id) => {
        const updatedChars = projectData.characters.filter((c) => c.id !== id);
        onUpdateProjectData({ ...projectData, characters: updatedChars });
      };

      const handleSaveNarrative = () => {
        onUpdateProjectData({ ...projectData, scriptNarrative: narrativeInput });
        setEditingNarrative(false);
      };

      const handleRefineSubmit = async (e) => {
        e.preventDefault();
        if (!refineInput.trim()) return;
        await onRefineWithAi(refineInput.trim());
        setRefineInput('');
      };

      return (
        <div className="max-w-5xl mx-auto py-6 px-4 sm:px-6 pb-28">
          {/* Block 1: Unified Title & AI Suggestion Card */}
          <div className="mb-4 sm:mb-6 bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-5 shadow-lg space-y-3">
            {/* Title & Action Buttons Row */}
            <div className="flex flex-row items-center justify-between gap-3">
              <div className="flex-1 min-w-0">
                {editingTitle ? (
                  <div className="flex items-center gap-2">
                    <input
                      type="text"
                      value={titleInput}
                      onChange={(e) => setTitleInput(e.target.value)}
                      className="flex-1 px-3 py-1.5 bg-slate-900/50 border border-indigo-500 rounded-xl text-base sm:text-lg font-bold text-white focus:outline-none"
                      autoFocus
                    />
                    <button onClick={handleSaveTitle} className="px-3 py-1.5 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl font-semibold text-xs shrink-0 cursor-pointer">
                      Lưu
                    </button>
                    <button onClick={() => setEditingTitle(false)} className="px-2.5 py-1.5 bg-slate-700 text-slate-300 hover:text-white rounded-xl text-xs shrink-0 cursor-pointer">
                      Hủy
                    </button>
                  </div>
                ) : (
                  <div className="flex items-center flex-wrap gap-x-2 gap-y-1">
                    <span className="text-[10px] font-bold uppercase tracking-widest text-indigo-400 shrink-0">
                      Khối 1 — Tên dự án:
                    </span>
                    <h2 className="text-base sm:text-2xl font-extrabold text-white tracking-tight truncate min-w-0">
                      {projectData.title}
                    </h2>
                  </div>
                )}
              </div>

              {/* Action Buttons */}
              {!editingTitle && (
                <div className="flex items-center gap-2 shrink-0">
                  <button
                    onClick={() => {
                      setTitleInput(projectData.title);
                      setEditingTitle(true);
                    }}
                    title="Đổi tên dự án"
                    className="px-2 sm:px-3 py-1.5 rounded-xl bg-slate-700/50 hover:bg-slate-600 text-slate-200 text-xs font-semibold border border-slate-600/50 flex items-center justify-center gap-1.5 transition-colors cursor-pointer shrink-0"
                  >
                    <Icons.Pencil className="w-3.5 h-3.5 shrink-0" />
                    <span className="hidden sm:inline">Đổi tên</span>
                  </button>

                  <button
                    onClick={() => setShowRegenerateModal(true)}
                    disabled={isLoading}
                    title="Viết lại kịch bản"
                    className="px-2 sm:px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-xl shadow-md flex items-center justify-center gap-1.5 transition-all disabled:opacity-50 shrink-0 cursor-pointer"
                  >
                    <Icons.RotateCcw className={`w-3.5 h-3.5 shrink-0 ${isLoading ? 'animate-spin' : ''}`} />
                    <span className="hidden sm:inline">Viết lại kịch bản</span>
                  </button>
                </div>
              )}
            </div>

            {/* AI Prompt Sub-text */}
            <div className="flex items-center gap-2 text-xs text-slate-400 bg-slate-900/40 p-2.5 rounded-xl border border-slate-700/40">
              <Icons.RotateCcw className="w-3.5 h-3.5 text-indigo-400 shrink-0" />
              <p className="min-w-0 flex-1 leading-snug">
                <span className="font-semibold text-slate-200">Chưa ưng ý với kịch bản này?</span>{' '}
                <span className="text-slate-400">Sinh phiên bản kịch bản & nhân vật hoàn toàn mới từ ý tưởng ban đầu.</span>
              </p>
            </div>
          </div>

          {showRegenerateModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center shrink-0">
                    <Icons.RotateCcw className="w-5 h-5" />
                  </div>
                  <h3 className="font-bold text-slate-100 text-base">Xác nhận viết lại toàn bộ kịch bản</h3>
                </div>
                <p className="text-sm text-slate-300 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700">
                  Toàn bộ nhân vật và kịch bản hiện tại sẽ bị thay thế, bạn có chắc chắn?
                </p>
                <div className="flex justify-end gap-3">
                  <button onClick={() => setShowRegenerateModal(false)} className="px-4 py-2 bg-slate-700 text-slate-300 rounded-xl text-xs font-medium">
                    Hủy
                  </button>
                  <button onClick={handleConfirmRegenerate} disabled={isLoading} className="px-5 py-2 bg-indigo-600 text-white font-bold rounded-xl text-xs shadow-lg">
                    Đồng ý viết lại
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Characters Block */}
          <div className="mb-4 sm:mb-6 bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-5 shadow-lg">
            <div className="flex items-center justify-between gap-3 mb-4">
              <div>
                <span className="text-[10px] font-bold uppercase tracking-widest text-indigo-400 block">Khối 2 — Danh sách nhân vật</span>
                <p className="text-xs text-slate-400">Mô tả ngoại hình này sẽ làm gốc cho prompt ảnh nhân vật ở Bước 2.</p>
              </div>
              <button onClick={handleAddChar} title="Thêm nhân vật" className="px-2.5 sm:px-3 py-1.5 rounded-xl bg-slate-700/50 hover:bg-slate-600 text-slate-200 text-xs font-semibold border border-slate-600/50 flex items-center justify-center gap-1.5 transition-colors shrink-0 cursor-pointer">
                <Icons.Plus className="w-3.5 h-3.5 shrink-0" />
                <span className="hidden sm:inline">Thêm nhân vật</span>
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {projectData.characters.map((char) => {
                const isEditingThis = editingCharId === char.id;
                return (
                  <div key={char.id} className="bg-slate-900/50 border border-slate-700 rounded-xl p-4 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between gap-2 mb-2">
                        <div className="flex items-center gap-2">
                          <div className="w-8 h-8 rounded-full bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center font-bold text-sm shrink-0">
                            <Icons.User className="w-4 h-4" />
                          </div>
                          <div>
                            <h4 className="font-bold text-slate-100 text-sm">{char.name}</h4>
                            <div className="flex items-center gap-2 text-[11px] text-slate-400">
                              <span>{char.age}</span>
                              <span>•</span>
                              <span className="text-amber-400">{char.role}</span>
                            </div>
                          </div>
                        </div>

                        <div className="flex items-center gap-1">
                          <button onClick={() => setEditingCharId(isEditingThis ? null : char.id)} className="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800">
                            <Icons.Pencil className="w-3.5 h-3.5" />
                          </button>
                          {projectData.characters.length > 1 && (
                            <button onClick={() => handleDeleteChar(char.id)} className="p-1.5 text-slate-400 hover:text-rose-400 rounded-lg hover:bg-slate-800">
                              <Icons.Trash2 className="w-3.5 h-3.5" />
                            </button>
                          )}
                        </div>
                      </div>

                      {isEditingThis ? (
                        <div className="space-y-2 mt-3 pt-3 border-t border-slate-800 text-xs">
                          <div>
                            <label className="text-slate-400 block mb-1">Tên nhân vật:</label>
                            <input type="text" value={char.name} onChange={(e) => handleUpdateChar(char.id, 'name', e.target.value)} className="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white" />
                          </div>
                          <div className="grid grid-cols-2 gap-2">
                            <div>
                              <label className="text-slate-400 block mb-1">Tuổi:</label>
                              <input type="text" value={char.age} onChange={(e) => handleUpdateChar(char.id, 'age', e.target.value)} className="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white" />
                            </div>
                            <div>
                              <label className="text-slate-400 block mb-1">Vai trò:</label>
                              <input type="text" value={char.role} onChange={(e) => handleUpdateChar(char.id, 'role', e.target.value)} className="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white" />
                            </div>
                          </div>
                          <div>
                            <label className="text-slate-400 block mb-1">Mô tả ngoại hình:</label>
                            <textarea rows={3} value={char.appearance} onChange={(e) => handleUpdateChar(char.id, 'appearance', e.target.value)} className="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white" />
                          </div>
                          <button onClick={() => setEditingCharId(null)} className="w-full py-1.5 bg-indigo-600 text-white rounded-lg font-semibold text-xs">Xong</button>
                        </div>
                      ) : (
                        <div className="p-2.5 bg-slate-900/60 rounded-lg border border-slate-800 text-xs text-slate-300 leading-relaxed mt-2">
                          <span className="font-semibold text-slate-400 block mb-0.5">Ngoại hình:</span>
                          {char.appearance}
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Detailed Script Narrative Block */}
          <div className="mb-4 sm:mb-6 bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-5 shadow-lg">
            <div className="flex items-center justify-between gap-3 mb-3">
              <div>
                <span className="text-[10px] font-bold uppercase tracking-widest text-indigo-400 block">Khối 3 — Kịch bản chi tiết (Văn xuôi)</span>
                <p className="text-xs text-slate-400">Kịch bản trình bày dạng truyện ngắn, phân đoạn nhịp nhàng với lời thoại nằm riêng từng dòng.</p>
              </div>
              {!editingNarrative && (
                <button onClick={() => { setNarrativeInput(projectData.scriptNarrative); setEditingNarrative(true); }} title="Chỉnh sửa văn bản" className="px-2.5 sm:px-3 py-1.5 text-xs font-semibold text-slate-200 bg-slate-700/50 hover:bg-slate-600 rounded-xl border border-slate-600/50 flex items-center justify-center gap-1.5 transition-colors shrink-0 cursor-pointer">
                  <Icons.Pencil className="w-3.5 h-3.5 shrink-0" />
                  <span className="hidden sm:inline">Chỉnh sửa</span>
                </button>
              )}
            </div>

            {editingNarrative ? (
              <div className="space-y-3">
                <textarea rows={12} value={narrativeInput} onChange={(e) => setNarrativeInput(e.target.value)} className="w-full p-4 bg-slate-900 border border-indigo-500 rounded-xl text-slate-100 text-sm sm:text-base leading-relaxed sm:leading-7 focus:outline-none whitespace-pre-wrap font-sans" />
                <div className="flex items-center justify-end gap-2">
                  <button onClick={() => setEditingNarrative(false)} className="px-4 py-2 bg-slate-700 text-slate-300 rounded-xl text-xs font-medium cursor-pointer">Hủy</button>
                  <button onClick={handleSaveNarrative} className="px-5 py-2 bg-indigo-500 text-white rounded-xl font-semibold text-xs cursor-pointer shadow-md">Lưu kịch bản</button>
                </div>
              </div>
            ) : (
              <div className="p-4 sm:p-6 bg-slate-900/50 border border-slate-700/70 rounded-xl text-slate-200 text-sm sm:text-base leading-relaxed sm:leading-7 whitespace-pre-wrap font-sans">
                {projectData.scriptNarrative}

          </div>

          {/* AI Refinement */}
          <div className="mb-6 bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-5 shadow-lg">
            <label className="block text-[10px] font-bold uppercase tracking-widest text-amber-400 mb-1.5">
              Muốn sửa gì không? (Gửi yêu cầu cho Gemini AI)
            </label>
            <p className="text-xs text-slate-400 mb-3">
              Nhập yêu cầu (ví dụ: "Đổi tên nhân vật nam thành Tuấn", "Thêm 1 cảnh ở quán cà phê", "Cho kịch bản hài hước hơn").
            </p>
            <form onSubmit={handleRefineSubmit} className="flex gap-2">
              <input
                ref={refineInputRef}
                type="text"
                value={refineInput}
                onChange={(e) => setRefineInput(e.target.value)}
                placeholder="Nhập yêu cầu sửa kịch bản..."
                disabled={isLoading}
                className="flex-1 px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-amber-400"
              />
              <button
                type="submit"
                disabled={isLoading || !refineInput.trim()}
                title="Gửi yêu cầu sửa"
                className="px-3 sm:px-5 py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl flex items-center justify-center gap-1.5 transition-all disabled:opacity-50 shrink-0 cursor-pointer"
              >
                {isLoading ? <div className="w-4 h-4 border-2 border-slate-950/30 border-t-slate-950 rounded-full animate-spin shrink-0" /> : <Icons.Send className="w-4 h-4 shrink-0" />}

          {/* Bottom Nav Bar */}
          <BottomBar
            onLeftClick={() => { refineInputRef.current?.focus(); refineInputRef.current?.scrollIntoView({ behavior: 'smooth' }); }}
            onRightClick={onNextStep}
            isRightDisabled={isLoading}
          />
        </div>
      );
    };

    // --- COMPONENT: STEP 2 REFERENCE PROMPTS ---
    const Step2ReferencePrompts = ({ projectData, onUpdateProjectData, onGenerateReferencePrompts, onNextStep, onGoToStep1, isScriptModifiedAfterGenerate, isLoading }) => {
      const [showStyleModal, setShowStyleModal] = useState(false);
      const [showRatioModal, setShowRatioModal] = useState(false);
      const [includeNameTags, setIncludeNameTags] = useState(projectData.includeNameTags ?? false);
      const [isGroupPromptOutdated, setIsGroupPromptOutdated] = useState(false);

      const [editingCharKey, setEditingCharKey] = useState(null);
      const [editPromptEn, setEditPromptEn] = useState('');
      const [editPromptVi, setEditPromptVi] = useState('');

      const isIndividualComplete =
        projectData.individualCharacterPrompts &&
        projectData.individualCharacterPrompts.length > 0 &&
        projectData.individualCharacterPrompts.length === (projectData.characters || []).length &&
        projectData.individualCharacterPrompts.every((item) => item.prompt && item.prompt.trim().length > 0);

      useEffect(() => {
        if (projectData.includeNameTags !== undefined && projectData.includeNameTags !== includeNameTags) {
          setIncludeNameTags(projectData.includeNameTags);
        }
      }, [projectData.includeNameTags]);

      useEffect(() => {
        if (
          isIndividualComplete &&
          projectData.characterReferencePromptVi &&
          !projectData.characterReferencePromptVi.includes('\n')
        ) {
          const rebuilt = buildGroupCharacterPrompt({
            characters: projectData.characters,
            individualCharacterPrompts: projectData.individualCharacterPrompts,
            style: projectData.style,
            includeNameTags,
          });
          if (rebuilt.promptVi && rebuilt.promptVi !== projectData.characterReferencePromptVi) {
            onUpdateProjectData({
              ...projectData,
              characterReferencePrompt: rebuilt.prompt,
              characterReferencePromptVi: rebuilt.promptVi,
            });
          }
        }
      }, [isIndividualComplete, projectData.characterReferencePromptVi, projectData.characters, projectData.individualCharacterPrompts, projectData.style, includeNameTags]);

      const handleSelectStyle = async (newStyle) => {
        setShowStyleModal(false);
        onUpdateProjectData({ ...projectData, style: newStyle });
        await onGenerateReferencePrompts(newStyle, projectData.aspectRatio);
      };

      const handleSelectRatio = async (newRatio) => {
        setShowRatioModal(false);
        onUpdateProjectData({ ...projectData, aspectRatio: newRatio });
        await onGenerateReferencePrompts(projectData.style, newRatio);
      };

      const handleSetGlobalLang = (newLang) => {
        onUpdateProjectData({
          ...projectData,
          globalLang: newLang,
        });
      };

      const reformatGroupPrompt = (currentIndPrompts, nameTagsState) => {
        return buildGroupCharacterPrompt({
          characters: projectData.characters,
          individualCharacterPrompts: currentIndPrompts,
          style: projectData.style,
          includeNameTags: nameTagsState,
        });
      };

      const handleToggleNameTags = () => {
        const nextVal = !includeNameTags;
        setIncludeNameTags(nextVal);

        const updatedIndividual = (projectData.individualCharacterPrompts || []).map((ind, idx) =>
          formatIndividualPrompt(ind, nextVal, idx)
        );

        const rebuilt = reformatGroupPrompt(updatedIndividual, nextVal);

        onUpdateProjectData({
          ...projectData,
          includeNameTags: nextVal,
          individualCharacterPrompts: updatedIndividual,
          characterReferencePrompt: rebuilt.prompt,
          characterReferencePromptVi: rebuilt.promptVi,
        });
        setIsGroupPromptOutdated(false);
      };

      const handleRebuildGroupPrompt = () => {
        if (!isIndividualComplete) return;

        const rebuilt = reformatGroupPrompt(projectData.individualCharacterPrompts || [], includeNameTags);

        onUpdateProjectData({
          ...projectData,
          includeNameTags,
          characterReferencePrompt: rebuilt.prompt,
          characterReferencePromptVi: rebuilt.promptVi,
        });
        setIsGroupPromptOutdated(false);
      };

      const handleStartEditIndividual = (item, key) => {
        setEditingCharKey(key);
        setEditPromptEn(item.prompt || '');
        setEditPromptVi(item.promptVi || '');
      };

      const handleSaveIndividualEdit = (key) => {
        const updatedList = (projectData.individualCharacterPrompts || []).map((item, idx) => {
          const itemKey = item.characterId || item.characterName || `char_${idx}`;
          if (itemKey === key) {
            return {
              ...item,
              prompt: editPromptEn,
              promptVi: editPromptVi,
            };
          }
          return item;
        });

        onUpdateProjectData({
          ...projectData,
          individualCharacterPrompts: updatedList,
        });

        setIsGroupPromptOutdated(true);
        setEditingCharKey(null);
      };

      return (
        <div className="max-w-5xl mx-auto py-6 px-4 sm:px-6 pb-28 space-y-6">
          {isScriptModifiedAfterGenerate && (
            <div className="p-4 bg-amber-500/10 border border-amber-500/30 rounded-2xl text-amber-300 text-xs flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-lg">

              </div>
              <button onClick={() => onGenerateReferencePrompts(projectData.style, projectData.aspectRatio)} disabled={isLoading} className="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl text-xs shrink-0 disabled:opacity-50">
                {isLoading ? 'Đang tạo lại...' : 'Tạo lại theo kịch bản mới'}
              </button>
            </div>

          <div className="bg-slate-800 border border-slate-700 rounded-2xl p-3 sm:p-4 shadow-lg flex flex-row items-center divide-x divide-slate-700/80">
            <div className="flex-1 flex items-center gap-2 sm:gap-3 px-1 sm:px-2 min-w-0">
              <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center shrink-0">

              <div className="min-w-0 flex-1">

                <span className="text-xs sm:text-sm font-bold text-slate-100 truncate block">{projectData.aspectRatio || "9:16"}</span>

                Đổi

            </div>

            <div className="flex-1 flex items-center gap-2 sm:gap-3 px-1 sm:px-2 pl-2.5 sm:pl-4 min-w-0">
              <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center shrink-0">
                <Icons.Palette className="w-4 h-4 sm:w-5 sm:h-5" />
              </div>
              <div className="min-w-0 flex-1">
                <span className="text-[9px] sm:text-[10px] text-slate-400 block font-bold uppercase tracking-wider truncate">PHONG CÁCH</span>
                <span className="text-xs sm:text-sm font-bold text-slate-100 truncate block">{projectData.style || "Hiện thực"}</span>

              <button onClick={() => setShowStyleModal(true)} className="ml-auto px-2 sm:px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 text-[10px] sm:text-xs font-semibold border border-slate-600 transition-colors cursor-pointer shrink-0">
                Đổi
              </button>
            </div>
          </div>

          {/* SECTION 1: ENVIRONMENT PROMPTS (FIRST) */}

            <div className="flex items-center gap-2 border-b border-slate-700/80 pb-3">
              <Icons.MapPin className="w-5 h-5 text-emerald-400" />
              <div>
                <h3 className="font-bold text-slate-100 text-base">Prompt ảnh môi trường (Environment Reference Prompts)</h3>

                    <PromptCard
                      title={`Địa điểm: ${envItem.location}`}
                      promptText={envItem.prompt}
                      displayText={envItem.promptVi}

                    />
                  </div>

              <div className="p-4 text-center text-slate-400 text-xs bg-slate-900/50 rounded-xl border border-slate-700">
                Đang khởi tạo prompt môi trường...

          {/* SECTION 2: INDIVIDUAL CHARACTER PROMPTS (SECOND) */}

                <span className="text-xs font-semibold text-slate-200">Gắn nhãn tên dưới chân:</span>
                <button
                  type="button"
                  onClick={handleToggleNameTags}
                  className={`relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
                    includeNameTags ? 'bg-indigo-600' : 'bg-slate-700'
                  }`}
                >
                  <span
                    className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${
                      includeNameTags ? 'translate-x-5' : 'translate-x-0'

                  />
                </button>
                <span className="text-[11px] font-bold text-indigo-300 w-8">{includeNameTags ? 'BẬT' : 'TẮT'}</span>
              </div>
            </div>

            {projectData.individualCharacterPrompts && projectData.individualCharacterPrompts.length > 0 ? (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {projectData.individualCharacterPrompts.map((indivItem, idx) => {
                  const charKey = indivItem.characterId || indivItem.characterName || `char_${idx}`;
                  const isEditing = editingCharKey === charKey;

                  return (
                    <div key={charKey} className="bg-slate-900/50 border border-slate-700/80 rounded-xl p-4 flex flex-col justify-between h-full">
                      {isEditing ? (
                        <div className="space-y-3 bg-slate-950 p-4 rounded-xl border border-indigo-500/50">
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-bold text-indigo-300">Chỉnh sửa prompt: {indivItem.characterName}</span>
                            <div className="flex gap-2">
                              <button
                                onClick={() => setEditingCharKey(null)}
                                className="px-2.5 py-1 bg-slate-800 text-slate-300 hover:bg-slate-700 rounded-lg text-xs"
                              >
                                Hủy
                              </button>
                              <button
                                onClick={() => handleSaveIndividualEdit(charKey)}
                                className="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg text-xs flex items-center gap-1"
                              >
                                <Icons.Check className="w-3.5 h-3.5" />
                                <span>Lưu thay đổi</span>
                              </button>
                            </div>
                          </div>
                          <div>
                            <label className="text-[10px] text-slate-400 uppercase font-bold block mb-1">Prompt tiếng Anh (EN):</label>
                            <textarea
                              value={editPromptEn}
                              onChange={(e) => setEditPromptEn(e.target.value)}
                              rows={3}
                              className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"
                            />
                          </div>
                          <div>
                            <label className="text-[10px] text-slate-400 uppercase font-bold block mb-1">Bản dịch tiếng Việt (VI):</label>
                            <textarea
                              value={editPromptVi}
                              onChange={(e) => setEditPromptVi(e.target.value)}
                              rows={2}
                              className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"
                            />
                          </div>
                        </div>
                      ) : (
                        <PromptCard
                          title={`Nhân vật: ${indivItem.characterName}`}
                          promptText={indivItem.prompt}
                          displayText={indivItem.promptVi}
                          lang={projectData.globalLang || 'vi'}
                          className="h-full"
                        />
                      )}
                    </div>
                  );
                })}
              </div>
            ) : (
              <div className="p-4 text-center text-slate-400 text-xs bg-slate-900/50 rounded-xl border border-slate-700">
                Prompt ảnh riêng cho từng nhân vật sẽ tự động xuất hiện tại đây sau khi sinh prompt tham chiếu.
              </div>
            )}
          </div>

          {/* SECTION 3: ALL CHARACTERS GROUP REFERENCE PROMPT (THIRD / BOTTOM) */}
          <div className="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg space-y-4">
            <div className="flex items-center gap-2 border-b border-slate-700/80 pb-3">
              <Icons.Users className="w-5 h-5 text-purple-400" />
              <div>
                <h3 className="font-bold text-slate-100 text-base">Tất cả nhân vật (Ảnh gộp tham chiếu - Group Reference)</h3>
                <p className="text-xs text-slate-400">Tổng hợp từ prompt riêng của tất cả nhân vật. Khung ngang dàn hàng ngang nguyên mẫu.</p>
              </div>
            </div>

            {/* Outdated Warning Banner */}
            {isGroupPromptOutdated && (
              <div className="p-3.5 bg-amber-500/10 border border-amber-500/30 rounded-xl text-amber-300 text-xs flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2.5 shadow-md">
                <div className="flex items-center gap-2">
                  <Icons.AlertCircle className="w-4 h-4 text-amber-400 shrink-0" />
                  <span>Dữ liệu nhân vật đã thay đổi, nên tạo lại ảnh gộp.</span>
                </div>
                <button
                  onClick={handleRebuildGroupPrompt}
                  disabled={!isIndividualComplete}
                  className="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg text-xs shrink-0 transition-all shadow-sm disabled:opacity-50 cursor-pointer flex items-center gap-1.5"
                >
                  <Icons.RefreshCw className="w-3.5 h-3.5" />
                  <span>Tạo lại ảnh gộp</span>
                </button>
              </div>
            )}

            <PromptCard
              title="Tất cả nhân vật (Ảnh gộp tham chiếu)"
              promptText={projectData.characterReferencePrompt || "Đang khởi tạo prompt nhân vật..."}
              displayText={projectData.characterReferencePromptVi}
              lang={projectData.globalLang || 'vi'}
            />

            {/* Muted Note & Rebuild Button */}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-slate-400 text-xs italic bg-slate-900/40 p-3 rounded-xl border border-slate-700/50">
              <span>* Ảnh nhóm nhiều người luôn dùng 16:9, không theo tỉ lệ đã chọn ở trên.</span>

              {!isIndividualComplete ? (
                <span className="text-amber-400/90 font-medium not-italic text-[11px] bg-amber-500/10 px-2.5 py-1 rounded-lg border border-amber-500/20">
                  ⚠️ Cần đủ prompt riêng từng nhân vật trước khi gộp
                </span>
              ) : (
                <button
                  onClick={handleRebuildGroupPrompt}
                  className="px-3 py-1.5 bg-indigo-600/80 hover:bg-indigo-600 text-white font-semibold rounded-lg text-xs not-italic transition-all flex items-center gap-1.5 cursor-pointer self-start sm:self-auto"
                >
                  <Icons.RefreshCw className="w-3.5 h-3.5" />
                  <span>Cập nhật / Tạo lại ảnh gộp</span>
                </button>
              )}
            </div>
          </div>

          {/* Style Modal */}
          {showStyleModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-5 shadow-2xl space-y-4">
                <h3 className="font-bold text-slate-100 text-base">Chọn phong cách hình ảnh</h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-80 overflow-y-auto p-1">
                  {VISUAL_STYLES.map((styleOpt) => (
                    <button
                      key={styleOpt.id}
                      onClick={() => handleSelectStyle(styleOpt.id)}
                      className={`text-left p-3 rounded-xl border text-xs transition-all ${
                        projectData.style === styleOpt.id
                          ? 'bg-indigo-500/20 border-indigo-500 text-indigo-300 font-bold'
                          : 'bg-slate-900/50 border-slate-700 text-slate-300 hover:bg-slate-700'

                    >
                      <div className="font-semibold mb-0.5">{styleOpt.name}</div>
                      <div className="text-[10px] text-slate-400 line-clamp-1">{styleOpt.promptTag}</div>
                    </button>

                  <button onClick={() => setShowStyleModal(false)} className="px-4 py-2 bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold">Hủy</button>

                        projectData.aspectRatio === ratioOpt.value
                          ? 'bg-indigo-500/20 border-indigo-500 text-indigo-300 font-bold'

    const ADVANCED_CONFIG_STORAGE_KEY = 'video_script_studio_adv_prompt_config_v3';

    const PLACEHOLDER_CONFIG_A = `💡 Hướng dẫn cấu hình Prompt Ảnh:

(Dòng không có ký tự <, >, # ở đầu sẽ bị BỎ QUA)`;

    const PLACEHOLDER_CONFIG_B = `💡 Hướng dẫn cấu hình Prompt Video:
< Chèn vào ĐẦU câu (Ví dụ: < Dùng video tham chiếu [MOTION-01],)
> Chèn vào CUỐI câu (Ví dụ: > góc quay zoom chậm vào mặt)
# Tạm ẩn dòng này (Ví dụ: # > tốc độ 60fps)
(Dòng không có ký tự <, >, # ở đầu sẽ bị BỎ QUA)`;

    const DEFAULT_ADV_CONFIG = {
      isActiveA: false,
      configTextA: '',
      isActiveB: false,
      configTextB: '',
    };

    const loadAdvancedPromptConfig = () => {
      try {
        const saved = localStorage.getItem(ADVANCED_CONFIG_STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && typeof parsed === 'object') {
            return {
              isActiveA: typeof parsed.isActiveA === 'boolean' ? parsed.isActiveA : false,
              configTextA: typeof parsed.configTextA === 'string' ? parsed.configTextA : '',
              isActiveB: typeof parsed.isActiveB === 'boolean' ? parsed.isActiveB : false,
              configTextB: typeof parsed.configTextB === 'string' ? parsed.configTextB : '',
            };
          }
        }
      } catch (e) {
        console.warn('Failed to load advanced prompt config from localStorage:', e);
      }
      return DEFAULT_ADV_CONFIG;
    };

    function processAdvancedPrompt(original, configText, isActive) {
      if (!original) return '';
      if (!isActive || !configText) return original;

      let cleaned = original;
      const hardcodedNegatives = [
        /,\s*no text,\s*no watermark,\s*no logo/gi,
        /,\s*no text,\s*no logo,\s*no watermark/gi,
        /,\s*no text/gi,
        /,\s*no watermark/gi,
        /,\s*no logo/gi,
      ];

      hardcodedNegatives.forEach((pattern) => {
        cleaned = cleaned.replace(pattern, '');
      });
      cleaned = cleaned.trim();

      const lines = configText.split('\n');
      const prefixes = [];
      const suffixes = [];

      lines.forEach((line) => {
        const trimmed = line.trim();
        if (!trimmed || /^(\/\/|#)/.test(trimmed)) return; // Ignore empty / comments / hidden lines

        if (trimmed.startsWith('<')) {
          const content = trimmed.substring(1).trim();
          if (content) {
            prefixes.push(content);
          }
        } else if (trimmed.startsWith('>')) {
          const content = trimmed.substring(1).trim();
          if (content) {
            suffixes.push(content);
          }
        }
        // Lines not starting with '<', '>', '#' are skipped (ignored)
      });

      const final = [prefixes.join(' '), cleaned, suffixes.join(' ')]
        .filter(Boolean)
        .join(' ');

      return final.trim();
    }

    const formatPromptWithPrefixSuffix = (rawPrompt, prefix = '', suffix = '') => {
      if (!rawPrompt) return '';
      const lines = [];
      if (prefix) lines.push(`< ${prefix.trim()}`);
      if (suffix) lines.push(`> ${suffix.trim()}`);
      return processAdvancedPrompt(rawPrompt, lines.join('\n'), true);
    };

    const AdvancedPromptConfig = ({ config, onChange }) => {
      const [isOpen, setIsOpen] = useState(false);

      useEffect(() => {
        try {
          localStorage.setItem(ADVANCED_CONFIG_STORAGE_KEY, JSON.stringify(config));
        } catch (e) {
          console.warn('Failed to save advanced prompt config:', e);
        }
      }, [config]);

      return (
        <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl overflow-hidden shadow-xl transition-all">

          <div
            onClick={() => setIsOpen(!isOpen)}
            className="p-3.5 sm:p-5 flex items-center justify-between cursor-pointer hover:bg-slate-700/40 transition-colors select-none"
          >
            <div className="flex items-center gap-2.5 sm:gap-3 min-w-0">
              <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center shrink-0">
                <Icons.Sliders className="w-4 h-4 sm:w-5 sm:h-5" />
              </div>
              <div className="min-w-0">
                <h3 className="text-sm sm:text-base font-bold text-white truncate">
                  Cấu hình Prompt Nâng cao
                </h3>
                <p className="text-[11px] sm:text-xs text-slate-400 truncate">
                  Tự động chèn Tiền tố & Hậu tố/Điều cấm vào mọi cảnh ở Tab 3
                </p>
              </div>
            </div>

            <div className="text-slate-400 p-1 shrink-0 ml-auto">
              {isOpen ? <Icons.ChevronUp className="w-4 h-4 sm:w-5 sm:h-5" /> : <Icons.ChevronDown className="w-4 h-4 sm:w-5 sm:h-5" />}
            </div>
          </div>

          {/* Expanded Dual-Column Grid Layout */}
          {isOpen && (
            <div className="p-4 sm:p-5 border-t border-slate-700/80 bg-slate-900/60">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 items-stretch">
                {/* KHỐI A — CẤU HÌNH PROMPT ẢNH */}
                <div className="space-y-2 flex flex-col">
                  <div className="flex items-center gap-1.5 text-xs font-bold text-indigo-400 tracking-wider uppercase">
                    <Icons.ImageIcon className="w-4 h-4 text-indigo-400" />
                    <span>KHỐI A — CẤU HÌNH PROMPT ẢNH</span>
                  </div>

                  <div className="bg-slate-800/80 border border-slate-700/70 rounded-2xl p-4 flex-1 flex flex-col justify-between space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-sm font-semibold text-slate-200">
                        Nội dung cấu hình
                      </span>

                      <div className="flex items-center gap-2">
                        <span className="text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-wider">
                          KÍCH HOẠT
                        </span>
                        <button
                          type="button"
                          onClick={() => onChange({ ...config, isActiveA: !config.isActiveA })}
                          title={config.isActiveA ? 'Tắt cấu hình khối Ảnh' : 'Bật cấu hình khối Ảnh'}
                          className={`w-9 h-5 rounded-full p-0.5 transition-colors relative flex items-center cursor-pointer border ${
                            config.isActiveA
                              ? 'bg-indigo-600 border-indigo-400 shadow-indigo-500/20'
                              : 'bg-slate-700 border-slate-600'
                          }`}
                        >
                          <div
                            className={`w-3.5 h-3.5 rounded-full bg-white transition-transform ${
                              config.isActiveA ? 'translate-x-4' : 'translate-x-0'
                            }`}
                          />
                        </button>
                      </div>
                    </div>

                    <textarea
                      rows={5}
                      value={config.configTextA}
                      onChange={(e) => onChange({ ...config, configTextA: e.target.value })}
                      placeholder={PLACEHOLDER_CONFIG_A}
                      className="w-full bg-slate-950 border border-slate-700/80 rounded-xl p-3 font-mono text-xs sm:text-sm text-slate-200 placeholder:text-slate-500 placeholder:leading-relaxed focus:outline-none focus:border-indigo-500/80 focus:ring-1 focus:ring-indigo-500/40 min-h-[140px] resize-y whitespace-pre-wrap leading-relaxed"
                    />
                  </div>
                </div>

                {/* KHỐI B — CẤU HÌNH PROMPT VIDEO */}
                <div className="space-y-2 flex flex-col">
                  <div className="flex items-center gap-1.5 text-xs font-bold text-amber-400 tracking-wider uppercase">
                    <Icons.Video className="w-4 h-4 text-amber-400" />
                    <span>KHỐI B — CẤU HÌNH PROMPT VIDEO</span>
                  </div>

                  <div className="bg-slate-800/80 border border-slate-700/70 rounded-2xl p-4 flex-1 flex flex-col justify-between space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-sm font-semibold text-slate-200">
                        Nội dung cấu hình
                      </span>

                      <div className="flex items-center gap-2">
                        <span className="text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-wider">
                          KÍCH HOẠT
                        </span>
                        <button
                          type="button"
                          onClick={() => onChange({ ...config, isActiveB: !config.isActiveB })}
                          title={config.isActiveB ? 'Tắt cấu hình khối Video' : 'Bật cấu hình khối Video'}
                          className={`w-9 h-5 rounded-full p-0.5 transition-colors relative flex items-center cursor-pointer border ${
                            config.isActiveB
                              ? 'bg-amber-600 border-amber-400 shadow-amber-500/20'
                              : 'bg-slate-700 border-slate-600'
                          }`}
                        >
                          <div
                            className={`w-3.5 h-3.5 rounded-full bg-white transition-transform ${
                              config.isActiveB ? 'translate-x-4' : 'translate-x-0'
                            }`}
                          />
                        </button>
                      </div>
                    </div>

                    <textarea
                      rows={5}
                      value={config.configTextB}
                      onChange={(e) => onChange({ ...config, configTextB: e.target.value })}
                      placeholder={PLACEHOLDER_CONFIG_B}
                      className="w-full bg-slate-950 border border-slate-700/80 rounded-xl p-3 font-mono text-xs sm:text-sm text-slate-200 placeholder:text-slate-500 placeholder:leading-relaxed focus:outline-none focus:border-amber-500/80 focus:ring-1 focus:ring-amber-500/40 min-h-[140px] resize-y whitespace-pre-wrap leading-relaxed"
                    />
