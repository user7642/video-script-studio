/**
 * Checks if a given text looks like a pre-written SSOT script formatted as:
 * `Cảnh NN - Tên Cảnh` or `Cảnh NN: Tên Cảnh` or `Cảnh N - Tên Cảnh` or `Scene N`
 */
function detectPrewrittenScript(text: string): { isMatch: boolean; count: number } {
  if (!text || text.trim().length < 20) {
    return { isMatch: false, count: 0 };
  }

  // Regex to match lines starting with "Cảnh 01 - ...", "Cảnh 1 - ...", "Cảnh 01: ...", "Scene 1 - ...", etc.
  const sceneHeaderRegex = /(?:^|\n)\s*(?:###?\s*)?(?:Cảnh|Scene)\s*(\d{1,2})\s*[-:–—]\s*([^\n]+)/gi;
  const matches = [...text.matchAll(sceneHeaderRegex)];

  if (matches.length >= 1) {
    return { isMatch: true, count: matches.length };
  }

  return { isMatch: false, count: 0 };
}

/**
 * Extract explicit character section if provided in the script
 * Supports:
 * NHÂN VẬT:
 * - Chị Lan: 32 tuổi, người mẹ dịu dàng...
 * - Bé Linh: 6 tuổi, con gái...
 */
function parseExplicitCharacterSection(text: string): Character[] {
  const explicitSectionRegex = /(?:^|\n)\s*(?:###?\s*)?(?:KHỐI\s*\d+\s*[-:–—]\s*)?(?:DANH SÁCH NHÂN VẬT|NHÂN VẬT|HỒ SƠ NHÂN VẬT|CHARACTERS|CHARACTER PROFILES)\s*[:\n]([\s\S]*?)(?=(?:^|\n)\s*(?:###?\s*)?(?:KHỐI\s*\d+|CẢNH\s*\d+|SCENE\s*\d+|KỊCH BẢN\s*CHI\s*TIẾT|KỊCH BẢN|$))/i;
  const match = text.match(explicitSectionRegex);
  if (!match || !match[1]) return [];

  const rawSection = match[1].trim();
  const lines = rawSection.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const characters: Character[] = [];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].replace(/^[-•*–—\d\.\)]+\s*/, '').trim();
    if (!line) continue;

    const colonIdx = line.indexOf(':');
    if (colonIdx > 0) {
      const namePart = line.substring(0, colonIdx).trim();
      const descPart = line.substring(colonIdx + 1).trim();

      let name = namePart;
      let age = '25-30 tuổi';
      let role = i === 0 ? 'Chính' : 'Phụ';

      const bracketMatch = namePart.match(/(.*?)\((.*?)\)/);
      if (bracketMatch) {
        name = bracketMatch[1].trim();
        const insideBracket = bracketMatch[2];
        if (/chính/i.test(insideBracket)) role = 'Chính';
        if (/phụ/i.test(insideBracket)) role = 'Phụ';
        const ageInBracket = insideBracket.match(/\d{1,2}\s*(?:tuổi|yo|t)/i);
        if (ageInBracket) age = ageInBracket[0];
      }

      const ageMatch = descPart.match(/\d{1,2}\s*(?:tuổi|yo|t)/i);
      if (ageMatch) age = ageMatch[0];

      if (/vai\s*chính|nhân\s*vật\s*chính/i.test(descPart)) role = 'Chính';
      if (/vai\s*phụ|nhân\s*vật\s*phụ/i.test(descPart)) role = 'Phụ';

      characters.push({
        id: `char_${i + 1}_${Date.now()}_${i}`,
        name,
        age,
        role,
        appearance: descPart || `Người Việt Nam, trang phục phù hợp với nhân vật ${name}, phong thái tự nhiên.`,
      });
    }
  }

  return characters;
}

/**
 * Automatically extracts characters from scene narratives and dialogue lines
 */
function extractCharactersFromScenes(scenes: Scene[], fullText: string): Character[] {
  // Check explicit list first
  const explicit = parseExplicitCharacterSection(fullText);
  if (explicit.length > 0) {
    return explicit;
  }

  // Map to count occurrences and collect context lines for each character candidate
  const candidateCounts: Map<string, { count: number; scenes: Set<number>; contexts: string[]; honorific: string; baseName: string }> = new Map();

  // Common Vietnamese honorific prefixes
  const honorificsList = ['Chị', 'Anh', 'Bé', 'Cô', 'Chú', 'Bác', 'Ông', 'Bà', 'Em', 'Thầy', 'Mẹ', 'Ba', 'Bố'];
  const honorificsPattern = honorificsList.join('|');

  // Strictly match Vietnamese Proper Capitalized Single Word (e.g. "Lan", "Linh", "Tuấn", "Bin")
  const singleProperWord = `[${VN_UPPER}][${VN_LOWER}]+`;
  const honorificRegex = new RegExp(`\\b(${honorificsPattern})\\s+(${singleProperWord})\\b`, 'g');

  // Dialogue speakers regex (e.g. `Chị Lan: "..."` or `Lan: "..."`)
  const dialogueSpeakerRegex = new RegExp(`(?:^|\\n)\\s*(?:(${honorificsPattern})\\s+)?(${singleProperWord})\\s*:\\s*["“]`, 'g');

  // Search across all scene content
  for (const scene of scenes) {
    const textToScan = `${scene.title} ${scene.content} ${scene.dialogueAndAction || ''}`;

    // 1. Honorifics matches (e.g. "Chị Lan", "Bé Linh", "Anh Tuấn", "Bé Bin")
    let hMatch: RegExpExecArray | null;
    const honRegexCopy = new RegExp(honorificRegex.source, 'g');
    while ((hMatch = honRegexCopy.exec(textToScan)) !== null) {
      const honorific = hMatch[1].trim();
      const baseName = hMatch[2].trim();
      const fullName = `${honorific} ${baseName}`;

      const lowerBase = baseName.toLowerCase();
      // Skip if baseName is in exclude list (like "Chị đưa", "Chị nhìn", "Anh đang", "Bé vừa", etc.)
      if (EXCLUDED_NAME_WORDS.has(lowerBase)) continue;

      if (!candidateCounts.has(fullName)) {
        candidateCounts.set(fullName, {
          count: 0,
          scenes: new Set(),
          contexts: [],
          honorific,
          baseName,
        });
      }
      const item = candidateCounts.get(fullName)!;
      item.count += 1;
      item.scenes.add(scene.sceneNumber);
    }

    // 2. Dialogue Speaker matches
    let dMatch: RegExpExecArray | null;
    const diaRegexCopy = new RegExp(dialogueSpeakerRegex.source, 'g');
    while ((dMatch = diaRegexCopy.exec(textToScan)) !== null) {
      const honPrefix = dMatch[1] ? dMatch[1].trim() : '';
      const speakerBase = dMatch[2].trim();
      const lowerSpeaker = speakerBase.toLowerCase();
      if (EXCLUDED_NAME_WORDS.has(lowerSpeaker)) continue;

      // Find existing honorific key (e.g. if speaker is "Lan", match with "Chị Lan")
      let matchedKey = honPrefix ? `${honPrefix} ${speakerBase}` : speakerBase;
      for (const [key, val] of candidateCounts.entries()) {
        if (val.baseName.toLowerCase() === lowerSpeaker) {
          matchedKey = key;
          break;
        }
      }

      if (!candidateCounts.has(matchedKey)) {
        candidateCounts.set(matchedKey, {
          count: 0,
          scenes: new Set(),
          contexts: [],
          honorific: honPrefix,
          baseName: speakerBase,
        });
      }
      const item = candidateCounts.get(matchedKey)!;
      item.count += 2;
      item.scenes.add(scene.sceneNumber);
    }
  }

  // Filter candidates that appeared at least once with valid names
  const validCandidates = Array.from(candidateCounts.entries())
    .map(([name, data]) => ({ name, ...data }))
    .filter(c => c.count >= 1 && !EXCLUDED_NAME_WORDS.has(c.baseName.toLowerCase()) && !EXCLUDED_NAME_WORDS.has(c.name.toLowerCase()));

  // Sort by number of scene appearances and frequency
  validCandidates.sort((a, b) => b.scenes.size - a.scenes.size || b.count - a.count);

  if (validCandidates.length === 0) {
    return [
      {
        id: `char_1_${Date.now()}`,
        name: 'Nhân vật chính',
        age: '25-30 tuổi',
        role: 'Chính',
        appearance: 'Người Việt Nam, gương mặt thanh tú, trang phục đời thường hiện đại, thần thái tự nhiên.',
      },
    ];
  }

  // Generate character profiles with smart age, role, and appearance
  const totalScenes = scenes.length;
  const characters: Character[] = validCandidates.map((cand, idx) => {
    const isMain = idx === 0 || (cand.scenes.size >= Math.max(2, Math.ceil(totalScenes * 0.4)));
    const role = isMain ? 'Chính' : 'Phụ';

    let age = '25-30 tuổi';
    let appearance = '';

    const hon = cand.honorific.toLowerCase();
    const nameLower = cand.name.toLowerCase();

    if (hon === 'bé' || nameLower.includes('bé') || nameLower.includes('con')) {
      age = '5-7 tuổi';
      appearance = `Bé gái/trai Việt Nam khoảng 5-7 tuổi, gương mặt bầu bĩnh ngây thơ đáng yêu, đôi mắt to tròn sáng lanh lợi, trang phục mặc nhà/học sinh màu sắc tươi sáng, biểu cảm tự nhiên sinh động.`;
    } else if (hon === 'chị' || hon === 'mẹ' || nameLower.includes('mẹ')) {
      age = '30-35 tuổi';
      appearance = `Phụ nữ Việt Nam khoảng 30-35 tuổi, người mẹ trẻ hiền hậu dịu dàng, gương mặt thanh tú ưa nhìn, tóc buộc gọn tự nhiên, trang phục ở nhà trang nhã lịch sự, ánh mắt ấm áp chu đáo.`;
    } else if (hon === 'anh' || hon === 'ba' || hon === 'bố' || nameLower.includes('bố') || nameLower.includes('ba')) {
      age = '32-38 tuổi';
      appearance = `Nam giới Việt Nam khoảng 32-38 tuổi, người bố ấm áp phong thái chững chạc, gương mặt phúc hậu hiền lành, tóc ngắn gọn gàng, trang phục thường ngày tại nhà giản dị, nụ cười hạnh phúc.`;
    } else if (hon === 'cô') {
      age = '28-35 tuổi';
      appearance = `Nữ giới Việt Nam khoảng 28-35 tuổi, phong thái thanh lịch duyên dáng, nét mặt tươi tắn tự tin, trang phục hiện đại nhã nhặn.`;
    } else if (hon === 'chú' || hon === 'bác') {
      age = '40-50 tuổi';
      appearance = `Nam giới Việt Nam khoảng 40-50 tuổi, phong thái đĩnh đạc đáng tin cậy, gương mặt cương nghị hiền từ, trang phục đời thường chỉnh chu.`;
    } else if (hon === 'ông') {
      age = '65-72 tuổi';
      appearance = `Người cao tuổi Việt Nam khoảng 65-72 tuổi, mái tóc điểm bạc, nét mặt đôn hậu phúc hậu, trang phục ở nhà truyền thống thoải mái.`;
    } else if (hon === 'bà') {
      age = '60-68 tuổi';
      appearance = `Phụ nữ lớn tuổi Việt Nam khoảng 60-68 tuổi, gương mặt hiền từ nhân hậu, nụ cười ấm áp, trang phục ở nhà giản dị lịch sự.`;
    } else if (hon === 'em') {
      age = '18-22 tuổi';
      appearance = `Bạn trẻ Việt Nam khoảng 18-22 tuổi, diện mạo trẻ trung năng động, nụ cười rạng rỡ, phong cách thời trang hiện đại thoải mái.`;
    } else {
      age = '25-30 tuổi';
      appearance = `Người Việt Nam khoảng 25-30 tuổi, gương mặt thanh tú, thần thái tự nhiên, trang phục đời thường hiện đại thanh lịch.`;
    }

    return {
      id: `char_${idx + 1}_${Date.now()}_${idx}`,
      name: cand.name,
      age,
      role,
      appearance,
    };
  });

  return characters;
}

/**
 * Cleans and extracts the primary location from a scene title or text
 */
function extractCleanLocation(title: string, content: string): string {
  // 1. Look for explicit "Bối cảnh: ..." or "Địa điểm: ..."
  const explicitLocMatch = content.match(/(?:Bối cảnh|Địa điểm|Location)\s*:\s*([^\n\.,]+)/i);
  if (explicitLocMatch && explicitLocMatch[1].trim()) {
    return explicitLocMatch[1].trim();
  }

  // 2. Clean scene title (remove action phrases like "căng thẳng", "tìm giải pháp", "chuẩn bị dán", "và không khí gia đình", "và lời kêu gọi")
  let cleanLoc = title
    .replace(/\s*[-:–—].*$/, '') // Remove secondary hyphens
    .replace(/(?:căng thẳng|tìm giải pháp|chuẩn bị dán|kêu gọi|giới thiệu|mở đầu|kết thúc|cao trào)/gi, '')
    .trim();

  if (cleanLoc.length < 3) {
    cleanLoc = title.trim();
  }

  return cleanLoc;
}

/**
 * Parses raw text containing scenes into structured Scene objects and infers basic project metadata.
 */
function parsePrewrittenScript(text: string): ParseResult {
  const clean = text.trim();
  const detection = detectPrewrittenScript(clean);

  if (!detection.isMatch) {
    return {
      isPrewrittenScript: false,
      sceneCount: 0,
      title: 'Dự án Video Script',
      scenes: [],
      characters: [],
      scriptNarrative: clean,
    };
  }

  const sceneHeaderRegex = /(?:^|\n)\s*(?:###?\s*)?(?:Cảnh|Scene)\s*(\d{1,2})\s*[-:–—]\s*([^\n]+)/gi;
  const splitIndices: { index: number; sceneNumber: number; title: string; fullMatchLength: number }[] = [];

  let match: RegExpExecArray | null;
  while ((match = sceneHeaderRegex.exec(clean)) !== null) {
    splitIndices.push({
      index: match.index,
      sceneNumber: parseInt(match[1], 10),
      title: match[2].trim(),
      fullMatchLength: match[0].length,
    });
  }

  const scenes: Scene[] = [];
  for (let i = 0; i < splitIndices.length; i++) {
    const current = splitIndices[i];
    const startIndex = current.index + current.fullMatchLength;
    const endIndex = i + 1 < splitIndices.length ? splitIndices[i + 1].index : clean.length;
    const sceneBody = clean.substring(startIndex, endIndex).trim();

    const loc = extractCleanLocation(current.title, sceneBody);

    scenes.push({
      id: `scene_${current.sceneNumber || i + 1}_${Date.now()}_${i}`,
      sceneNumber: current.sceneNumber || i + 1,
      title: current.title,
      location: loc,
      charactersPresent: [],
      content: sceneBody,
      dialogueAndAction: sceneBody,
      summary: sceneBody.slice(0, 120),
    });
  }

  // Infer project title if there is a header before Scene 1
  let inferredTitle = 'Dự án Kịch bản Video AI';
  if (splitIndices.length > 0 && splitIndices[0].index > 0) {
    const preText = clean.substring(0, splitIndices[0].index).trim();
    const titleMatch = preText.match(/(?:Tên dự án|Tiêu đề|Dự án|Tên kịch bản|Title)\s*:\s*([^\n]+)/i);
    if (titleMatch) {
      inferredTitle = titleMatch[1].trim();
    } else {
      const firstLine = preText.split('\n')[0].replace(/^#+\s*/, '').trim();
      if (firstLine.length > 3 && firstLine.length < 80 && !/(?:nhân vật|characters|bối cảnh)/i.test(firstLine)) {
        inferredTitle = firstLine;
      }
    }
  } else if (scenes.length > 0) {
    inferredTitle = `Kịch bản: ${scenes[0].title}`;
  }

  // Extract all characters (explicit or implicit from narrative and dialogues)
  const characters = extractCharactersFromScenes(scenes, clean);

  // Link characters to each scene's charactersPresent list
  for (const scene of scenes) {
    const textToSearch = `${scene.title} ${scene.content}`.toLowerCase();
    const present = characters
      .filter((char) => {
        const charNameLower = char.name.toLowerCase();
        // Check full name or base name (e.g. "Chị Lan" or "Lan")
        const baseName = char.name.replace(/^(?:Chị|Anh|Bé|Cô|Chú|Bác|Ông|Bà|Em|Thầy|Mẹ|Ba|Bố)\s+/i, '').toLowerCase();
        return textToSearch.includes(charNameLower) || (baseName.length > 1 && textToSearch.includes(baseName));
      })
      .map((c) => c.name);

    // If none matched explicitly, fall back to main characters
    scene.charactersPresent = present.length > 0 ? present : characters.slice(0, 2).map((c) => c.name);
  }

  // Re-stitch structured narrative
  const scriptNarrative = scenes
    .map((s) => `Cảnh ${(s.sceneNumber).toString().padStart(2, '0')} - ${s.title}\n${s.content || ''}`)
    .join('\n\n');

  return {
    isPrewrittenScript: true,
    sceneCount: scenes.length,
    title: inferredTitle,
    scenes,
    characters,
    scriptNarrative,
  };
}

function removeVietnameseTones(str: string): string {
  if (!str) return '';
  return str
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd')
    .replace(/Đ/g, 'D');
}

function cleanPromptSpacing(str: string): string {
  if (!str) return '';
  return str
    .replace(/\s+/g, ' ')
    .replace(/,\s*,/g, ',')
    .replace(/\.\s*\./g, '.')
    .replace(/,\s*\./g, '.')
    .replace(/\s+([,\.:])/g, '$1')
    .trim();
}

function cleanMultilinePromptSpacing(str: string): string {
  if (!str) return '';
  return str
    .split('\n')
    .map((line) =>
      line
        .replace(/[ \t]+/g, ' ')
        .replace(/,\s*,/g, ',')
        .replace(/\.\s*\./g, '.')
        .replace(/,\s*\./g, '.')
        .replace(/\s+([,\.:])/g, '$1')
        .trim()
    )
    .join('\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function cleanPromptRedundanciesEn(str: string): string {
  if (!str) return '';
  return str
    .replace(/,?\s*no\s+props?/gi, '')
    .replace(/,?\s*no\s+watermarks?\s*(,?\s*no\s+logos?)?/gi, '')
    .replace(/,?\s*no\s+logos?/gi, '')
    .replace(/,?\s*no\s+text/gi, '');

function cleanPromptRedundanciesVi(str: string): string {

function formatIndividualPrompt(
  ind: IndividualCharacterPrompt,
  includeNameTags: boolean,
  idx: number = 0
): IndividualCharacterPrompt {
  const rawName = ind.characterName || `Nhân vật ${idx + 1}`;
  const cleanName = removeVietnameseTones(rawName);

  let promptEn = ind.prompt || '';
  let promptVi = ind.promptVi || '';

  promptEn = cleanPromptRedundanciesEn(promptEn);
  promptVi = cleanPromptRedundanciesVi(promptVi);

  const tagTextEn = `with a clear text label under feet displaying "${cleanName}"`;
  const tagTextVi = `dưới chân có in nhãn tên "${cleanName}"`;

  if (includeNameTags) {
    if (/with a clear text label under feet displaying "[^"]*"/i.test(promptEn)) {
      promptEn = promptEn.replace(/with a clear text label under feet displaying "[^"]*"/gi, tagTextEn);
    } else if (/plain white background/i.test(promptEn)) {
      promptEn = promptEn.replace(/plain white background/i, `plain white background ${tagTextEn}`);
    } else if (/Style:/i.test(promptEn)) {
      promptEn = promptEn.replace(/Style:/i, `${tagTextEn}. Style:`);
    } else if (/--ar/i.test(promptEn)) {
      promptEn = promptEn.replace(/--ar/i, `${tagTextEn}, --ar`);
    } else {
      promptEn = `${promptEn.trim()} ${tagTextEn}.`;
    }

    if (/dưới chân có in nhãn tên "[^"]*"/i.test(promptVi)) {
      promptVi = promptVi.replace(/dưới chân có in nhãn tên "[^"]*"/gi, tagTextVi);
    } else if (/phông nền trắng trơn/i.test(promptVi)) {
      promptVi = promptVi.replace(/phông nền trắng trơn/i, `phông nền trắng trơn ${tagTextVi}`);
    } else if (/Phong cách:/i.test(promptVi)) {
      promptVi = promptVi.replace(/Phong cách:/i, `${tagTextVi}. Phong cách:`);
    } else if (/--ar/i.test(promptVi)) {
      promptVi = promptVi.replace(/--ar/i, `${tagTextVi}, --ar`);
    } else {
      promptVi = `${promptVi.trim()} ${tagTextVi}.`;
    }
  } else {
    promptEn = promptEn
      .replace(/with a clear text label under feet displaying "[^"]*"/gi, '')
      .replace(/with a clear text label under feet displaying [^\.,]*/gi, '')
      .replace(/with a clear text label under feet/gi, '');
    promptVi = promptVi
      .replace(/dưới chân có in nhãn tên "[^"]*"/gi, '')
      .replace(/dưới chân có in nhãn tên [^\.,]*/gi, '')
      .replace(/dưới chân có in nhãn tên/gi, '')
      .replace(/có in nhãn tên "[^"]*"/gi, '')
      .replace(/có in nhãn tên [^\.,]*/gi, '')
      .replace(/có in nhãn tên/gi, '');
  }

  promptEn = cleanPromptSpacing(promptEn);
  promptVi = cleanPromptSpacing(promptVi);

  return {
    ...ind,
    prompt: promptEn,
    promptVi: promptVi,
  };
}

function buildGroupCharacterPrompt(params: {
  characters: Character[];
  individualCharacterPrompts: IndividualCharacterPrompt[];
  style: string;
  includeNameTags?: boolean;
}): { prompt: string; promptVi: string } {
  const { characters, individualCharacterPrompts, style, includeNameTags = false } = params;

  if (!individualCharacterPrompts || individualCharacterPrompts.length === 0) {
    return { prompt: '', promptVi: '' };
  }

  const charCount = individualCharacterPrompts.length;

  const indListEn = individualCharacterPrompts
    .map((ind, idx) => {
      const charObj = (characters || []).find((c) => c.id === ind.characterId || c.name === ind.characterName);
      const rawName = ind.characterName || charObj?.name || `Character ${idx + 1}`;
      const appearanceEn = extractAppearanceOnlyEn(ind.prompt || '', charObj);

      return `${idx + 1}. ${rawName}: ${appearanceEn}`;
    })
    .join('\n\n');

  const namesListCleanEn = individualCharacterPrompts
    .map((ind) => `"${removeVietnameseTones(ind.characterName || '')}"`)
    .join(', ');

  const promptEn = `Group character reference sheet featuring all ${charCount} characters standing side by side in a single line:\n\n${indListEn}\n\nAll characters standing in A-pose full body shot from head to toe, facing camera, neutral relaxed expression, plain solid white studio background.${
    includeNameTags
      ? ` Each character has a clear text label under their feet displaying their name: ${namesListCleanEn}.`
      : ``
  }\n\nStyle: ${style}, --ar 16:9`;

  const indListVi = individualCharacterPrompts
    .map((ind, idx) => {
      const charObj = (characters || []).find((c) => c.id === ind.characterId || c.name === ind.characterName);
      const rawName = ind.characterName || charObj?.name || `Nhân vật ${idx + 1}`;
      const appearanceVi = extractAppearanceOnlyVi(ind.promptVi || '', charObj);

      return `${idx + 1}. ${rawName}: ${appearanceVi}`;
    })
    .join('\n\n');

  const namesListCleanVi = individualCharacterPrompts
    .map((ind) => `"${removeVietnameseTones(ind.characterName || '')}"`)
    .join(', ');

  const promptVi = `Ảnh tham chiếu gộp cho tất cả ${charCount} nhân vật đứng hàng ngang:\n\n${indListVi}\n\nTất cả nhân vật đứng ở tư thế A-pose toàn thân từ đầu đến chân, nhìn thẳng máy ảnh, biểu cảm trung tính thư giãn, phông nền trắng trơn studio.${
    includeNameTags
      ? ` Dưới chân mỗi nhân vật có in nhãn tên rõ ràng: ${namesListCleanVi}.`
      : ``
  }\n\nPhong cách: ${style}, --ar 16:9`;

  return {
    prompt: cleanMultilinePromptSpacing(promptEn),
    promptVi: cleanMultilinePromptSpacing(promptVi),
  };
}

}

function identifyQuoteLanguage(quote: string): string | null {
  const clean = (quote || '').trim();
  if (!clean || clean.length < 2) return null;

  if (/[\u4e00-\u9fa5]/.test(clean)) return 'Chinese';
  if (/[\u3040-\u30ff]/.test(clean)) return 'Japanese';
  if (/[\uac00-\ud7af\u1100-\u11ff]/.test(clean)) return 'Korean';
  if (/[\u0400-\u04ff]/.test(clean)) return 'Russian';

  const viDiacritics = /[àáảãạăằắẳẵặâầấẩẫậèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđÀÁẢÃẠĂẰẮẲẴẶÂẦẤẨẪẬÈÉẺẼẸÊỀẾỂỄỆÌÍỈĨỊÒÓỎÕỌÔỒỐỔỖỘƠỜỚỞỠỢÙÚỦŨỤƯỪỨỬỮỰỲÝỶỸỴĐ]/;
  if (viDiacritics.test(clean)) return 'Vietnamese';

  const viWords = /\b(tôi|bạn|cảm ơn|xin chào|không|đây|này|với|cho|và|là|thì|sẽ|được|người|nhé|ơi|ạ|thế|gì|sao|đi|về|lại|đến|mình|chúng|buổi|chiều|hôm nay|bức vẽ|khoảnh khắc|bình yên)\b/i;
  if (viWords.test(clean)) return 'Vietnamese';

  const itWords = /\b(che|bel|disegno|hai|un|una|uno|talento|incredibile|lo|sai|ciao|grazie|buongiorno|buonasera|buonanotte|per|favore|come|stai|molto|bene|bellissimo|bellissima|amore|arrivederci|prego|sono|sei|siamo|tutto|questa|questo|tutti|amico|amica|perché|cosa|quando|dove|chi|bello|andiamo|eccoci|va|sempre|giorno|notte|mondo|vita)\b/i;
  if (itWords.test(clean)) return 'Italian';

  if (/[çéèêëîïôûùüœæ]/i.test(clean) && /\b(bonjour|merci|oui|non|s'il|vous|plaît|salut|comment|très|bien|magnifique|c'est|mon|ma|mes|je|tu|il|elle|nous|ils|voilà|au revoir|enchante)\b/i.test(clean)) {
    return 'French';
  }
  const frWords = /\b(bonjour|merci|oui|non|s'il vous plaît|salut|comment|allez-vous|très bien|magnifique|pourquoi|avec|dans|pour|c'est|mon dieu|au revoir|enchante)\b/i;
  if (frWords.test(clean)) return 'French';

  if (/[äöüß]/i.test(clean) && /\b(guten|tag|morgen|danke|bitte|auf|wiedersehen|hallo|wie|geht's|sehr|gut|schön|wunderbar|nein|ja|ich|du|wir|nicht|tschüss)\b/i.test(clean)) {
    return 'German';
  }
  const deWords = /\b(guten tag|guten morgen|danke|bitte|auf wiedersehen|hallo|wie geht's|sehr gut|schön|wunderbar|nein|ja|ich bin|tschüss)\b/i;
  if (deWords.test(clean)) return 'German';

  const esWords = /\b(hola|gracias|por favor|buenos días|buenas tardes|buenas noches|cómo estás|amigo|amiga|mucho gusto|adiós|hasta luego|bien|muy bien|qué tal|por qué|señor|señora|por supuesto|vamos)\b/i;
  if (esWords.test(clean) || /[ñ¿¡]/i.test(clean)) return 'Spanish';

  const enWords = /\b(the|is|are|am|was|were|and|you|your|you're|hello|hi|thank|thanks|welcome|please|what|where|how|why|who|this|that|it|it's|i|i'm|we|we're|they|they're|good|great|awesome|amazing|today|tomorrow|let's|go|love|see|look|yes|no|fine|wonderful|nice|here|there)\b/i;
  if (enWords.test(clean)) return 'English';

  if (/^[A-Za-z0-9\s.,!?'"-]+$/.test(clean)) {
    return 'English';
  }

  return 'Vietnamese';
}

function detectDialogueLanguages(text: string): string[] {
  if (!text) return [];
  const quotes: string[] = [];
  const doubleQuoteRegex = /"([^"\n]{2,})"/g;
  let match: RegExpExecArray | null;
  while ((match = doubleQuoteRegex.exec(text)) !== null) {
    const q = match[1].trim();
    if (q && !quotes.includes(q)) quotes.push(q);
  }
  const singleQuoteRegex = /(?:^|[\s:\(])'([^'\n]{2,})'(?:[\s.,!?\)]|$)/g;
  while ((match = singleQuoteRegex.exec(text)) !== null) {
    const q = match[1].trim();
    if (q && !quotes.includes(q)) quotes.push(q);
  }
  if (quotes.length === 0) return [];
  const langSet: string[] = [];
  for (const q of quotes) {
    const lang = identifyQuoteLanguage(q);
    if (lang && !langSet.includes(lang)) {
      langSet.push(lang);
    }
  }
  return langSet;
}

function getCameraShotText(sceneContext: any, lang: 'vi' | 'en'): string {
  if (lang === 'vi') {
    if (sceneContext?.cameraShotVi) return sceneContext.cameraShotVi.trim();
    if (sceneContext?.cameraShot) return sceneContext.cameraShot.trim();
    const text = `${sceneContext?.sceneTitle || ''} ${sceneContext?.dialogueAndAction || ''} ${sceneContext?.content || ''} ${sceneContext?.summary || ''}`.toLowerCase();
    if (text.includes('cận cảnh') || text.includes('khuôn mặt') || text.includes('gương mặt') || text.includes('ánh mắt')) {
      return 'Cận cảnh, góc quay chuyển động chậm';
    }
    if (text.includes('toàn cảnh') || text.includes('quang cảnh') || text.includes('không gian rộng') || text.includes('đường phố')) {
      return 'Toàn cảnh, góc quay rộng mượt mà';
    }
    if (text.includes('bước đi') || text.includes('chạy') || text.includes('di chuyển')) {
      return 'Góc máy tracking di chuyển theo nhân vật';
    }
    return 'Trung cảnh, góc quay cố định';
  } else {
    if (sceneContext?.cameraShot) return sceneContext.cameraShot.trim();
    const text = `${sceneContext?.sceneTitle || ''} ${sceneContext?.dialogueAndAction || ''} ${sceneContext?.content || ''} ${sceneContext?.summary || ''}`.toLowerCase();
    if (text.includes('close-up') || text.includes('face') || text.includes('eyes') || text.includes('cận cảnh')) {
      return 'Close-up shot, slow zoom';
    }
    if (text.includes('wide') || text.includes('landscape') || text.includes('scenery') || text.includes('toàn cảnh')) {
      return 'Wide shot, smooth cinematic pan';
    }
    if (text.includes('walk') || text.includes('moving') || text.includes('run') || text.includes('di chuyển')) {
      return 'Smooth tracking shot following character';
    }
    return 'Medium shot, static angle';
  }
}

function getAmbientAudioText(sceneContext: any, lang: 'vi' | 'en'): string {
  if (lang === 'vi') {
    if (sceneContext?.ambientAudioVi) return sceneContext.ambientAudioVi.trim();
    if (sceneContext?.ambientAudio) return sceneContext.ambientAudio.trim();
    const loc = (sceneContext?.location || '').toLowerCase();
    const title = (sceneContext?.sceneTitle || '').toLowerCase();
    if (loc.includes('cà phê') || loc.includes('cafe') || title.includes('cà phê')) {
      return 'Tiếng rì rào của quán cà phê và âm thanh đường phố dịu nhẹ';
    }
    if (loc.includes('hoa') || title.includes('hoa')) {
      return 'Tiếng nhạc nhẹ trong tiệm hoa và tiếng chuông gió';
    }
    if (loc.includes('mưa') || title.includes('mưa')) {
      return 'Tiếng bước chân và tiếng mưa rào nhẹ';
    }
    if (loc.includes('văn phòng') || loc.includes('công ty')) {
      return 'Âm thanh nền văn phòng hiện đại với tiếng gõ phím nhẹ';
    }
    if (loc.includes('bếp') || loc.includes('nấu')) {
      return 'Tiếng xèo xèo nấu nướng và âm thanh nhà bếp ấm cúng';
    }
    if (loc.includes('đường') || loc.includes('phố') || loc.includes('chợ')) {
      return 'Âm thanh không gian đường phố nhộn nhịp';
    }
    return sceneContext?.location ? `Âm thanh môi trường tự nhiên tại ${sceneContext.location}` : 'Âm thanh môi trường tự nhiên, dịu nhẹ';
  } else {
    if (sceneContext?.ambientAudio) return sceneContext.ambientAudio.trim();
    const loc = (sceneContext?.location || '').toLowerCase();
    const title = (sceneContext?.sceneTitle || '').toLowerCase();
    if (loc.includes('cà phê') || loc.includes('cafe') || title.includes('cà phê')) {
      return 'Gentle cafe ambient chatter with soft background music';
    }
    if (loc.includes('flower') || loc.includes('hoa') || title.includes('flower')) {
      return 'Soft acoustic music in flower shop with gentle wind chime';
    }
    if (loc.includes('rain') || loc.includes('mưa') || title.includes('rain')) {
      return 'Footsteps and gentle rain ambient sound';
    }
    if (loc.includes('office') || loc.includes('văn phòng')) {
      return 'Modern office ambiance with subtle keyboard clicks';
    }
    if (loc.includes('kitchen') || loc.includes('cooking')) {
      return 'Cozy kitchen ambiance with gentle cooking sizzle';
    }
    if (loc.includes('street') || loc.includes('city') || loc.includes('market')) {
      return 'Ambient city street chatter and gentle environmental noise';
    }
    return sceneContext?.location ? `Natural ambient environmental sound of ${sceneContext.location}` : 'Natural ambient atmospheric audio';
  }
}

function processAdvancedPrompt(original: string, configText: string, isActive: boolean): string {
  if (!original) return '';
  if (!isActive || !configText) return original;

  let cleaned = original;
  const hardcodedNegatives = [
    /,\s*no text,\s*no watermark,\s*no logo/gi,
    /,\s*no text,\s*no logo,\s*no watermark/gi,
    /,\s*no text/gi,
    /,\s*no watermark/gi,
    /,\s*no logo/gi,
  ];

  hardcodedNegatives.forEach((pattern) => {
    cleaned = cleaned.replace(pattern, '');
  });
  cleaned = cleaned.trim();

  const lines = configText.split('\n');
  const prefixes: string[] = [];
  const suffixes: string[] = [];

  lines.forEach((line) => {
    const trimmed = line.trim();
    if (!trimmed || /^(\/\/|#)/.test(trimmed)) return;

    if (trimmed.startsWith('<')) {
      const content = trimmed.substring(1).trim();
      if (content) {
        prefixes.push(content);
      }
    } else if (trimmed.startsWith('>')) {
      const content = trimmed.substring(1).trim();
      if (content) {
        suffixes.push(content);
      }
    }
  });

  const final = [prefixes.join(' '), cleaned, suffixes.join(' ')]
    .filter(Boolean)
    .join(' ');

  return final.trim();
}

function stripStyleAndAspectRatio(text: string): string {
  if (!text) return '';
  return text
    .replace(/[,\.]?\s*Style:\s*[^,\.]*(?:,\s*--ar\s*\d+:\d+)?/gi, '')
    .replace(/[,\.]?\s*Phong cách:\s*[^,\.]*(?:,\s*--ar\s*\d+:\d+)?/gi, '')
    .replace(/[,\.]?\s*--ar\s*\d+:\d+/gi, '')
    .replace(/\s{2,}/g, ' ')
    .replace(/\s+([,\.:])/g, '$1')
    .trim();
}

function formatVideoPromptWithAttributes(params: {
  rawPrompt: string;
  sceneContext: any;
  advConfig: AdvancedPromptConfigState;
  lang?: 'vi' | 'en';
}): string {
  const { rawPrompt, sceneContext, advConfig, lang = 'vi' } = params;
  if (!rawPrompt) return '';

  let body = cleanExistingVideoAttributeTags(rawPrompt);
  body = stripStyleAndAspectRatio(body);
  body = standardizeDialogueQuotes(body);

  const tags: string[] = [];
  if (advConfig.enableCamera) {
    const cameraText = getCameraShotText(sceneContext, lang);
    if (cameraText) {
      tags.push(`[Camera: ${cameraText}]`);
    }
  }
  if (advConfig.enableAmbient) {
    const ambientText = getAmbientAudioText(sceneContext, lang);
    if (ambientText) {
      tags.push(`[Ambient Audio: ${ambientText}]`);
    }
  }
  if (advConfig.enableSmartAudioLang) {
    const combinedSceneText = [
      body,
      sceneContext?.dialogueAndAction || '',
      sceneContext?.content || '',
      sceneContext?.summary || '',
      sceneContext?.videoPrompt || '',
      sceneContext?.videoPromptVi || '',
    ].join(' ');
    const detectedLanguages = detectDialogueLanguages(combinedSceneText);
    if (detectedLanguages.length === 1) {
      tags.push(`[Audio Language: ${detectedLanguages[0]}]`);
    } else if (detectedLanguages.length >= 2) {
      tags.push(`[Audio Language: Multi-language (${detectedLanguages.join(', ')})]`);
    }
  }

  let result = body;
  if (tags.length > 0) {
    result = `${result} ${tags.join(' ')}`.trim();
  }

  result = processAdvancedPrompt(result, advConfig.configTextB, advConfig.isActiveB);
  return result.replace(/\s{2,}/g, ' ').trim();
}

function stripDialogueAndAudio(text: string): string {
  if (!text) return '';
  let res = text;

  // Remove Audio Language tag
  res = res.replace(/\[\s*Audio\s*Language\s*:[^\]]*\]/gi, '');

  // Remove lead-in verbs + quote (Vietnamese & English patterns)
  const leadInPatterns = [
    /(?:trong khi|đồng thời|vừa|liền|rồi)?\s*(?:nói|hỏi|đáp|lên tiếng|thì thầm|kêu lên|thốt lên|than thở|trả lời|mỉm cười nói|nhẹ nhàng nói|hướng về[^:]*nói)\s*:\s*["“«'][^"”»'\n]+["”»']/gi,
    /(?:while|and|then)?\s*(?:saying|says|said|asking|asks|asked|replying|replies|replied|whispering|whispers|shouting|shouts|exclaiming|exclaims|murmuring|murmurs|calling out)\s*:\s*["“«'][^"”»'\n]+["”»']/gi,
    /\s*(?:nói|hỏi|đáp|says|asks|replies)\s*:\s*["“«'][^"”»'\n]+["”»']/gi,
  ];

  leadInPatterns.forEach((p) => {
    res = res.replace(p, '');
  });

  // Remove quotes
  res = res.replace(/["“«'][^"”»'\n]{2,}["”»']/g, '');

  // Clean artifacts
  res = res
    .replace(/\s+([.,;:!?])/g, '$1')
    .replace(/([.,;:!?])\s*([.,;:!?])/g, '$1 ')
    .replace(/:\s*(\[Camera|\[Ambient)/gi, ' $1')
    .replace(/,\s*(\[Camera|\[Ambient)/gi, ' $1')
    .replace(/\.\s*\./g, '.')
    .replace(/\s{2,}/g, ' ')
    .trim();

  return res;
}

function extractQuotesOnly(text: string): string {
  if (!text) return '';
  const regex = /["“«]([^"”»\n]+)["”»]/g;
  const quotes: string[] = [];
  let match: RegExpExecArray | null;
  while ((match = regex.exec(text)) !== null) {
    const q = match[1].trim();
    if (q.length > 0 && !/^(Camera|Ambient Audio|Audio Language|Audio)/i.test(q)) {
      quotes.push(q);
    }
  }
  return quotes.join('\n');
}

function formatMultiRefVideoPrompts(params: {
  scenePrompts: ScenePrompt[];
  allScenes?: Scene[];
  advConfig: AdvancedPromptConfigState;
  filterMode: 'full' | 'no_audio' | 'dialogue_only';
  characters?: Character[];
  lang: 'vi' | 'en';
}): string {
  const { scenePrompts, allScenes = [], advConfig, filterMode, lang } = params;
  if (!scenePrompts || scenePrompts.length === 0) return '';

  if (filterMode === 'dialogue_only') {
    const fullFormattedPrompts = scenePrompts
      .map((sp) => {
        const fullScene = allScenes.find((s) => s.sceneNumber === sp.sceneNumber || s.id === sp.id) || sp;
        const sceneContext = {
          ...sp,
          ...fullScene,
          sceneTitle: sp.sceneTitle || (fullScene as any).title,
          location: sp.location || (fullScene as any).location,
          dialogueAndAction: (fullScene as any).dialogueAndAction || (fullScene as any).content || '',
          cameraShot: sp.cameraShot,
          cameraShotVi: sp.cameraShotVi,
          ambientAudio: sp.ambientAudio,
          ambientAudioVi: sp.ambientAudioVi,
        };

        const rawPrompt = lang === 'vi' ? (sp.videoPromptVi || sp.videoPrompt || '') : (sp.videoPrompt || '');
        return formatVideoPromptWithAttributes({
          rawPrompt,
          sceneContext,
          advConfig,
          lang,
        });
      })
      .join('\n\n');

    return extractQuotesOnly(fullFormattedPrompts);
  }

  return scenePrompts
    .map((sp, idx) => {
      const fullScene = allScenes.find((s) => s.sceneNumber === sp.sceneNumber || s.id === sp.id) || sp;
      const sceneContext = {
        ...sp,
        ...fullScene,
        sceneTitle: sp.sceneTitle || (fullScene as any).title,
        location: sp.location || (fullScene as any).location,
        dialogueAndAction: (fullScene as any).dialogueAndAction || (fullScene as any).content || '',
        cameraShot: sp.cameraShot,
        cameraShotVi: sp.cameraShotVi,
        ambientAudio: sp.ambientAudio,
        ambientAudioVi: sp.ambientAudioVi,
      };

      const rawPrompt = lang === 'vi' ? (sp.videoPromptVi || sp.videoPrompt || '') : (sp.videoPrompt || '');
      const formattedFull = formatVideoPromptWithAttributes({
        rawPrompt,
        sceneContext,
        advConfig,
        lang,
      });

      const nn = (sp.sceneNumber || idx + 1).toString().padStart(2, '0');
      const label =
        idx === 0
          ? `[Ảnh tham chiếu ${nn} — Cảnh 1 — mở đầu | ${sceneContext.sceneTitle}]`
          : `[Ảnh tham chiếu ${nn} — Cảnh ${sp.sceneNumber || idx + 1} — tiếp nối cảnh trước | ${sceneContext.sceneTitle}]`;

      if (filterMode === 'no_audio') {
        const noAudioBody = stripDialogueAndAudio(formattedFull);
        return `${label}\n${noAudioBody}`;
      }

      return `${label}\n${formattedFull}`;
    })
    .join('\n\n');
}

// Client-side Storage & Key Management
function getStoredApiKey(): string {
  try {
    return (localStorage.getItem('gemini_api_key') || '').trim();
  } catch (e) {
    return '';
  }
}

function saveApiKey(key: string): void {
  const trimmed = (key || '').trim();
  try {
    if (trimmed) {
      localStorage.setItem('gemini_api_key', trimmed);
    } else {
      localStorage.removeItem('gemini_api_key');
    }
  } catch (e) {
    console.warn('LocalStorage save failed:', e);
  }
}

// Direct Gemini API Caller
async function callGeminiDirect(params: {
  prompt: string;
  systemInstruction?: string;
  model?: string;
  jsonMode?: boolean;
  imageBase64?: string | null;
  customApiKey?: string;
}): Promise<string> {
  const { prompt, systemInstruction, model, jsonMode = true, imageBase64 = null, customApiKey } = params;
  const apiKey = (customApiKey || getStoredApiKey()).trim();
  if (!apiKey) {
    throw new Error('Chưa có Gemini API Key. Vui lòng bấm vào biểu tượng 🔑 Cấu hình API Key trên thanh tiêu đề để nhập API Key của bạn.');
  }

  const parts: any[] = [];
  if (imageBase64) {
    const match = imageBase64.match(/^data:(image\/[a-zA-Z0-9\+\-\.]+);base64,(.+)$/);
    if (match) {
      parts.push({ inline_data: { mime_type: match[1], data: match[2] } });
    }
  }
  parts.push({ text: prompt });

  const payload: any = { contents: [{ parts }] };
  if (systemInstruction) {
    payload.systemInstruction = { parts: [{ text: systemInstruction }] };
  }
  if (jsonMode) {
    payload.generationConfig = { responseMimeType: "application/json" };
  }

  const fallbackModels = [
    'gemini-3.5-flash-lite',   // GA, nhẹ, ít bị quá tải nhất
    'gemini-3.6-flash',        // GA, ổn định
    'gemini-3.7-flash',        // mới, giá ưu đãi, ổn định production
    'gemini-flash-latest'      // alias — chỉ dùng làm phương án cuối cùng, có thể là bản experimental
  ];

  const models = model ? [model, ...fallbackModels.filter(m => m !== model)] : fallbackModels;

  const REQUEST_TIMEOUT_MS = 12000;

  let lastError: any = null;
  for (const targetModel of models) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${encodeURIComponent(apiKey)}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: controller.signal
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        const msg = errData?.error?.message || (`Lỗi HTTP ${res.status}: ${res.statusText}`);
        throw new Error(msg);
      }

      const data = await res.json();
      const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
      return rawText;
    } catch (err: any) {
      lastError = err?.name === 'AbortError'
        ? new Error(`[${targetModel}] Timeout sau ${REQUEST_TIMEOUT_MS / 1000}s`)
        : err;
      console.warn(`Attempt with ${targetModel} failed:`, lastError);
    } finally {
      clearTimeout(timeoutId);
    }
  }

  throw lastError || new Error('Không thể kết nối đến Gemini API. Vui lòng thử lại.');
}

// 1. Generate Random Idea
async function generateRandomIdeaApi(genre: string): Promise<string> {
  const customApiKey = getStoredApiKey();
  const currentGenre = genre || "Lãng mạn, ngôn tình, ngọt ngào";
  const promptText = `Bạn là một biên kịch sáng tạo chuyên nghiệp. Hãy tạo 1 ý tưởng kịch bản video ngắn độc đáo, kịch tính, hấp dẫn thuộc thể loại "${currentGenre}" (dưới 60 từ). Ý tưởng mới mẻ, tự nhiên, cốt truyện có cao trào và tình huống rõ ràng, phù hợp sản xuất video ngắn bằng AI Image-to-Video.

Trả về định dạng JSON:
{
  "idea": "Mô tả ý tưởng video ngắn..."
}`;

  const text = await callGeminiDirect({
    prompt: promptText,
    customApiKey,
    jsonMode: true
  });

  try {
    const parsed = JSON.parse(text);
    return parsed.idea || '';
  } catch (e) {
    return text.replace(/[\{\}"]/g, '').trim();
  }
}

// 2. Generate Full Script
async function generateScriptApi(params: {
  idea: string;
  hasProduct: boolean;
  productImage?: string | null;
  isRegenerate?: boolean;
}): Promise<{
  title: string;
  characters: any[];
  scriptNarrative: string;
  scenes: any[];
}> {
  const customApiKey = getStoredApiKey();
  const { idea, hasProduct, productImage, isRegenerate } = params;

  const systemInstruction = `Bạn là một biên kịch xuất sắc đang cộng tác trực tiếp với đạo diễn để phát triển kịch bản video ngắn cho AI Image-to-Video.
QUY TẮC BẮT BUỘC TỪ BẢN GỐC SSOT (v4):
1. Bạn luôn đưa ra ý tưởng cụ thể, viết thành một bản hoàn chỉnh với trình tự thời gian, không gian hợp lý, nhân quả rõ ràng.
2. Viết theo mạch văn xuôi liền mạch, lời thoại lồng tự nhiên vào dòng chảy câu chuyện giống truyện ngắn.
3. Kịch bản chi tiết từng cảnh là nguồn dữ liệu gốc duy nhất (SSOT) của toàn bộ dự án.
4. Mỗi cảnh phải được tách riêng với số thứ tự (1, 2, 3...), tên cảnh, địa điểm cụ thể, danh sách nhân vật có mặt, và nội dung văn xuôi chi tiết của cảnh đó (kèm lời thoại trong ngoặc kép "...").
5. Tự động ngắt đoạn khi thay đổi diễn biến. Mỗi cảnh dài 1-3 đoạn văn xuôi rõ ràng, giàu hình ảnh thị giác.`;

  const promptText = `
### DỮ LIỆU ĐẦU VÀO
- Ý tưởng gốc: "${idea}"
- Sản phẩm đính kèm: ${hasProduct ? "Có sản phẩm xuất hiện trong video." : "Không có."}
${isRegenerate ? "- YÊU CẦU LÀM MỚI: Viết cốt truyện & tuyến nhân vật MỚI HOÀN TOÀN so với kịch bản cũ, bám sát ý tưởng gốc." : ""}

### NHIỆM VỤ CỦA BIÊN KỊCH:
1. Tiêu đề dự án (title): Tên phim/video ngắn hấp dẫn, ngắn gọn.
2. Dàn nhân vật (characters): Khai báo đầy đủ từng nhân vật gồm id, name, age, role ("Chính" / "Phụ"), appearance (mô tả chi tiết khuôn mặt, tóc, dáng người, trang phục - nêu rõ người Việt Nam trừ khi có chỉ định khác), personality.
3. Danh sách phân cảnh (scenes): Chia kịch bản thành các cảnh theo thứ tự thời gian (sceneNumber từ 1 đến 4-6 cảnh).
   - id: \`scene_1\`, \`scene_2\`...
   - sceneNumber: Số nguyên 1, 2, 3...
   - title: Tên cảnh súc tích (địa điểm/mục đích)
   - location: Tên địa điểm cụ thể (ví dụ: "Quán cà phê vintage phong cách Địa Trung Hải")
   - charactersPresent: Mảng tên các nhân vật có mặt trong cảnh
   - content: Đoạn văn xuôi liền mạch chi tiết của riêng cảnh này, lời thoại lồng tự nhiên trong dấu ngoặc kép "..."
   - summary: Tóm tắt 1 câu ngắn về cảnh
   - dialogueAndAction: Toàn bộ hành động và lời thoại của cảnh
4. Kịch bản văn xuôi tổng thể (scriptNarrative): Bản gộp tất cả các cảnh theo định dạng:
   Cảnh 01 - [Tên Cảnh 1]
   [Nội dung cảnh 1]

   Cảnh 02 - [Tên Cảnh 2]
   [Nội dung cảnh 2]

Trả về JSON chuẩn.`;

  const text = await callGeminiDirect({
    prompt: promptText,
    systemInstruction,
    imageBase64: (hasProduct && productImage) ? productImage : null,
    customApiKey,
    jsonMode: true
  });

  const data = JSON.parse(text);

  if (data.characters) {
    data.characters = data.characters.map((c: any, index: number) => ({
      id: c.id || (`char_${index + 1}_${Date.now()}`),
      name: c.name || (`Nhân vật ${index + 1}`),
      age: c.age || "25 tuổi",
      role: c.role || (index === 0 ? "Chính" : "Phụ"),
      appearance: c.appearance || "Gương mặt thanh tú, trang phục hiện đại, thần thái tự nhiên.",
      personality: c.personality || "",
    }));
  }

  if (data.scenes) {
    data.scenes = data.scenes.map((s: any, index: number) => {
      const sceneNum = s.sceneNumber || index + 1;
      const sceneTitle = s.title || (`Cảnh ${sceneNum}`);
      const content = s.content || s.dialogueAndAction || s.summary || "";
      return {
        id: s.id || (`scene_${sceneNum}_${Date.now()}`),
        sceneNumber: sceneNum,
        title: sceneTitle,
        location: s.location || "Không gian mở",
        charactersPresent: Array.isArray(s.charactersPresent) ? s.charactersPresent : [],
        content,
        dialogueAndAction: s.dialogueAndAction || content,
        summary: s.summary || content.slice(0, 100),
      };
    });
  }

  return data;
}

// 3. Refine Script
async function refineScriptApi(params: {
  currentData: any;
  userRequest: string;
}): Promise<any> {
  const customApiKey = getStoredApiKey();
  const { currentData, userRequest } = params;

  const promptText = `
Dưới đây là kịch bản hiện tại của dự án:
${JSON.stringify(currentData, null, 2)}

Yêu cầu chỉnh sửa của đạo diễn:
"${userRequest}"

Nhiệm vụ: Cập nhật kịch bản bám sát yêu cầu, giữ nguyên cấu trúc JSON (title, characters, scriptNarrative, scenes).
Đảm bảo mảng 'scenes' chứa đầy đủ: id, sceneNumber, title, location, charactersPresent, content, summary, dialogueAndAction.

  const text = await callGeminiDirect({

}

4. PROMPT ẢNH MÔI TRƯỜNG (ENVIRONMENT PROMPTS):

   - TUYỆT ĐỐI KHÔNG có người hoặc động vật (empty environment, strictly no people, no animals).
   - Kết thúc chuỗi tiếng Anh: "Style: ${style}, --ar ${aspectRatio}".

${hasProduct ? `5. MÔ TẢ SẢN PHẨM (NẾU CÓ):
   - 'productDescription': Đoạn mô tả tiếng Anh chi tiết, khách quan về sản phẩm trích xuất từ ảnh thật (kiểu dáng, màu sắc, chi tiết thương hiệu).
   - 'productDescriptionVi': Bản dịch tiếng Việt tương ứng.` : ""}

### CẤU TRÚC JSON ĐẦU RA:
{
  "individualCharacterPrompts": [
    {
      "characterId": "id_nhan_vat",
      "characterName": "Tên nhân vật",

    }
  ],

      "prompt": "English environment prompt without people or animals. Style: ${style}, --ar ${aspectRatio}",

    }
  ]${hasProduct ? `,
  "productDescription": "English product visual description...",
  "productDescriptionVi": "Mô tả sản phẩm tiếng Việt..."` : ""}
}`;

  try {

// 6. Generate Scene Prompts
async function generateScenePromptsApi(params: {
  scenes: any[];
  characters: any[];
  style: string;
  aspectRatio: string;
  characterReferencePrompt?: string;
  environmentPrompts?: any[];
  productDescription?: string;
  productDescriptionVi?: string;
}): Promise<{
  scenePrompts: any[];
}> {
  const customApiKey = getStoredApiKey();
  const { scenes, characters, style, aspectRatio, characterReferencePrompt, environmentPrompts, productDescription, productDescriptionVi } = params;

  if (!customApiKey) {
    return {
      scenePrompts: generateAllScenePrompts(scenes, characters, style, aspectRatio)
    };
  }

  const promptText = `
### DỮ LIỆU ĐẦU VÀO TỪ SSOT ĐÃ CHỐT
- Danh sách Scene Cards (SSOT): ${JSON.stringify(scenes, null, 2)}
- Danh sách nhân vật: ${JSON.stringify(characters, null, 2)}
- Phong cách hình ảnh: "${style || 'Hiện thực'}"
- Tỉ lệ khung hình: "${aspectRatio || '9:16'}"
- Prompt tham chiếu nhân vật gộp: "${characterReferencePrompt || ''}"
- Danh sách prompt môi trường: ${JSON.stringify(environmentPrompts, null, 2)}
${productDescription ? `- Mô tả sản phẩm thực tế tham chiếu: "${productDescription}" (Bản dịch: "${productDescriptionVi || ''}")` : ""}

### QUY TẮC SINH PROMPT SẢN XUẤT TỪNG CẢNH THEO V4 (NHÓM 3):
Với MỖI cảnh trong danh sách, xuất đủ 2 khối:

1. KHỐI 1 — PROMPT ẢNH KHỞI ĐẦU (INITIAL FRAME PROMPT):
   - Cấu trúc: [cỡ cảnh: close-up shot / medium shot / wide shot] + tên từng nhân vật (kèm 1-2 đặc điểm nhận diện/trang phục, người Việt Nam) + hành động/tư thế ban đầu + tại bối cảnh nào + biểu cảm/trạng thái chung${productDescription ? ' + nếu cảnh có sản phẩm, lồng ghép sản phẩm tự nhiên theo mô tả sản phẩm' : ''}. Style: ${style}, --ar ${aspectRatio}
   - 'initialFramePrompt': Tiếng Anh chuẩn.
   - 'initialFramePromptVi': Bản dịch tiếng Việt sát nghĩa.

2. KHỐI 2 — PROMPT DIỄN BIẾN / PROMPT VIDEO (IMAGE-TO-VIDEO MOTION PROMPT):
   - ĐẶC BIỆT QUAN TRỌNG: Viết văn xuôi ĐẦY ĐỦ, CHI TIẾT, LIỀN MẠCH, KHÔNG ĐƯỢC RÚT GỌN HAY QUA LOA!
   - Mô tả tuần tự hành động, chuyển động máy quay/nhân vật, biến đổi biểu cảm, VÀ LỜI THOẠI LỒNG TỰ NHIÊN đúng vị trí diễn ra (ví dụ: says: "..." hoặc while saying: "..."). Lấy đúng lời thoại có trong kịch bản cảnh đó.
   - Bắt đầu thẳng vào hành động. Không mô tả lại ngoại hình hay bối cảnh đã có ở ảnh khởi đầu.
   - Dùng nhãn trung tính nếu cần: 'ảnh tham chiếu nhân vật', 'ảnh tham chiếu môi trường', 'ảnh tham chiếu sản phẩm'.
   - Nếu cảnh có nhân vật tương tác với sản phẩm (cầm, chỉ, giới thiệu, sử dụng...), mô tả hành động mượt mà, chính xác đặc điểm sản phẩm.
   - Kết thúc tự nhiên ở câu mô tả hành động / lời thoại cuối cùng của cảnh. TUYỆT ĐỐI KHÔNG thêm thông số phong cách ("Style: ...") hay tỉ lệ khung hình ("--ar ...") vào đuôi Khối 2 (vì Image-to-Video đã kế thừa hoàn toàn từ Khối 1).
   - 'videoPrompt': Tiếng Anh chuẩn (kết thúc tự nhiên, KHÔNG có 'Style: ...' hay '--ar ...').
   - 'videoPromptVi': Bản dịch tiếng Việt sát nghĩa (kết thúc tự nhiên, KHÔNG có 'Phong cách: ...' hay '--ar ...').

3. TRƯỜNG LOCATION & CAMERA / AMBIENT:
   - 'location': Lấy đúng tên bối cảnh tương ứng.
   - 'cameraShot': Gợi ý góc quay (ví dụ "Medium shot, slow push in").
   - 'cameraShotVi': Bản dịch góc quay.
   - 'ambientAudio': Gợi ý âm thanh môi trường.
   - 'ambientAudioVi': Bản dịch âm thanh môi trường.

### CẤU TRÚC JSON ĐẦU RA:
{
  "scenePrompts": [
    {
      "sceneNumber": 1,
      "sceneTitle": "Tiêu đề cảnh",
      "location": "Địa điểm",
      "charactersPresent": ["Tên nhân vật"],
      "initialFramePrompt": "English initial frame prompt. Style: ${style}, --ar ${aspectRatio}",
      "initialFramePromptVi": "Bản dịch tiếng Việt...",
      "videoPrompt": "English detailed continuous video motion prompt with dialogue ending naturally without style or aspect ratio flags.",
      "videoPromptVi": "Bản dịch tiếng Việt chi tiết của Khối 2 kết thúc tự nhiên ở hành động hoặc lời thoại...",
      "cameraShot": "Medium shot, smooth tracking",
      "cameraShotVi": "Trung cảnh, tracking mượt",
      "ambientAudio": "Natural ambient coffee shop chatter",
      "ambientAudioVi": "Tiếng trò chuyện rì rào trong quán cà phê"
    }
  ]
}`;

  try {
    const text = await callGeminiDirect({
      prompt: promptText,
      customApiKey,
      jsonMode: true
    });
    const data = JSON.parse(text);
    if (data.scenePrompts && Array.isArray(data.scenePrompts)) {
      const cleanVideoEnding = (str: string) => {
        if (!str) return '';
        return str
          .replace(/[,.]?s*Style:s*[^,.]*(?:,s*--ars*d+:d+)?/gi, '')
          .replace(/[,.]?s*Phong cách:s*[^,.]*(?:,s*--ars*d+:d+)?/gi, '')
          .replace(/[,.]?s*--ars*d+:d+/gi, '')
          .replace(/\s{2,}/g, ' ')
          .replace(/\s+([,.:])/g, '$1')
          .trim();
      };

      data.scenePrompts = data.scenePrompts.map((sp: any) => ({
        ...sp,
        videoPrompt: cleanVideoEnding(sp.videoPrompt || ''),
        videoPromptVi: cleanVideoEnding(sp.videoPromptVi || ''),
      }));
    }
    return data;
  } catch (e) {
    console.warn('Fallback to local scene prompt generation:', e);
    return {
      scenePrompts: generateAllScenePrompts(scenes, characters, style, aspectRatio)
    };
  }
}

interface PromptCardProps {
  title: string;
  subtitle?: string;
  promptText: string;
  displayText?: string;
  badge?: string;
  badgeColor?: 'purple' | 'blue' | 'emerald' | 'amber' | 'indigo';
  className?: string;
  copyLabel?: string;
  lang?: 'vi' | 'en';
  onLangChange?: (lang: 'vi' | 'en') => void;
  showLangToggle?: boolean;
  extraControls?: React.ReactNode;
}

const PromptCard: React.FC<PromptCardProps> = ({
  title,
  subtitle,
  promptText,
  displayText,
  badge,
  badgeColor = 'purple',
  className = '',
  lang,
  onLangChange,
  showLangToggle = false,
  extraControls,
}) => {
  const [internalLang, setInternalLang] = useState<'vi' | 'en'>('vi');
  const [copied, setCopied] = useState(false);

  const activeLang = lang !== undefined ? lang : internalLang;

  const handleLangChange = (selectedLang: 'vi' | 'en') => {
    if (onLangChange) {
      onLangChange(selectedLang);
    } else {
      setInternalLang(selectedLang);
    }
  };

  const handleCopy = async () => {
    const textToCopy = activeLang === 'vi' ? (displayText || promptText) : promptText;
    if (!textToCopy) return;

    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(textToCopy);
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = textToCopy;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        textarea.style.top = '-9999px';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      }
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (err) {
      console.error('Failed to copy text: ', err);
    }
  };

  const badgeColors = {
    purple: 'bg-purple-500/15 text-purple-300 border-purple-500/30 backdrop-blur-sm',
    blue: 'bg-blue-500/15 text-blue-300 border-blue-500/30 backdrop-blur-sm',
    emerald: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30 backdrop-blur-sm',
    amber: 'bg-amber-500/15 text-amber-300 border-amber-500/30 backdrop-blur-sm',
    indigo: 'bg-indigo-500/15 text-indigo-300 border-indigo-500/30 backdrop-blur-sm',
  };

  const currentText = activeLang === 'vi' ? (displayText || promptText) : promptText;

  return (
    <div
      className={`backdrop-blur-xl bg-white/[0.03] border border-white/10 hover:border-white/20 rounded-2xl p-3.5 sm:p-4 shadow-xl hover:shadow-2xl transition-all flex flex-col justify-between ${className}`}
    >
      <div
        className={`flex flex-col gap-1.5 ${
          subtitle || badge ? 'mb-2 pb-2' : 'mb-1.5 pb-1.5'
        } border-b border-white/10 shrink-0`}
      >
        {/* Row 1: 2-Column Header - Title on left, Copy button on right */}
        <div className="flex items-start justify-between gap-2 w-full">
          {/* Left Column: Title + Badge */}
          <div className="flex-1 min-w-0 pr-1 flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-2">
            <h4 className="font-bold text-slate-100 text-xs sm:text-sm leading-snug break-words">{title}</h4>
            {badge && (
              <span
                className={`inline-block self-start sm:self-auto px-1.5 py-0.5 rounded-md text-[9px] sm:text-[10px] font-bold uppercase tracking-wider border shrink-0 ${
                  badgeColors[badgeColor] || badgeColors.purple
                }`}
              >
                {badge}
              </span>
            )}
          </div>

          {/* Right Column: Copy Button & Lang Toggle */}
          <div className="flex items-center gap-1 shrink-0 ml-auto self-start">
            {showLangToggle && (
              <div className="inline-flex items-center bg-black/40 border border-white/10 backdrop-blur-md rounded-lg p-0.5 text-[10px] sm:text-[11px] font-bold">
                <button
                  type="button"
                  onClick={() => handleLangChange('vi')}
                  className={`px-1.5 sm:px-2 py-0.5 sm:py-1 rounded transition-all cursor-pointer ${
                    activeLang === 'vi'
                      ? 'bg-indigo-600/90 text-white shadow-sm font-extrabold border border-indigo-400/30'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  VI
                </button>
                <button
                  type="button"
                  onClick={() => handleLangChange('en')}
                  className={`px-1.5 sm:px-2 py-0.5 sm:py-1 rounded transition-all cursor-pointer ${
                    activeLang === 'en'
                      ? 'bg-indigo-600/90 text-white shadow-sm font-extrabold border border-indigo-400/30'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  EN
                </button>
              </div>
            )}

            <button
              type="button"
              onClick={handleCopy}
              title={activeLang === 'vi' ? 'Sao chép prompt' : 'Copy prompt'}
              className={`w-7 h-7 sm:w-8 sm:h-8 rounded-lg sm:rounded-xl flex items-center justify-center transition-all shrink-0 cursor-pointer p-0 backdrop-blur-sm ${
                copied
                  ? 'bg-emerald-600/90 text-white shadow-md shadow-emerald-900/30 border border-emerald-400/50'
                  : 'bg-indigo-600/80 hover:bg-indigo-500 text-white shadow-md shadow-indigo-600/30 border border-indigo-400/30'
              }`}
            >
              {copied ? <Check className="w-3.5 h-3.5" /> : <Copy className="w-3.5 h-3.5" />}
            </button>
          </div>
        </div>

        {/* Row 2: Subtitle */}
        {subtitle && <p className="text-[11px] sm:text-xs text-slate-400 font-normal leading-snug">{subtitle}</p>}
      </div>

      {extraControls && <div className="w-full shrink-0 my-1">{extraControls}</div>}

      <div className="p-2.5 sm:p-3 bg-black/40 backdrop-blur-md border border-white/[0.08] rounded-xl text-xs sm:text-sm text-slate-200 leading-relaxed whitespace-pre-wrap select-all max-h-52 sm:max-h-60 overflow-y-auto flex-1 mt-1">
        {currentText}
      </div>
    </div>
  );
};

                return (
                  <React.Fragment key={stepItem.num}>

                      <div
                        className={`flex-1 h-[2px] min-w-[8px] sm:min-w-[16px] transition-colors ${
                          isCompleted || isActive ? 'bg-indigo-500/80 shadow-sm shadow-indigo-500/40' : 'bg-white/10'
                        }`}

                    <button
                      onClick={() => isAccessible && onStepClick(stepItem.num)}
                      disabled={!isAccessible}
                      className={`flex items-center gap-1 sm:gap-2 px-1.5 sm:px-3 py-1 rounded-lg text-xs transition-all cursor-pointer ${
                        isActive
                          ? 'bg-indigo-600/80 text-white font-bold shadow-lg shadow-indigo-600/30 border border-indigo-400/40 backdrop-blur-sm'

                          isActive
                            ? 'bg-white/20 text-white'

                          stepItem.num

                      </span>
                      <span className="text-[10px] sm:text-xs font-semibold whitespace-nowrap">
                        {stepItem.label}

        )}
      </div>
    </header>
  );

    // STEP 0 INPUT IDEA







interface Step0InputIdeaProps {
  idea: string;
  setIdea: (idea: string) => void;
  hasProduct: boolean;
  setHasProduct: (has: boolean) => void;
  productImage: ProductInfo | null;
  setProductImage: (img: ProductInfo | null) => void;
  onGenerateScript: (idea: string, hasProduct: boolean, productImage: ProductInfo | null) => void;
  onApplyPrewrittenScript: (parseResult: ParseResult) => void;
  isLoading: boolean;
  hasExistingProject?: boolean;
  lastActiveStep?: number;
  projectName?: string;
  onResumeProject?: () => void;
}

const Step0InputIdea: React.FC<Step0InputIdeaProps> = ({
  idea,
  setIdea,
  hasProduct,
  setHasProduct,
  productImage,
  setProductImage,
  onGenerateScript,
  onApplyPrewrittenScript,
  isLoading,
  hasExistingProject = false,
  lastActiveStep = 1,
  projectName = 'Dự án Video Script',
  onResumeProject,
}) => {
  const [errorMsg, setErrorMsg] = useState('');
  const [isSampleOpen, setIsSampleOpen] = useState(false);
  const [currentGenreIndex, setCurrentGenreIndex] = useState(0);
  const [isRandomizing, setIsRandomizing] = useState(false);
  const [detectedScriptInfo, setDetectedScriptInfo] = useState<{ isMatch: boolean; count: number }>({
    isMatch: false,
    count: 0,
  });

  useEffect(() => {
    const res = detectPrewrittenScript(idea);
    setDetectedScriptInfo(res);
  }, [idea]);

  const handleApplySample = (sample: typeof SAMPLE_IDEAS[0]) => {
    setIdea(sample.description);
    setHasProduct(sample.hasProduct);
    if (!sample.hasProduct) setProductImage(null);
    setErrorMsg('');
    setIsSampleOpen(false);
  };

  const handleClearIdea = () => {
    setIdea('');
    setErrorMsg('');
  };

  const handleRandomIdea = async () => {
    if (isRandomizing) return;
    setIsRandomizing(true);
    setErrorMsg('');
    try {
      const selectedGenre = GENRES[currentGenreIndex];
      const generatedIdea = await generateRandomIdeaApi(selectedGenre);
      if (generatedIdea && generatedIdea.trim()) {
        setIdea(generatedIdea.trim());
      } else {
        setErrorMsg('Không thể sinh ý tưởng ngẫu nhiên, vui lòng thử lại.');
      }
      setCurrentGenreIndex((prev) => (prev + 1) % GENRES.length);
    } catch (err: any) {
      console.error('Lỗi khi sinh ý tưởng ngẫu nhiên:', err);
      setErrorMsg(err.message || 'Không thể kết nối đến AI. Vui lòng thử lại.');
    } finally {
      setIsRandomizing(false);
    }
  };

  const handleImageUpload = (e: React.ChangeEvent<HTMLInputElement>) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      setErrorMsg('Vui lòng chọn file hình ảnh hợp lệ (PNG, JPG, WEBP).');
      return;
    }
    if (file.size > 10 * 1024 * 1024) {
      setErrorMsg('Kích thước ảnh tối đa 10MB.');
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      setProductImage({
        dataUrl: reader.result as string,
        mimeType: file.type,
      });
      setErrorMsg('');
    };
    reader.readAsDataURL(file);
  };

  const handleSubmit = (e: React.FormEvent) => {
    e.preventDefault();
    if (!idea.trim()) {
      setErrorMsg('Vui lòng nhập mô tả ý tưởng hoặc dán kịch bản video của bạn.');
      return;
    }
    if (hasProduct && !productImage) {
      setErrorMsg('Vì bạn chọn video có sản phẩm, vui lòng tải ảnh sản phẩm lên để AI phân tích chi tiết.');
      return;
    }
    setErrorMsg('');

    // Check if user is submitting a pre-written SSOT script
    if (detectedScriptInfo.isMatch) {
      const parsed = parsePrewrittenScript(idea.trim());
      onApplyPrewrittenScript(parsed);
      return;
    }

    // Otherwise generate fresh script via AI
    onGenerateScript(idea.trim(), hasProduct, productImage);
  };

  return (
    <div className="max-w-5xl mx-auto py-6 px-4 sm:px-6">
      {/* Resume Active Project Banner (if available) */}
      {hasExistingProject && onResumeProject && (
        <div className="mb-6 p-3.5 sm:p-4 backdrop-blur-xl bg-indigo-950/40 border border-indigo-500/30 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-lg shadow-indigo-950/50">
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded-xl bg-indigo-500/20 border border-indigo-400/30 flex items-center justify-center text-indigo-300 shrink-0">
              <FileText className="w-4 h-4" />
            </div>
            <div>
              <div className="text-xs text-indigo-300 font-medium">Bạn đang có kịch bản đang mở:</div>
              <div className="text-sm font-bold text-white tracking-tight truncate max-w-md">{projectName}</div>
            </div>
          </div>
          <button
            type="button"
            onClick={onResumeProject}
            className="inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-md shadow-indigo-600/30 border border-indigo-400/30 cursor-pointer transition-all active:scale-95 shrink-0"
          >
            <span>Quay lại Bước {lastActiveStep}</span>
            <ArrowRight className="w-3.5 h-3.5" />
          </button>
        </div>
      )}

      <div className="text-center mb-8">
        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/15 border border-indigo-400/30 text-indigo-300 text-xs font-semibold mb-3 backdrop-blur-md">
          <Sparkles className="w-3.5 h-3.5 text-amber-400" />
          <span>Biến Ý Tưởng Thành Bộ Prompt AI Tạo Ảnh & Video Chuẩn Theo SSOT v4</span>
        </div>
        <h2 className="text-2xl sm:text-3xl font-bold text-white tracking-tight mb-2">
          Nhập Ý Tưởng Hoặc Dán Kịch Bản Video
        </h2>
        <p className="text-slate-400 text-sm max-w-2xl mx-auto">
          AI Studio sẽ tự động biên tập kịch bản thành các Scene Cards chi tiết, tạo prompt ảnh tham chiếu nhân vật & môi trường, và bộ prompt video cho từng cảnh dán sang Midjourney, Kling, Runway, Luma...
        </p>
      </div>

      <form
        onSubmit={handleSubmit}
        className="backdrop-blur-xl bg-white/[0.03] border border-white/10 rounded-2xl p-5 sm:p-7 shadow-2xl space-y-6"
      >
        {/* 1. Textarea Idea Input */}
        <div>
          <div className="flex items-center justify-between gap-2 mb-2">
            <label htmlFor="video-idea-input" className="block text-xs sm:text-sm font-semibold text-slate-200">
              1. Mô tả ý tưởng hoặc dán kịch bản đã có <span className="text-rose-400">*</span>
            </label>

            <div className="flex items-center gap-1.5">
              {/* Nút Xóa văn bản (Hình cây chổi/cục tẩy) */}
              {idea && idea.trim().length > 0 && (
                <button
                  type="button"
                  onClick={handleClearIdea}
                  className="w-9 h-9 aspect-square shrink-0 rounded-xl bg-rose-500/15 hover:bg-rose-500/30 border border-rose-400/30 backdrop-blur-md flex items-center justify-center text-rose-300 transition-all cursor-pointer active:scale-95 shadow-sm group"
                  title="Xóa nhanh nội dung ô nhập"
                >
                  <Eraser className="w-4 h-4 text-rose-300 group-hover:rotate-12 transition-transform" />
                </button>
              )}

              {/* Nút Tạo ý tưởng ngẫu nhiên */}
              <button
                type="button"
                onClick={handleRandomIdea}
                disabled={isRandomizing}
                className="w-9 h-9 aspect-square shrink-0 rounded-xl bg-indigo-500/15 hover:bg-indigo-500/30 border border-indigo-400/30 backdrop-blur-md flex items-center justify-center text-indigo-300 transition-all cursor-pointer active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm"
                title="Thử một ý tưởng ngẫu nhiên"
              >
